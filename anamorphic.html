<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anamorphic Sculpture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #666666; }
    canvas { display: block; }
    #ui {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 10;
    }
    #ui button {
      background: rgba(255,255,255,0.10);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 10px 24px; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; font-family: monospace;
      transition: background 0.2s;
    }
    #ui button:hover { background: rgba(255,255,255,0.20); }
    #label {
      position: fixed; top: 28px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.18); font-size: 10px;
      letter-spacing: 0.22em; text-transform: uppercase;
      font-family: monospace; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="label">Rotate to Reveal</div>
  <div id="ui">
    <button id="btn-front">Front View</button>
    <button id="btn-orbit">Orbit View</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ─── Renderer ─── */
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x666666);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    /* ─── Orthographic Camera ─── */
    const FRUSTUM = 4.2;
    let aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(
      -FRUSTUM * aspect, FRUSTUM * aspect,
       FRUSTUM, -FRUSTUM,
       0.01, 200
    );
    camera.position.set(0, 0, 30);
    camera.lookAt(0, 0, 0);

    /* ─── Lighting: flat/graphic, minimal shadows ─── */
    scene.add(new THREE.AmbientLight(0xffffff, 0.88));
    const keyL = new THREE.DirectionalLight(0xffffff, 0.45);
    keyL.position.set(1, 3, 20);
    scene.add(keyL);
    const rimL = new THREE.DirectionalLight(0xffffff, 0.50);
    rimL.position.set(-7, -3, 7);
    scene.add(rimL);

    /* ─── OrbitControls ─── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = false;
    controls.zoomSpeed = 0.7;
    controls.rotateSpeed = 0.65;

    /* ─── Materials ─── */
    const matBlack = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.85, metalness: 0 });
    const matPink  = new THREE.MeshStandardMaterial({ color: 0xe85ad5, roughness: 0.78, metalness: 0 });

    /* ─── Utility ─── */
    function buildArcPoints(cx, cy, r, startA, endA, seg) {
      const pts = [];
      for (let i = 0; i <= seg; i++) {
        const a = startA + (endA - startA) * (i / seg);
        pts.push(new THREE.Vector2(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
      }
      return pts;
    }

    function makeExtrude(shape, depth) {
      const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 64 });
      geo.translate(0, 0, -depth / 2);
      return geo;
    }

    /* ══════════════════════════════════════════════════════
       BLACK OBJECT

       Image1 silhouette:
         • Horizontal base bar (full width, thin)
         • Thin vertical stem rising from center of base
         • Quarter-ring arc from stem top sweeping left+down

       Anamorphic 3D:
         • Each piece has different extrusion depth
         • Each piece rotated on Y by different amounts
         • From Z+: projections align → flat 2D mark
         • Rotated: non-coplanar depths revealed
    ══════════════════════════════════════════════════════ */

    const blackGroup = new THREE.Group();
    scene.add(blackGroup);

    // ── BASE BAR ──
    {
      const s = new THREE.Shape();
      s.moveTo(-2.55,  0.27);
      s.lineTo( 2.55,  0.27);
      s.lineTo( 2.55, -0.27);
      s.lineTo(-2.55, -0.27);
      s.closePath();
      const m = new THREE.Mesh(makeExtrude(s, 0.42), matBlack);
      // Right side recedes, left comes forward
      m.rotation.y = -0.22;
      m.position.set(0, 0, 0);
      blackGroup.add(m);
    }

    // ── STEM ──
    {
      const sw = 0.18;
      const s = new THREE.Shape();
      s.moveTo(-sw, 0);
      s.lineTo( sw, 0);
      s.lineTo( sw, 2.68);
      s.lineTo(-sw, 2.68);
      s.closePath();
      const m = new THREE.Mesh(makeExtrude(s, 1.9), matBlack);
      // Left side recedes, right comes forward
      m.rotation.y = 0.28;
      m.position.set(0, 0.27, 0);
      blackGroup.add(m);
    }

    // ── QUARTER-RING ARC ──
    // Outer=1.58, Inner=0.84 → thick ring
    // Arc from 90° to 180° (stem top → sweeps left+down)
    {
      const outerR = 1.58;
      const innerR = 0.84;
      const SEG    = 64;

      const s = new THREE.Shape();
      // Outer arc: 90° → 180° (counter-clockwise)
      const outPts = buildArcPoints(0, 0, outerR, Math.PI / 2, Math.PI, SEG);
      s.moveTo(outPts[0].x, outPts[0].y);
      outPts.slice(1).forEach(p => s.lineTo(p.x, p.y));
      // Inner arc: 180° → 90° (clockwise = reversing)
      const inPts = buildArcPoints(0, 0, innerR, Math.PI, Math.PI / 2, SEG);
      inPts.forEach(p => s.lineTo(p.x, p.y));
      s.closePath();

      const m = new THREE.Mesh(makeExtrude(s, 0.58), matBlack);
      // Arc pivot = junction of stem top + stem left edge
      // Stem top world-y = 0.27 + 2.68 = 2.95; left edge x = -0.18
      m.position.set(-0.18, 2.95, 0);
      // Arc's 90° start = (0, outerR) → this is directly above pivot → aligns with stem top
      // Y-rotation: far left end of arc protrudes forward
      m.rotation.y = -0.32;
      m.rotation.x =  0.09;
      blackGroup.add(m);
    }

    // Center group vertically in scene
    blackGroup.position.set(0, -1.55, 0);

    /* ══════════════════════════════════════════════════════
       PINK OBJECT — C-arc ring sector (ExtrudeGeometry)

       Image1 silhouette:
         • Thick C-stroke arc, opens LEFT
         • Top tip near right end of base bar
         • Bottom tip pointing down-right

       Image2 reference (rotated view):
         • Reveals as a large flat tilted slab/panel
         • The extrusion depth IS the hidden dimension

       Implementation:
         • 2D shape = ring sector (outer - inner arc)
         • Large extrusion depth (2.8 units)
         • Y-rotation tilts the slab so rotating the camera
           reveals the full panel face
         • From front: clean C silhouette (face of extrusion)
         • Rotated: large flat slab + curved top/bottom faces
    ══════════════════════════════════════════════════════ */

    {
      const outerR = 1.26;
      const innerR = 0.80;  // stroke width = 0.46
      const SEG    = 72;

      // C opens LEFT: arc from -18° to -198° (goes clockwise in image1)
      const startA = -0.31;               // ~ -18°
      const endA   = -(Math.PI + 0.33);   // ~ -199°

      const s = new THREE.Shape();
      // Outer arc: startA → endA (going more negative = CW in screen coords)
      const outPts = buildArcPoints(0, 0, outerR, startA, endA, SEG);
      s.moveTo(outPts[0].x, outPts[0].y);
      outPts.slice(1).forEach(p => s.lineTo(p.x, p.y));
      // Inner arc: endA → startA (reverse)
      const inPts = buildArcPoints(0, 0, innerR, endA, startA, SEG);
      inPts.forEach(p => s.lineTo(p.x, p.y));
      s.closePath();

      const geo = new THREE.ExtrudeGeometry(s, {
        depth: 2.8,
        bevelEnabled: false,
        curveSegments: 72
      });
      // Center extrusion: front face at z=+1.4, back face at z=-1.4
      geo.translate(0, 0, -1.4);

      const m = new THREE.Mesh(geo, matPink);

      // Tilt on Y: makes the slab angled — from front still sees the C-face
      // but rotating reveals the large angled panel (like image2)
      m.rotation.y = -0.30;
      // Slight X tilt for ribbon-like spatial quality
      m.rotation.x = -0.08;

      // Position: C sits below-right, top-right tip meets base bar right end
      // Base bar right end is at (2.55, 0) in blackGroup local → world (2.55, -1.55)
      // C top tip at startA: (cos(-0.31)*1.26, sin(-0.31)*1.26) ≈ (1.21, -0.38)
      // Offset to align: world position of C center
      m.position.set(1.20, -1.60, 0.0);

      scene.add(m);
    }

    /* ─── Camera animation helpers ─── */
    const FRONT_POS    = new THREE.Vector3(0, 0, 30);
    const FRONT_TARGET = new THREE.Vector3(0, 0, 0);
    const ORBIT_POS    = new THREE.Vector3(6, 3.5, 20);
    const ORBIT_TARGET = new THREE.Vector3(0, 0, 0);

    let animating = false;
    const aniState = {
      from: new THREE.Vector3(), to: new THREE.Vector3(),
      tgtFrom: new THREE.Vector3(), tgtTo: new THREE.Vector3(),
      t: 0
    };

    function startCameraAnim(toPos, toTgt) {
      aniState.from.copy(camera.position);
      aniState.to.copy(toPos);
      aniState.tgtFrom.copy(controls.target);
      aniState.tgtTo.copy(toTgt);
      aniState.t = 0;
      animating = true;
      controls.enabled = false;
    }

    document.getElementById('btn-front').addEventListener('click', () =>
      startCameraAnim(FRONT_POS, FRONT_TARGET));
    document.getElementById('btn-orbit').addEventListener('click', () =>
      startCameraAnim(ORBIT_POS, ORBIT_TARGET));

    /* ─── Resize ─── */
    window.addEventListener('resize', () => {
      aspect = window.innerWidth / window.innerHeight;
      camera.left   = -FRUSTUM * aspect;
      camera.right  =  FRUSTUM * aspect;
      camera.top    =  FRUSTUM;
      camera.bottom = -FRUSTUM;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ─── Render loop ─── */
    const clock = new THREE.Clock();
    const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (animating) {
        aniState.t = Math.min(1, aniState.t + dt * 1.3);
        const e = ease(aniState.t);
        camera.position.lerpVectors(aniState.from, aniState.to, e);
        controls.target.lerpVectors(aniState.tgtFrom, aniState.tgtTo, e);
        camera.lookAt(controls.target);
        camera.updateProjectionMatrix();
        if (aniState.t >= 1) { animating = false; controls.enabled = true; }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
