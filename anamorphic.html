<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anamorphic Sculpture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #666666; }
    canvas { display: block; }
    #ui {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 10;
    }
    #ui button {
      background: rgba(255,255,255,0.10);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 10px 24px; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; font-family: monospace;
      transition: background 0.2s;
    }
    #ui button:hover { background: rgba(255,255,255,0.20); }
    #label {
      position: fixed; top: 28px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.18); font-size: 10px;
      letter-spacing: 0.22em; text-transform: uppercase;
      font-family: monospace; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="label">Rotate to Reveal</div>
  <div id="ui">
    <button id="btn-front">Front View</button>
    <button id="btn-orbit">Orbit View</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ─── Renderer ─── */
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x666666);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    /* ─── Orthographic Camera ─── */
    const frustum = 4.2;
    let aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(
      -frustum * aspect, frustum * aspect,
       frustum, -frustum,
       0.01, 200
    );
    camera.position.set(0, 0, 30);
    camera.lookAt(0, 0, 0);

    /* ─── Lighting — flat/graphic feel ─── */
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 0.4);
    key.position.set(2, 4, 20);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xffffff, 0.55);
    rim.position.set(-6, -2, 8);
    scene.add(rim);

    /* ─── Controls ─── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = false;
    controls.zoomSpeed = 0.7;
    controls.rotateSpeed = 0.65;

    /* ─── Materials ─── */
    const matBlack = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.85, metalness: 0 });
    const matPink  = new THREE.MeshStandardMaterial({ color: 0xe85ad5, roughness: 0.80, metalness: 0 });

    /* ══════════════════════════════════════════════════
       BLACK OBJECT
       Frontal silhouette = image1:
         • Thin vertical stem (center)
         • Quarter-ring arc from top of stem sweeping left+down
         • Wide horizontal base bar (full width)

       Anamorphic 3D: each piece extruded thick and rotated
       on Y axis independently, so from Z+ they align flat
       but rotating reveals non-coplanar depth.
    ══════════════════════════════════════════════════ */

    const blackGroup = new THREE.Group();
    scene.add(blackGroup);

    // ─ Shape helper: extrude + center z ─
    function extrude(shape, depth, bevel = false) {
      const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel });
      geo.translate(0, 0, -depth / 2);
      return geo;
    }

    // ─ BASE BAR ─
    // Wide horizontal slab across full width
    {
      const s = new THREE.Shape();
      s.moveTo(-2.6,  0.28);
      s.lineTo( 2.6,  0.28);
      s.lineTo( 2.6, -0.28);
      s.lineTo(-2.6, -0.28);
      s.closePath();
      const mesh = new THREE.Mesh(extrude(s, 0.5), matBlack);
      // Tilt: right side recedes into page, left comes forward
      mesh.rotation.y = -0.20;
      mesh.position.set(0, 0, -0.08);
      blackGroup.add(mesh);
    }

    // ─ STEM ─
    // Thin tall rectangle rising from center of base bar
    {
      const sw = 0.185;
      const s = new THREE.Shape();
      s.moveTo(-sw, 0.0);
      s.lineTo( sw, 0.0);
      s.lineTo( sw, 2.65);
      s.lineTo(-sw, 2.65);
      s.closePath();
      const mesh = new THREE.Mesh(extrude(s, 1.6), matBlack);
      // Tilt opposite direction: right side pushes forward
      mesh.rotation.y = 0.30;
      mesh.position.set(0, 0.28, 0);
      blackGroup.add(mesh);
    }

    // ─ QUARTER-RING ARC ─
    // Annulus from 90° to 180° (top of stem → sweeps left+down)
    // outer=1.55, inner=0.82 → thick ring
    {
      const outerR = 1.55;
      const innerR = 0.82;
      const seg    = 64;

      const s = new THREE.Shape();
      // outer arc: CCW from 90° to 180°
      for (let i = 0; i <= seg; i++) {
        const a = Math.PI / 2 + (Math.PI / 2) * (i / seg);
        const x = Math.cos(a) * outerR;
        const y = Math.sin(a) * outerR;
        if (i === 0) s.moveTo(x, y);
        else s.lineTo(x, y);
      }
      // inner arc: CW from 180° to 90°
      for (let i = 0; i <= seg; i++) {
        const a = Math.PI - (Math.PI / 2) * (i / seg);
        s.lineTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
      }
      s.closePath();

      const mesh = new THREE.Mesh(extrude(s, 0.55), matBlack);
      // Pivot at junction of stem top-left edge
      // stem center x=0, stem top y=2.65+0.28=2.93, stem left edge x=-0.185
      mesh.position.set(-0.185, 2.93, 0.0);
      // Arc's 90° start points right (0,outerR) — we need it to point up from stem top
      // Rotate arc so 90° end connects to stem top → already correct since arc starts at 90°
      // Y-tilt: left end protrudes forward, right recedes
      mesh.rotation.y = -0.35;
      mesh.rotation.x =  0.10;
      blackGroup.add(mesh);
    }

    // Center the whole black group vertically
    blackGroup.position.set(0.05, -1.5, 0);

    /* ══════════════════════════════════════════════════
       PINK OBJECT — C-curve arc
       Frontal silhouette = image1:
         • Thick C-arc below the base bar
         • Opens to the LEFT
         • Starts at top-right, curves down and around to bottom-right

       Image2 reference shows that when rotated, the C becomes
       a large angled flat slab + curved bottom strip.

       Implementation:
       - TubeGeometry on a 3D arc path
       - Path is a C that also curves SIGNIFICANTLY in Z:
         top of C → forward, bottom → forward, middle → backward
       - This gives the "flat surface reveals depth" effect
    ══════════════════════════════════════════════════ */

    class CArcCurve extends THREE.Curve {
      getPoint(t) {
        // Arc from -15° to -195° → C opening left
        const startA = -0.26;   // rad (~-15°)
        const endA   = -Math.PI - 0.35;  // rad (~-195°)
        const a = startA + t * (endA - startA);

        const r = 1.15;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;

        // Z: top of arc (t≈0) comes forward, middle goes back, bottom (t≈1) comes forward
        // This makes the C feel like a bent flat sheet in 3D
        const zCurve = -Math.sin(t * Math.PI) * 1.4;

        // Slight X warp at the tips for natural ribbon-end flare
        const xWarp = Math.sin(t * Math.PI) * 0.06;

        return new THREE.Vector3(x + xWarp, y, zCurve);
      }
    }

    const cCurve = new CArcCurve();
    // Elliptical-ish cross section by scaling the tube mesh
    const tubeGeo = new THREE.TubeGeometry(cCurve, 120, 0.23, 18, false);
    const tubeMesh = new THREE.Mesh(tubeGeo, matPink);

    // Position to match image1: C sits below-right of base bar
    // Base bar center is at (0, 0) in blackGroup local, blackGroup.y = -1.5
    // So base bar world y = -1.5. C should start near right end of base bar.
    tubeMesh.position.set(0.45, -1.38, 0.0);
    // Slight X scale so it reads as a thicker ribbon when rotated
    tubeMesh.scale.set(1, 1, 1);
    scene.add(tubeMesh);

    /* ─── Camera animation ─── */
    const FRONT_POS    = new THREE.Vector3(0, 0, 30);
    const FRONT_TARGET = new THREE.Vector3(0, 0, 0);
    const ORBIT_POS    = new THREE.Vector3(6, 3.5, 20);
    const ORBIT_TARGET = new THREE.Vector3(0, 0, 0);

    let animating = false;
    let aniFrom   = new THREE.Vector3();
    let aniTo     = new THREE.Vector3();
    let aniTgtFrom = new THREE.Vector3();
    let aniTgtTo   = new THREE.Vector3();
    let aniT = 0;

    function startCameraAnim(toPos, toTgt) {
      aniFrom.copy(camera.position);
      aniTo.copy(toPos);
      aniTgtFrom.copy(controls.target);
      aniTgtTo.copy(toTgt);
      aniT = 0;
      animating = true;
      controls.enabled = false;
    }

    document.getElementById('btn-front').addEventListener('click', () =>
      startCameraAnim(FRONT_POS, FRONT_TARGET));
    document.getElementById('btn-orbit').addEventListener('click', () =>
      startCameraAnim(ORBIT_POS, ORBIT_TARGET));

    /* ─── Resize ─── */
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      aspect = w / h;
      camera.left   = -frustum * aspect;
      camera.right  =  frustum * aspect;
      camera.top    =  frustum;
      camera.bottom = -frustum;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    /* ─── Render loop ─── */
    const clock = new THREE.Clock();
    const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (animating) {
        aniT = Math.min(1, aniT + dt * 1.3);
        const e = ease(aniT);
        camera.position.lerpVectors(aniFrom, aniTo, e);
        controls.target.lerpVectors(aniTgtFrom, aniTgtTo, e);
        camera.lookAt(controls.target);
        camera.updateProjectionMatrix();
        if (aniT >= 1) { animating = false; controls.enabled = true; }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
