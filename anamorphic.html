<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anamorphic Sculpture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #666666; font-family: monospace; }
    canvas { display: block; }
    #ui {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10;
    }
    #ui button {
      background: rgba(0,0,0,0.18);
      color: rgba(255,255,255,0.80);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 9px 22px; font-size: 10px;
      letter-spacing: 0.16em; text-transform: uppercase;
      cursor: pointer; font-family: monospace;
      transition: background 0.15s;
    }
    #ui button:hover { background: rgba(0,0,0,0.32); color: #fff; }
  </style>
</head>
<body>
  <div id="ui">
    <button id="btn-front">Front</button>
    <button id="btn-orbit">Orbit</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── Renderer ── */
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x666666);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    /* ── Orthographic camera ── */
    const FRUS = 3.0;
    let asp = window.innerWidth / window.innerHeight;
    const cam = new THREE.OrthographicCamera(
      -FRUS * asp, FRUS * asp, FRUS, -FRUS, 0.01, 200
    );
    cam.position.set(0, 0, 30);
    cam.lookAt(0, 0, 0);

    /* ── Flat graphic lighting ── */
    scene.add(new THREE.AmbientLight(0xffffff, 0.90));
    const kL = new THREE.DirectionalLight(0xffffff, 0.42);
    kL.position.set(0, 4, 22);
    scene.add(kL);
    const rL = new THREE.DirectionalLight(0xffffff, 0.50);
    rL.position.set(-7, -2, 7);
    scene.add(rL);

    /* ── Controls ── */
    const ctrl = new OrbitControls(cam, renderer.domElement);
    ctrl.enableDamping = true;
    ctrl.dampingFactor = 0.07;
    ctrl.enablePan = false;
    ctrl.zoomSpeed = 0.65;
    ctrl.rotateSpeed = 0.60;

    /* ── Materials ── */
    const mBlk = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.88, metalness: 0 });
    const mPnk = new THREE.MeshStandardMaterial({ color: 0xe85ad5, roughness: 0.78, metalness: 0 });

    /* ── Arc point helper ── */
    function arcPts(r, a0, a1, n) {
      return Array.from({ length: n + 1 }, (_, i) => {
        const a = a0 + (a1 - a0) * i / n;
        return new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r);
      });
    }

    /* ════════════════════════════════════════════════════════════
       BLACK OBJECT

       Image2 (front view) silhouette — SINGLE closed 2D shape:

         Shape = L-shape with the OUTER top-left corner replaced
         by a large smooth quarter-circle arc.

         Coordinates (arc center at local origin):
           arc center  = (0, 0)  [at base-top level, stem-left edge]
           arc 90°     = (0, R)  → stem top-left corner
           arc 180°    = (-R, 0) → base bar top-left end

         Full outline:
           (0, R)  ← stem top-left
           arc CCW 90°→180°  →  (-R, 0)  ← base top-left
           (-R, -2bh)        ← base bottom-left
           (sw+br, -2bh)     ← base bottom-right
           (sw+br, 0)        ← base top-right
           (sw, 0)           ← stem-right meets base
           (sw, R)           ← stem top-right
           close → (0, R)    ← stem top cap (short horizontal)

       Anamorphic 3D:
         Extrusion depth 2.0, rotation.y +0.22
         Rotating camera reveals the thick slab + depth differences
    ════════════════════════════════════════════════════════════ */

    {
      const R  = 2.40;   // arc radius = stem height above base
      const sw = 0.32;   // stem width (to the right of arc center)
      const bh = 0.27;   // base half-height  (total base h = 0.54)
      const br = 0.88;   // base right extension beyond stem

      const s = new THREE.Shape();
      s.moveTo(0, R);
      // Quarter-circle arc: CCW from 90° to 180° (upper-left quadrant)
      s.absarc(0, 0, R, Math.PI / 2, Math.PI, false);
      s.lineTo(-R,     -2 * bh);
      s.lineTo(sw + br,-2 * bh);
      s.lineTo(sw + br, 0);
      s.lineTo(sw,      0);
      s.lineTo(sw,      R);
      s.closePath();  // → back to (0, R)

      const geo = new THREE.ExtrudeGeometry(s, {
        depth: 2.0, bevelEnabled: false, curveSegments: 96
      });
      geo.translate(0, 0, -1.0);  // center extrusion at z=0

      const m = new THREE.Mesh(geo, mBlk);
      // Tilt: right side of shape pushes forward, left recedes
      m.rotation.y = 0.22;
      m.position.set(0, 0, 0);
      scene.add(m);
    }

    /* ════════════════════════════════════════════════════════════
       PINK OBJECT

       Image2 (front view): thick C-arc stroke below the base bar,
         opening to the LEFT, top tip meeting the base bar right end.

       Image1 (3D rotated view): large angled flat slab + curved strip
         → the 3.2-unit extrusion depth, revealed when rotating.

       Geometry:
         Ring sector: outer R=1.48, inner R=0.95, stroke=0.53
         startA = 1.05 rad (~60°) → top tip aligns with base-right end
         Sweep 200° clockwise → endA = -2.44 rad (~-140°)

       Position calibrated so top tip aligns exactly with
       base bar right end in orthographic front projection.
    ════════════════════════════════════════════════════════════ */

    {
      const OR     = 1.48;
      const IR     = 0.95;
      const startA =  1.05;                            // ~60°
      const endA   =  startA - (200 * Math.PI / 180); // CW 200° → ~-82°... -2.44 rad

      const N = 90;
      const s = new THREE.Shape();

      // outer arc: startA → endA (decreasing = CW direction)
      const op = arcPts(OR, startA, endA, N);
      s.moveTo(op[0].x, op[0].y);
      op.slice(1).forEach(p => s.lineTo(p.x, p.y));

      // inner arc: endA → startA (increasing = CCW, closes the ring)
      const ip = arcPts(IR, endA, startA, N);
      ip.forEach(p => s.lineTo(p.x, p.y));

      s.closePath();

      const geo = new THREE.ExtrudeGeometry(s, {
        depth: 3.2, bevelEnabled: false, curveSegments: 90
      });
      geo.translate(0, 0, -1.6);

      const m = new THREE.Mesh(geo, mPnk);
      m.rotation.y = -0.25;
      m.rotation.x = -0.05;

      /* Position so tip aligns with base bar right end:
         Base right local = (sw+br, 0) = (1.20, 0)
         After black rot.y=0.22: world X ≈ 1.20 * cos(0.22) ≈ 1.171
         Tip local = (OR*cos(startA), OR*sin(startA)) = (0.736, 1.283)
         After pink rot.y=-0.25: X contribution ≈ 0.736 * cos(0.25) ≈ 0.713
         px = 1.171 - 0.713 = 0.458
         py = 0    - 1.283 = -1.283                                  */
      m.position.set(0.458, -1.283, 0);
      scene.add(m);
    }

    /* ── Camera presets ── */
    const FRONT  = new THREE.Vector3(0, 0, 30);
    const ORBIT  = new THREE.Vector3(6.5, 4.0, 16);
    const CENTER = new THREE.Vector3(0, 0, 0);

    let animating = false;
    const A = {
      fp: new THREE.Vector3(), tp: new THREE.Vector3(),
      ft: new THREE.Vector3(), tt: new THREE.Vector3(),
      t: 0, spd: 1.35
    };

    function goTo(pos, tgt) {
      A.fp.copy(cam.position); A.tp.copy(pos);
      A.ft.copy(ctrl.target);  A.tt.copy(tgt);
      A.t = 0; animating = true; ctrl.enabled = false;
    }

    document.getElementById('btn-front').addEventListener('click', () => goTo(FRONT, CENTER));
    document.getElementById('btn-orbit').addEventListener('click', () => goTo(ORBIT, CENTER));

    /* ── Auto-hint: orbit briefly then return to front ── */
    let autoPhase = 0;
    ctrl.addEventListener('start', () => { autoPhase = 3; });

    setTimeout(() => {
      if (autoPhase !== 0) return;
      autoPhase = 1;
      goTo(ORBIT, CENTER);
    }, 800);

    /* ── Resize ── */
    window.addEventListener('resize', () => {
      asp = window.innerWidth / window.innerHeight;
      cam.left = -FRUS * asp; cam.right = FRUS * asp;
      cam.top  =  FRUS;       cam.bottom = -FRUS;
      cam.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ── Render loop ── */
    const clock = new THREE.Clock();
    const ease  = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

    function frame() {
      requestAnimationFrame(frame);
      const dt = clock.getDelta();

      if (animating) {
        A.t = Math.min(1, A.t + dt * A.spd);
        const e = ease(A.t);
        cam.position.lerpVectors(A.fp, A.tp, e);
        ctrl.target.lerpVectors(A.ft, A.tt, e);
        cam.lookAt(ctrl.target);
        cam.updateProjectionMatrix();

        if (A.t >= 1) {
          animating = false; ctrl.enabled = true;
          if (autoPhase === 1) {
            autoPhase = 2;
            setTimeout(() => { if (autoPhase === 2) goTo(FRONT, CENTER); }, 1200);
          } else if (autoPhase === 2) {
            autoPhase = 3;
          }
        }
      }

      ctrl.update();
      renderer.render(scene, cam);
    }
    frame();
  </script>
</body>
</html>
