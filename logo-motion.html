<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Motion — Entrance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Fixed 1440×810 stage ─────────────────────────────────────── */
  #stage {
    position: relative;
    width: 1440px;
    height: 810px;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* ── Soft light bloom behind the logo circle ─────────────────────
     A large, heavily blurred, pure-white radial wash — no color tint —
     so the mark reads as a real light source instead of a flat disc. */
  #logo-halo {
    position: absolute;
    width: 560px;
    height: 560px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.38) 0%,
      rgba(255,255,255,0.16) 30%,
      rgba(255,255,255,0.05) 55%,
      rgba(255,255,255,0) 78%);
    filter: blur(12px);
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  /* ── Big logo circle (the "O" of SPOT) ──────────────────────────── */
  #logo-circle {
    position: absolute;
    width: 206px;
    height: 206px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 60%, #f1f1f1 100%);
    opacity: 0;
    will-change: opacity, box-shadow;
  }

  /* ── Dot-matrix glyph pieces ──────────────────────────────────────
     Every stroke of "SPOT LIGHT" starts life as a small round spark
     (a .dot, or a .bar collapsed down to dot-width) so the whole word
     can twinkle like the rest of the field before it resolves. A .bar
     grows by animating its actual width (not a transform scale) so
     its rounded ends stay true circular arcs the whole way, instead
     of squashing into a flat-sided blob mid-stretch. */
  .dot, .bar {
    position: absolute;
    height: 26px;
    border-radius: 9999px;
    background: radial-gradient(circle, #ffffff 55%, #f1f1f1 100%);
    opacity: 0;
    transform: translate(-50%, -50%);
    will-change: opacity, box-shadow, width;
  }

  .dot { width: 26px; }
</style>
</head>
<body>

<div id="stage">
  <div id="logo-halo"></div>
  <div id="logo-circle"></div>
</div>

<script>
(function () {
'use strict';

const stage  = document.getElementById('stage');
const circle = document.getElementById('logo-circle');
const halo   = document.getElementById('logo-halo');

// ── Dot-matrix font ───────────────────────────────────────────────
// Each letter is a small grid (col, row). A 'bar' spans columns c1–c2
// on one row and renders as a pill; a 'dot' is a single stroke joint.
// The "O" of SPOT is the big circle itself, so it isn't in this font.
const COL_W = 62, ROW_H = 52, DOT_D = 26, LETTER_GAP = 40;

const FONT = {
  S: { cols: 4, segs: [
    ['bar', 0, 3, 0], ['dot', 0, 1], ['bar', 0, 3, 2], ['dot', 3, 3], ['bar', 0, 3, 4],
  ]},
  P: { cols: 3, segs: [
    ['bar', 0, 2, 0], ['dot', 0, 1], ['dot', 2, 1], ['bar', 0, 2, 2], ['dot', 0, 3], ['dot', 0, 4],
  ]},
  T: { cols: 3, segs: [
    ['bar', 0, 2, 0], ['dot', 1, 1], ['dot', 1, 2], ['dot', 1, 3], ['dot', 1, 4],
  ]},
  L: { cols: 3, segs: [
    ['dot', 0, 0], ['dot', 0, 1], ['dot', 0, 2], ['dot', 0, 3], ['bar', 0, 2, 4],
  ]},
  I: { cols: 1, segs: [
    ['dot', 0, 0], ['dot', 0, 1], ['dot', 0, 2], ['dot', 0, 3], ['dot', 0, 4],
  ]},
  G: { cols: 4, segs: [
    ['bar', 0, 3, 0], ['dot', 0, 1], ['dot', 0, 2], ['bar', 2, 3, 2],
    ['dot', 0, 3], ['dot', 3, 3], ['bar', 0, 3, 4],
  ]},
  H: { cols: 3, segs: [
    ['dot', 0, 0], ['dot', 2, 0], ['dot', 0, 1], ['dot', 2, 1],
    ['bar', 0, 2, 2], ['dot', 0, 3], ['dot', 2, 3], ['dot', 0, 4], ['dot', 2, 4],
  ]},
};

function letterWidth(ch) { return (FONT[ch].cols - 1) * COL_W + DOT_D; }

// Lays a word out left to right starting at (x0, baseY); returns the
// absolute glyph pieces and the x position right after the last letter.
function layoutWord(word, x0, baseY) {
  const pieces = [];
  let x = x0;
  for (const ch of word) {
    for (const s of FONT[ch].segs) {
      if (s[0] === 'bar') {
        const [, c1, c2, row] = s;
        pieces.push({
          type: 'bar',
          cx: x + (c1 + c2) / 2 * COL_W,
          cy: baseY + row * ROW_H,
          w:  (c2 - c1) * COL_W + DOT_D,
        });
      } else {
        const [, col, row] = s;
        pieces.push({ type: 'dot', cx: x + col * COL_W, cy: baseY + row * ROW_H });
      }
    }
    x += letterWidth(ch) + LETTER_GAP;
  }
  return { pieces, endX: x - LETTER_GAP };
}

// "SPOT" — S and P to the left of the O, T to its right, gapped off
// the O's own fixed geometry so the word stays visually locked to it.
const O_CX = 810, O_R = 103, TOP_BASE_Y = 267;
const spLayout = layoutWord('SP', 0, TOP_BASE_Y);
const spWidth  = spLayout.endX;
const spStartX = (O_CX - O_R - LETTER_GAP) - spWidth;
const { pieces: spPieces } = layoutWord('SP', spStartX, TOP_BASE_Y);
const { pieces: tPieces }  = layoutWord('T', O_CX + O_R + LETTER_GAP, TOP_BASE_Y);

// "LIGHT" — centered under the SPOT lock-up's overall span.
const BOTTOM_BASE_Y = 497;
const rawLight = layoutWord('LIGHT', 0, BOTTOM_BASE_Y);
const lightStartX = spStartX + ((O_CX + O_R + LETTER_GAP + letterWidth('T')) - spStartX - rawLight.endX) / 2;
const { pieces: lightPieces } = layoutWord('LIGHT', lightStartX, BOTTOM_BASE_Y);

const ALL_PIECES = [...spPieces, ...tPieces, ...lightPieces];

const glyphs = ALL_PIECES.map(p => {
  const el = document.createElement('div');
  if (p.type === 'bar') {
    el.className = 'bar';
    el.style.left = p.cx + 'px';
    el.style.top  = p.cy + 'px';
    // Starts at dot-width so it reads as a plain spark like everything
    // else in the field; resolve() grows its width open into the pill.
    el.dataset.fullWidth = p.w;
    el.style.width = DOT_D + 'px';
  } else {
    el.className = 'dot';
    el.style.left = p.cx + 'px';
    el.style.top  = p.cy + 'px';
  }
  stage.appendChild(el);
  return el;
});

function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }

// Pure white bloom, two soft layers — blur scales with opacity so the
// glow grows and fades in step with the light itself (no snapping).
function setDotGlow(el, v, maxBlur) {
  el.style.boxShadow = v > 0
    ? `0 0 ${maxBlur * v}px rgba(255,255,255,${0.8 * v}),
       0 0 ${maxBlur * 2.3 * v}px rgba(255,255,255,${0.32 * v})`
    : 'none';
}

// ── Twinkle scheduler ─────────────────────────────────────────────
// Independent random on/off flicker over every glyph piece (dots and
// collapsed bars alike — both just read as sparks at this point).
// Idle (maxLit = 0) until woken by startDots(); fast and busy once
// running; frozen once resolve() locks the word into place.
const MAX_LIT_IDLE = 0;
const MAX_LIT_FAST = 11;
let maxLit = MAX_LIT_IDLE;
let litCount = 0;
let dotsStarted = false;
let locked = false;

function twinkleLoop() {
  if (locked) return;
  if (litCount >= maxLit) { setTimeout(twinkleLoop, rnd(30, 90)); return; }

  const pool = glyphs.filter(d => !d.dataset.lit);
  if (!pool.length) { setTimeout(twinkleLoop, 120); return; }

  const el = pool[Math.floor(Math.random() * pool.length)];
  el.dataset.lit = '1';
  litCount++;

  const peak = rnd(0.6, 1);
  el.style.transition = `opacity ${rnd(30, 90)}ms ease-out, box-shadow ${rnd(30, 90)}ms ease-out`;
  el.style.opacity = peak;
  setDotGlow(el, peak, 12);

  const holdTime = rnd(70, 220);
  setTimeout(() => {
    if (locked) return; // formation already locked in — leave it lit
    el.style.transition = `opacity ${rnd(90, 220)}ms ease-in, box-shadow ${rnd(90, 220)}ms ease-in`;
    el.style.opacity = 0;
    setDotGlow(el, 0, 12);
    setTimeout(() => { delete el.dataset.lit; litCount--; }, 240);
  }, holdTime);

  setTimeout(twinkleLoop, rnd(30, 110));
}

// Wake the field: switch to the fast/busy regime and seed a quick
// little burst so several pick up almost at once.
function startDots() {
  if (dotsStarted) return;
  dotsStarted = true;
  maxLit = MAX_LIT_FAST;
  twinkleLoop();
  setTimeout(twinkleLoop, rnd(40, 110));
  setTimeout(twinkleLoop, rnd(110, 200));
  setTimeout(twinkleLoop, rnd(200, 320));
}
twinkleLoop(); // scheduler runs immediately but stays dormant (maxLit = 0) until startDots()

// ── Logo circle helpers ──────────────────────────────────────────────
const EASE_IN     = 'cubic-bezier(0.22, 0.61, 0.36, 1)';    // slow-settling rise
const EASE_OUT    = 'cubic-bezier(0.55, 0.06, 0.68, 0.19)'; // heavy, slowing fall
const EASE_SPRING = 'cubic-bezier(0.34, 1.56, 0.64, 1)';    // snappy, springy landing

function setTransition(dur, easing) {
  const t = `opacity ${dur}ms ${easing}, box-shadow ${dur}ms ${easing}`;
  circle.style.transition = t;
  halo.style.transition   = `opacity ${dur}ms ${easing}`;
}

function setCircleOpacity(v, maxBlur) {
  circle.style.opacity = v;
  halo.style.opacity   = v * 0.9;
  circle.style.boxShadow = v > 0
    ? `0 0 ${maxBlur * v}px rgba(255,255,255,${0.85 * v}),
       0 0 ${maxBlur * 2.4 * v}px rgba(255,255,255,${0.35 * v})`
    : 'none';
}

// ── Resolve: the reveal ──────────────────────────────────────────────
// After the random twinkle has played for a while, every spark snaps
// into "SPOT LIGHT" — dots settle into place, and each bar stretches
// sideways from its collapsed spark into the full stroke. A short
// random stagger plus a springy, slightly overshooting ease keeps the
// whole thing feeling snappy and alive rather than mechanical or slow.
function resolve() {
  locked = true;

  setTransition(420, EASE_SPRING);
  setCircleOpacity(1, 46);

  glyphs.forEach(el => {
    const delay = rnd(0, 150);
    const isBar = el.classList.contains('bar');
    setTimeout(() => {
      el.dataset.lit = '1';
      if (isBar) {
        el.style.transition =
          `opacity 260ms ease-out, width 460ms ${EASE_SPRING}, box-shadow 320ms ease-out`;
        el.style.width = el.dataset.fullWidth + 'px';
      } else {
        el.style.transition = `opacity 300ms ease-out, box-shadow 300ms ease-out`;
      }
      el.style.opacity = 1;
      setDotGlow(el, 1, 12);
    }, delay);
  });
}

// ── Sequence: a single, slow, deliberate light-up ────────────────────
// The O fades in — no strobing — holds, then fades out just as slowly.
// Just before it's fully dark, the field wakes into a fast random
// twinkle; after that plays for a while, everything resolves together,
// snappily, into "SPOT LIGHT" and holds there.
function ignite() {
  setTransition(0, 'linear');
  setCircleOpacity(0, 0);

  setTimeout(() => {
    const fadeInDur = 1700;
    setTransition(fadeInDur, EASE_IN);
    setCircleOpacity(1, 46);

    setTimeout(() => {
      const holdTime = rnd(2200, 2800);

      setTimeout(() => {
        const fadeOutDur = 2200;
        setTransition(fadeOutDur, EASE_OUT);
        setCircleOpacity(0, 0);

        const wakeDots = fadeOutDur - 550;
        setTimeout(startDots, wakeDots);
        setTimeout(resolve, wakeDots + 2400);
      }, holdTime);
    }, fadeInDur);
  }, rnd(350, 550));
}

// ── Boot ──────────────────────────────────────────────────────────
ignite();

}());
</script>
</body>
</html>
