<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Motion — Entrance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Fixed 1440×810 stage ─────────────────────────────────────── */
  #stage {
    position: relative;
    width: 1440px;
    height: 810px;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* ── Soft light bloom behind the logo circle ─────────────────────
     A large, heavily blurred, pure-white radial wash — no color tint —
     so the mark reads as a real light source instead of a flat disc. */
  #logo-halo {
    position: absolute;
    width: 560px;
    height: 560px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.38) 0%,
      rgba(255,255,255,0.16) 30%,
      rgba(255,255,255,0.05) 55%,
      rgba(255,255,255,0) 78%);
    filter: blur(12px);
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  /* ── Big logo circle (the "O" of SPOT) ──────────────────────────── */
  #logo-circle {
    position: absolute;
    width: 206px;
    height: 206px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 60%, #f1f1f1 100%);
    opacity: 0;
    will-change: opacity, box-shadow;
  }

  /* ── Dot-matrix glyph pieces ──────────────────────────────────────
     Every stroke of "SPOT LIGHT" starts life as a small round spark
     (a .dot, or a .bar collapsed down to dot-width) so the whole word
     can twinkle like the rest of the field before it resolves. A .bar
     grows by animating its actual width (not a transform scale) so
     its rounded ends stay true circular arcs the whole way, instead
     of squashing into a flat-sided blob mid-stretch. */
  .bar {
    position: absolute;
    height: 24px;
    border-radius: 9999px;
    background: radial-gradient(circle, #ffffff 55%, #f1f1f1 100%);
    opacity: 0;
    transform: translate(-50%, -50%);
    will-change: opacity, box-shadow, width;
  }

  /* ── Site chrome: top nav bar & bottom bar ────────────────────────
     Both sit outside the twinkle field entirely — they don't spark or
     twinkle, they just wait at opacity 0, offset above/below their
     resting spot, until the reveal fires them in together with the
     logo's stretch-open. */
  #topbar, #bottombar {
    position: absolute;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 52px;
    opacity: 0;
    transition: opacity 780ms cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 780ms cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: opacity, transform;
  }

  #topbar {
    top: 0;
    height: 92px;
    transform: translateY(-46px);
  }

  #bottombar {
    bottom: 0;
    height: 68px;
    transform: translateY(46px);
  }

  #topbar.reveal, #bottombar.reveal {
    opacity: 1;
    transform: translateY(0);
  }

  #topbar .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.1em;
    color: #ffffff;
  }

  #topbar .brand .o-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 60%, #f1f1f1 100%);
    box-shadow: 0 0 9px rgba(255,255,255,0.75);
  }

  #topbar nav {
    display: flex;
    gap: 38px;
  }

  #topbar nav a {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    color: #b9b9b9;
    text-decoration: none;
  }

  #topbar nav a.active {
    color: #ffffff;
    text-decoration: underline;
    text-underline-offset: 7px;
  }

  #topbar .lang {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
  }

  #topbar .lang svg { width: 12px; height: 12px; }

  #bottombar {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #8f8f8f;
  }

  #bottombar .links {
    display: flex;
    gap: 28px;
  }

  #bottombar a {
    color: #b9b9b9;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  /* ── Exhibition subtitle above the mark ────────────────────────── */
  #subtitle {
    position: absolute;
    top: 204px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 19px;
    color: #b0b0b0;
    opacity: 0;
    transition: opacity 900ms ease-out;
  }

  #subtitle.reveal { opacity: 1; }
</style>
</head>
<body>

<div id="stage">
  <div id="logo-halo"></div>
  <div id="logo-circle"></div>

  <header id="topbar">
    <div class="brand">SP<span class="o-dot"></span>T&nbsp;LIGHT</div>
    <nav>
      <a href="#" class="active">About</a>
      <a href="#">Zone A</a>
      <a href="#">Zone B</a>
      <a href="#">Zone C</a>
      <a href="#">Book</a>
    </nav>
    <div class="lang">KR
      <svg viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </header>

  <div id="subtitle">2026 COMANOVA Second Edition Exhibition</div>

  <footer id="bottombar">
    <div>© 2026 Degital Media Design. All Rights Reserved</div>
    <div class="links">
      <a href="#">OFFICIAL PAGE</a>
      <a href="#">BEHANCE</a>
    </div>
  </footer>
</div>

<script>
(function () {
'use strict';

const stage    = document.getElementById('stage');
const circle   = document.getElementById('logo-circle');
const halo     = document.getElementById('logo-halo');
const topbar   = document.getElementById('topbar');
const bottombar = document.getElementById('bottombar');
const subtitle = document.getElementById('subtitle');

// ── Glyph pieces ──────────────────────────────────────────────────
// Exact stroke geometry traced from the real logo file (logo.ai): every
// pill's center and width below is the actual designer coordinate for
// "SPOT LIGHT" (translated/scaled only to align its O with #logo-circle
// at 810,360 — the O itself is that circle, so it isn't in this list).
const DOT_D = 24;

const PIECES = [
  {cx:330.4,cy:499.79,w:39.17},
  {cx:330.4,cy:529.93,w:39.17},
  {cx:330.4,cy:560.06,w:39.17},
  {cx:330.4,cy:590.19,w:39.17},
  {cx:330.4,cy:620.32,w:39.17},
  {cx:330.4,cy:650.45,w:39.17},
  {cx:390.66,cy:680.58,w:159.7},
  {cx:540.16,cy:499.79,w:99.43},
  {cx:540.16,cy:529.93,w:39.17},
  {cx:540.16,cy:560.06,w:39.17},
  {cx:540.16,cy:590.19,w:39.17},
  {cx:540.16,cy:620.32,w:39.17},
  {cx:540.16,cy:650.45,w:39.17},
  {cx:540.16,cy:680.58,w:99.43},
  {cx:689.67,cy:499.79,w:99.43},
  {cx:629.4,cy:529.93,w:39.17},
  {cx:749.93,cy:529.93,w:39.17},
  {cx:629.4,cy:560.06,w:39.17},
  {cx:629.4,cy:590.19,w:39.17},
  {cx:734.86,cy:590.19,w:69.3},
  {cx:629.4,cy:620.32,w:39.17},
  {cx:749.93,cy:620.32,w:39.17},
  {cx:629.4,cy:650.45,w:39.17},
  {cx:749.93,cy:650.45,w:39.17},
  {cx:704.73,cy:680.58,w:129.56},
  {cx:809.03,cy:499.79,w:39.17},
  {cx:929.56,cy:499.79,w:39.17},
  {cx:809.03,cy:529.93,w:39.17},
  {cx:929.56,cy:529.93,w:39.17},
  {cx:809.03,cy:560.06,w:39.17},
  {cx:929.56,cy:560.06,w:39.17},
  {cx:869.3,cy:590.19,w:159.7},
  {cx:809.03,cy:620.32,w:39.17},
  {cx:929.56,cy:620.32,w:39.17},
  {cx:809.03,cy:650.45,w:39.17},
  {cx:929.56,cy:650.45,w:39.17},
  {cx:809.03,cy:680.58,w:39.17},
  {cx:929.56,cy:680.58,w:39.17},
  {cx:1048.93,cy:499.79,w:159.7},
  {cx:1048.93,cy:529.93,w:39.17},
  {cx:1048.93,cy:560.06,w:39.17},
  {cx:1048.93,cy:590.19,w:39.17},
  {cx:1048.93,cy:620.32,w:39.17},
  {cx:1048.93,cy:650.45,w:39.17},
  {cx:1048.93,cy:680.58,w:39.17},
  {cx:992.85,cy:269.61,w:159.7},
  {cx:992.85,cy:299.74,w:39.17},
  {cx:992.85,cy:329.88,w:39.17},
  {cx:992.85,cy:360.01,w:39.17},
  {cx:992.85,cy:390.14,w:39.17},
  {cx:992.85,cy:420.27,w:39.17},
  {cx:992.85,cy:450.4,w:39.17},
  {cx:427.58,cy:270.16,w:99.43},
  {cx:367.32,cy:300.29,w:39.17},
  {cx:487.85,cy:300.29,w:39.17},
  {cx:367.32,cy:330.43,w:39.17},
  {cx:427.58,cy:360.56,w:99.43},
  {cx:487.85,cy:390.69,w:39.17},
  {cx:367.32,cy:420.82,w:39.17},
  {cx:487.85,cy:420.82,w:39.17},
  {cx:427.58,cy:450.95,w:99.43},
  {cx:592.15,cy:270.16,w:129.56},
  {cx:546.95,cy:300.29,w:39.17},
  {cx:667.48,cy:300.29,w:39.17},
  {cx:546.95,cy:330.43,w:39.17},
  {cx:667.48,cy:330.43,w:39.17},
  {cx:592.15,cy:360.56,w:129.56},
  {cx:546.95,cy:390.69,w:39.17},
  {cx:546.95,cy:420.82,w:39.17},
  {cx:546.95,cy:450.95,w:39.17},
];

const glyphs = PIECES.map(p => {
  const el = document.createElement('div');
  el.className = 'bar';
  el.style.left = p.cx + 'px';
  el.style.top  = p.cy + 'px';
  // Starts at dot-width so it reads as a plain spark like everything
  // else in the field; resolve() grows its width open into the pill.
  el.dataset.fullWidth = p.w;
  el.style.width = DOT_D + 'px';
  stage.appendChild(el);
  return el;
});

function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }

// Pure white bloom, two soft layers — blur scales with opacity so the
// glow grows and fades in step with the light itself (no snapping).
function setDotGlow(el, v, maxBlur) {
  el.style.boxShadow = v > 0
    ? `0 0 ${maxBlur * v}px rgba(255,255,255,${0.8 * v}),
       0 0 ${maxBlur * 2.3 * v}px rgba(255,255,255,${0.32 * v})`
    : 'none';
}

// ── Twinkle scheduler ─────────────────────────────────────────────
// Independent random on/off flicker over every glyph piece (dots and
// collapsed bars alike — both just read as sparks at this point).
// Idle (maxLit = 0) until woken by startDots(); fast and busy once
// running; frozen once resolve() locks the word into place.
const MAX_LIT_IDLE = 0;
const MAX_LIT_FAST = 11;
let maxLit = MAX_LIT_IDLE;
let litCount = 0;
let dotsStarted = false;
let locked = false;

function twinkleLoop() {
  if (locked) return;
  if (litCount >= maxLit) { setTimeout(twinkleLoop, rnd(30, 90)); return; }

  const pool = glyphs.filter(d => !d.dataset.lit);
  if (!pool.length) { setTimeout(twinkleLoop, 120); return; }

  const el = pool[Math.floor(Math.random() * pool.length)];
  el.dataset.lit = '1';
  litCount++;

  const peak = rnd(0.6, 1);
  el.style.transition = `opacity ${rnd(30, 90)}ms ease-out, box-shadow ${rnd(30, 90)}ms ease-out`;
  el.style.opacity = peak;
  setDotGlow(el, peak, 12);

  const holdTime = rnd(70, 220);
  setTimeout(() => {
    if (locked) return; // formation already locked in — leave it lit
    el.style.transition = `opacity ${rnd(90, 220)}ms ease-in, box-shadow ${rnd(90, 220)}ms ease-in`;
    el.style.opacity = 0;
    setDotGlow(el, 0, 12);
    setTimeout(() => { delete el.dataset.lit; litCount--; }, 240);
  }, holdTime);

  setTimeout(twinkleLoop, rnd(30, 110));
}

// Wake the field: switch to the fast/busy regime and seed a quick
// little burst so several pick up almost at once.
function startDots() {
  if (dotsStarted) return;
  dotsStarted = true;
  maxLit = MAX_LIT_FAST;
  twinkleLoop();
  setTimeout(twinkleLoop, rnd(40, 110));
  setTimeout(twinkleLoop, rnd(110, 200));
  setTimeout(twinkleLoop, rnd(200, 320));
}
twinkleLoop(); // scheduler runs immediately but stays dormant (maxLit = 0) until startDots()

// ── Logo circle helpers ──────────────────────────────────────────────
const EASE_IN     = 'cubic-bezier(0.22, 0.61, 0.36, 1)';    // slow-settling rise
const EASE_OUT    = 'cubic-bezier(0.55, 0.06, 0.68, 0.19)'; // heavy, slowing fall
const EASE_SPRING = 'cubic-bezier(0.31, 1.9, 0.6, 1)';      // punchy, overshooting spring

function setTransition(dur, easing) {
  const t = `opacity ${dur}ms ${easing}, box-shadow ${dur}ms ${easing}`;
  circle.style.transition = t;
  halo.style.transition   = `opacity ${dur}ms ${easing}`;
}

function setCircleOpacity(v, maxBlur) {
  circle.style.opacity = v;
  halo.style.opacity   = v * 0.9;
  circle.style.boxShadow = v > 0
    ? `0 0 ${maxBlur * v}px rgba(255,255,255,${0.85 * v}),
       0 0 ${maxBlur * 2.4 * v}px rgba(255,255,255,${0.35 * v})`
    : 'none';
}

// ── Resolve: the reveal ──────────────────────────────────────────────
// After the random twinkle has played for a while, every spark snaps
// into "SPOT LIGHT". Instead of a near-simultaneous random pop, the
// stretch fires as an outward beat from the O — pieces closest to it
// go first, farther ones follow on a short delay — so the reveal reads
// as a driving, rhythmic pulse instead of a soft, all-at-once blob.
// The stretch itself eases slow-to-fast — a held, anticipatory start
// that then accelerates hard into a springy overshoot at the end.
const O_CX = 810, O_CY = 360;
const WAVE_SPAN = 260;
const maxDist = Math.max(...PIECES.map(p => Math.hypot(p.cx - O_CX, p.cy - O_CY)));
const EASE_STRETCH = 'cubic-bezier(0.65, 0, 0.35, 1.45)'; // slow start, fast whip, overshoot

function resolve() {
  locked = true;

  setTransition(320, EASE_SPRING);
  setCircleOpacity(1, 46);

  // Site chrome comes in at the exact same moment as the stretch —
  // top bar slides down + fades in, bottom bar slides up + fades in.
  topbar.classList.add('reveal');
  bottombar.classList.add('reveal');
  subtitle.classList.add('reveal');

  glyphs.forEach((el, i) => {
    const p = PIECES[i];
    const dist = Math.hypot(p.cx - O_CX, p.cy - O_CY);
    const delay = (dist / maxDist) * WAVE_SPAN + rnd(0, 25);
    setTimeout(() => {
      el.dataset.lit = '1';
      el.style.transition =
        `opacity 260ms ease-out, width 680ms ${EASE_STRETCH}, box-shadow 500ms ${EASE_STRETCH}`;
      el.style.width = el.dataset.fullWidth + 'px';
      el.style.opacity = 1;
      setDotGlow(el, 1, 12);
    }, delay);
  });
}

// ── Sequence: a single, slow, deliberate light-up ────────────────────
// The O fades in — no strobing — holds, then fades out just as slowly.
// Just before it's fully dark, the field wakes into a fast random
// twinkle; after that plays for a while, everything resolves together,
// snappily, into "SPOT LIGHT" and holds there.
function ignite() {
  setTransition(0, 'linear');
  setCircleOpacity(0, 0);

  setTimeout(() => {
    const fadeInDur = 1700;
    setTransition(fadeInDur, EASE_IN);
    setCircleOpacity(1, 46);

    setTimeout(() => {
      const holdTime = rnd(2200, 2800);

      setTimeout(() => {
        const fadeOutDur = 2200;
        setTransition(fadeOutDur, EASE_OUT);
        setCircleOpacity(0, 0);

        const wakeDots = fadeOutDur - 550;
        setTimeout(startDots, wakeDots);
        setTimeout(resolve, wakeDots + 2400);
      }, holdTime);
    }, fadeInDur);
  }, rnd(350, 550));
}

// ── Boot ──────────────────────────────────────────────────────────
ignite();

}());
</script>
</body>
</html>
