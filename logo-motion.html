<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Motion — Entrance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Fixed 1440×810 stage ─────────────────────────────────────── */
  #stage {
    position: relative;
    width: 1440px;
    height: 810px;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* ── Soft light bloom sitting behind the logo circle ────────────
     A large blurred radial wash that brightens the black around the
     mark, so the circle reads as an actual light source rather than
     a flat lit shape. */
  #logo-halo {
    position: absolute;
    width: 640px;
    height: 640px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,247,222,0.55) 0%,
      rgba(255,240,205,0.24) 32%,
      rgba(255,232,190,0.08) 55%,
      rgba(255,232,190,0) 75%);
    filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  /* ── Big logo circle (the "O") ───────────────────────────────── */
  #logo-circle {
    position: absolute;
    width: 206px;
    height: 206px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ffffff 0%, #fffaf0 55%, #ffedc8 100%);
    opacity: 0;
    will-change: opacity, box-shadow;
  }

  /* ── Scatter dots ─────────────────────────────────────────────── */
  .dot {
    position: absolute;
    width: 24px;
    height: 24px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ffffff 0%, #fdf4e2 100%);
    opacity: 0;
    will-change: opacity, box-shadow;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="logo-halo"></div>
  <div id="logo-circle"></div>
</div>

<script>
(function () {
'use strict';

const stage  = document.getElementById('stage');
const circle = document.getElementById('logo-circle');
const halo   = document.getElementById('logo-halo');

// ── Dot layout (approximated from the reference stills) ─────────────
const DOT_POS = [
  { x: 594,  y: 271 }, { x: 365,  y: 302 }, { x: 667,  y: 332 },
  { x: 994,  y: 362 }, { x: 547,  y: 392 }, { x: 426,  y: 453 },
  { x: 328,  y: 502 }, { x: 809,  y: 502 }, { x: 931,  y: 533 },
  { x: 1051, y: 502 }, { x: 1051, y: 563 }, { x: 539,  y: 563 },
  { x: 629,  y: 593 }, { x: 328,  y: 623 }, { x: 809,  y: 623 },
  { x: 539,  y: 654 }, { x: 389,  y: 684 }, { x: 707,  y: 684 },
  { x: 809,  y: 684 }, { x: 994,  y: 271 }, { x: 994,  y: 453 },
];

const dots = DOT_POS.map(p => {
  const el = document.createElement('div');
  el.className = 'dot';
  el.style.left = p.x + 'px';
  el.style.top  = p.y + 'px';
  stage.appendChild(el);
  return el;
});

function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }

// Layered warm-white bloom — several stacked shadows read as a much
// stronger, more "real" light source than a single soft edge.
function setGlow(el, on, blur) {
  el.style.boxShadow = on
    ? `0 0 ${blur}px rgba(255,246,222,0.95),
       0 0 ${blur * 2.1}px rgba(255,235,195,0.55),
       0 0 ${blur * 4}px rgba(255,220,165,0.28)`
    : 'none';
}

// ── Dot twinkle scheduler ────────────────────────────────────────────
// Independent random on/off flicker, quick and busy once started.
const MAX_LIT = 8;
let litCount = 0;
let dotsStarted = false;

function twinkleLoop() {
  if (litCount >= MAX_LIT) { setTimeout(twinkleLoop, rnd(30, 90)); return; }

  const pool = dots.filter(d => !d.dataset.lit);
  if (!pool.length) { setTimeout(twinkleLoop, 120); return; }

  const el = pool[Math.floor(Math.random() * pool.length)];
  el.dataset.lit = '1';
  litCount++;

  const peak = rnd(0.6, 1);
  el.style.transition = `opacity ${rnd(30, 90)}ms ease-out`;
  el.style.opacity = peak;
  setGlow(el, true, rnd(6, 14));

  const holdTime = rnd(70, 220);
  setTimeout(() => {
    el.style.transition = `opacity ${rnd(90, 220)}ms ease-in`;
    el.style.opacity = 0;
    setGlow(el, false, 0);
    setTimeout(() => { delete el.dataset.lit; litCount--; }, 240);
  }, holdTime);

  setTimeout(twinkleLoop, rnd(30, 110));
}

// Seed a fast little burst so several dots pick up almost at once.
function startDots() {
  if (dotsStarted) return;
  dotsStarted = true;
  twinkleLoop();
  setTimeout(twinkleLoop, rnd(40, 110));
  setTimeout(twinkleLoop, rnd(110, 200));
  setTimeout(twinkleLoop, rnd(200, 320));
}

// ── Logo circle: spotlight ignition cycle ───────────────────────────
// Sequence on load is fixed: the O snaps on alone first — nothing
// else in the frame — holds solid, and only as it starts to dim does
// the dot field wake up and begin its faster, random twinkle. After
// that first beat the circle keeps cycling on/off/breathing forever
// while the dots twinkle continuously and independently.
function setTransition(dur, easing) {
  const t = `opacity ${dur}ms ${easing || 'linear'}`;
  circle.style.transition = t;
  halo.style.transition   = t;
}

function setCircleOpacity(v, glowBlur) {
  circle.style.opacity = v;
  halo.style.opacity   = v * 0.92;
  setGlow(circle, v > 0, glowBlur || 0);
}

function flickerBurst(steps, done) {
  let i = 0;
  function step() {
    if (i >= steps.length) { done && done(); return; }
    const [op, dur, blur] = steps[i++];
    setTransition(dur, 'linear');
    setCircleOpacity(op, blur);
    setTimeout(step, dur);
  }
  step();
}

let firstRun = true;

function circleCycle() {
  // 1) dark pause
  setTransition(0);
  setCircleOpacity(0, 0);

  setTimeout(() => {
    // 2) ignite: irregular rapid flicker like a bulb starting up,
    //    landing decisively lit — the "딱" snap-on moment.
    const igniteSteps = [
      [0.35, 35, 10], [0,    45, 0],
      [0.6,  30, 18], [0.1,  50, 4],
      [0.8,  40, 24], [0.2,  35, 8],
      [1,    60, 34], [0.55, 45, 18],
      [1,    75, 38],
    ];
    flickerBurst(igniteSteps, () => {
      // 3) hold solid — alone in frame on the very first run.
      setTransition(600, 'ease-out');
      setCircleOpacity(1, 38);

      const fullHold = firstRun ? rnd(750, 950) : rnd(450, 700);

      setTimeout(() => {
        // 4) begins to dim — this is the cue that wakes the dot field.
        setTransition(rnd(550, 750), 'ease-in-out');
        setCircleOpacity(0.74, 24);

        if (firstRun) {
          firstRun = false;
          startDots();
        }

        setTimeout(() => {
          setTransition(rnd(600, 850), 'ease-in-out');
          setCircleOpacity(1, 38);
        }, 680);
      }, fullHold);

      const onTime = rnd(2000, 3200);
      setTimeout(() => {
        // 5) flicker-out, then loop back to the dark pause.
        const outSteps = [
          [0.4, 35, 12], [0.9, 25, 30], [0.15, 45, 6],
          [0.7, 30, 22], [0,   80, 0],
        ];
        flickerBurst(outSteps, () => setTimeout(circleCycle, rnd(500, 1100)));
      }, onTime);
    });
  }, firstRun ? rnd(250, 450) : rnd(900, 1900));
}

// ── Boot ──────────────────────────────────────────────────────────
circleCycle();

}());
</script>
</body>
</html>
