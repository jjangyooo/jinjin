<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Motion — Entrance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Fixed 1440×810 stage ─────────────────────────────────────── */
  #stage {
    position: relative;
    width: 1440px;
    height: 810px;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* ── Soft light bloom behind the logo circle ─────────────────────
     A large, heavily blurred, pure-white radial wash — no color tint —
     so the mark reads as a real light source instead of a flat disc. */
  #logo-halo {
    position: absolute;
    width: 560px;
    height: 560px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.38) 0%,
      rgba(255,255,255,0.16) 30%,
      rgba(255,255,255,0.05) 55%,
      rgba(255,255,255,0) 78%);
    filter: blur(12px);
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  /* ── Big logo circle (the "O") ───────────────────────────────── */
  #logo-circle {
    position: absolute;
    width: 206px;
    height: 206px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 60%, #f1f1f1 100%);
    opacity: 0;
    will-change: opacity, box-shadow;
  }

  /* ── Scatter dots ─────────────────────────────────────────────── */
  .dot {
    position: absolute;
    width: 24px;
    height: 24px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 55%, #f1f1f1 100%);
    opacity: 0;
    will-change: opacity, box-shadow;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="logo-halo"></div>
  <div id="logo-circle"></div>
</div>

<script>
(function () {
'use strict';

const stage  = document.getElementById('stage');
const circle = document.getElementById('logo-circle');
const halo   = document.getElementById('logo-halo');

// ── Dot layout ────────────────────────────────────────────────────
// The full mark: the original loose scatter around the O, plus the
// denser vertical columns that complete the lock-up shown in the
// final reference still. All of it twinkles randomly at first; the
// resolve() pass below is what snaps it into this exact formation.
const DOT_POS = [
  // loose scatter (upper field)
  { x: 594,  y: 271 }, { x: 365,  y: 302 }, { x: 667,  y: 332 },
  { x: 994,  y: 362 }, { x: 547,  y: 392 }, { x: 426,  y: 453 },
  { x: 328,  y: 502 }, { x: 809,  y: 502 }, { x: 931,  y: 533 },
  { x: 1051, y: 502 }, { x: 1051, y: 563 }, { x: 539,  y: 563 },
  { x: 629,  y: 593 }, { x: 328,  y: 623 }, { x: 809,  y: 623 },
  { x: 539,  y: 654 }, { x: 389,  y: 684 }, { x: 707,  y: 684 },
  { x: 809,  y: 684 }, { x: 994,  y: 271 }, { x: 994,  y: 453 },
  // vertical bar beside the O
  { x: 994,  y: 299 }, { x: 994,  y: 330 }, { x: 994,  y: 391 }, { x: 994,  y: 424 },
  // dense lower columns that complete the lock-up
  { x: 328,  y: 533 }, { x: 328,  y: 564 }, { x: 328,  y: 595 }, { x: 328,  y: 657 },
  { x: 539,  y: 502 }, { x: 539,  y: 533 }, { x: 539,  y: 595 }, { x: 539,  y: 626 },
  { x: 629,  y: 654 }, { x: 688,  y: 502 },
  { x: 809,  y: 533 }, { x: 809,  y: 563 }, { x: 809,  y: 595 }, { x: 809,  y: 654 },
  { x: 1051, y: 533 }, { x: 1051, y: 595 }, { x: 1051, y: 626 },
  { x: 1051, y: 657 }, { x: 1051, y: 684 },
];

const dots = DOT_POS.map(p => {
  const el = document.createElement('div');
  el.className = 'dot';
  el.style.left = p.x + 'px';
  el.style.top  = p.y + 'px';
  stage.appendChild(el);
  return el;
});

function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }

// Pure white bloom, two soft layers — blur scales with opacity so the
// glow grows and fades in step with the light itself (no snapping).
function setDotGlow(el, v, maxBlur) {
  el.style.boxShadow = v > 0
    ? `0 0 ${maxBlur * v}px rgba(255,255,255,${0.8 * v}),
       0 0 ${maxBlur * 2.3 * v}px rgba(255,255,255,${0.32 * v})`
    : 'none';
}

// ── Dot twinkle scheduler ────────────────────────────────────────────
// Independent random on/off flicker. Idle (maxLit = 0) until woken by
// startDots(); fast and busy once running; frozen once resolve() locks
// the field into the final formation.
const MAX_LIT_IDLE = 0;
const MAX_LIT_FAST = 11;
let maxLit = MAX_LIT_IDLE;
let litCount = 0;
let dotsStarted = false;
let locked = false;

function twinkleLoop() {
  if (locked) return;
  if (litCount >= maxLit) { setTimeout(twinkleLoop, rnd(30, 90)); return; }

  const pool = dots.filter(d => !d.dataset.lit);
  if (!pool.length) { setTimeout(twinkleLoop, 120); return; }

  const el = pool[Math.floor(Math.random() * pool.length)];
  el.dataset.lit = '1';
  litCount++;

  const peak = rnd(0.6, 1);
  el.style.transition = `opacity ${rnd(30, 90)}ms ease-out, box-shadow ${rnd(30, 90)}ms ease-out`;
  el.style.opacity = peak;
  setDotGlow(el, peak, 12);

  const holdTime = rnd(70, 220);
  setTimeout(() => {
    if (locked) return; // formation already locked in — leave it lit
    el.style.transition = `opacity ${rnd(90, 220)}ms ease-in, box-shadow ${rnd(90, 220)}ms ease-in`;
    el.style.opacity = 0;
    setDotGlow(el, 0, 12);
    setTimeout(() => { delete el.dataset.lit; litCount--; }, 240);
  }, holdTime);

  setTimeout(twinkleLoop, rnd(30, 110));
}

// Wake the dot field: switch to the fast/busy regime and seed a quick
// little burst so several pick up almost at once.
function startDots() {
  if (dotsStarted) return;
  dotsStarted = true;
  maxLit = MAX_LIT_FAST;
  twinkleLoop();
  setTimeout(twinkleLoop, rnd(40, 110));
  setTimeout(twinkleLoop, rnd(110, 200));
  setTimeout(twinkleLoop, rnd(200, 320));
}
twinkleLoop(); // scheduler runs immediately but stays dormant (maxLit = 0) until startDots()

// ── Logo circle helpers ──────────────────────────────────────────────
const EASE_IN  = 'cubic-bezier(0.22, 0.61, 0.36, 1)';    // slow-settling rise
const EASE_OUT = 'cubic-bezier(0.55, 0.06, 0.68, 0.19)'; // heavy, slowing fall
const EASE_SETTLE = 'cubic-bezier(0.16, 1, 0.3, 1)';     // soft, natural landing

function setTransition(dur, easing) {
  const t = `opacity ${dur}ms ${easing}, box-shadow ${dur}ms ${easing}`;
  circle.style.transition = t;
  halo.style.transition   = `opacity ${dur}ms ${easing}`;
}

function setCircleOpacity(v, maxBlur) {
  circle.style.opacity = v;
  halo.style.opacity   = v * 0.9;
  circle.style.boxShadow = v > 0
    ? `0 0 ${maxBlur * v}px rgba(255,255,255,${0.85 * v}),
       0 0 ${maxBlur * 2.4 * v}px rgba(255,255,255,${0.35 * v})`
    : 'none';
}

// ── Resolve: the reveal ──────────────────────────────────────────────
// After the random twinkle has played for a while, everything settles
// together into the fixed formation shown in the reference still — the
// O relights alongside the dots. Each dot lands with a small random
// delay so the reveal reads as one natural motion, not a mechanical
// snap, then the whole mark holds.
function resolve() {
  locked = true;

  setTransition(900, EASE_SETTLE);
  setCircleOpacity(1, 46);

  dots.forEach(el => {
    const delay = rnd(0, 240);
    setTimeout(() => {
      el.dataset.lit = '1';
      el.style.transition = `opacity 720ms ${EASE_SETTLE}, box-shadow 720ms ${EASE_SETTLE}`;
      el.style.opacity = 1;
      setDotGlow(el, 1, 12);
    }, delay);
  });
}

// ── Sequence: a single, slow, deliberate light-up ────────────────────
// The O fades in — no strobing — holds, then fades out just as slowly.
// Just before it's fully dark, the dot field wakes into a fast random
// twinkle; after that plays for a while, everything resolves together
// into the final formation and holds there.
function ignite() {
  setTransition(0, 'linear');
  setCircleOpacity(0, 0);

  setTimeout(() => {
    const fadeInDur = 1700;
    setTransition(fadeInDur, EASE_IN);
    setCircleOpacity(1, 46);

    setTimeout(() => {
      const holdTime = rnd(2200, 2800);

      setTimeout(() => {
        const fadeOutDur = 2200;
        setTransition(fadeOutDur, EASE_OUT);
        setCircleOpacity(0, 0);

        const wakeDots = fadeOutDur - 550;
        setTimeout(startDots, wakeDots);
        setTimeout(resolve, wakeDots + 3600);
      }, holdTime);
    }, fadeInDur);
  }, rnd(350, 550));
}

// ── Boot ──────────────────────────────────────────────────────────
ignite();

}());
</script>
</body>
</html>
