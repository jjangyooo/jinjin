<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Motion — Entrance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Fixed 1440×810 stage ─────────────────────────────────────── */
  #stage {
    position: relative;
    width: 1440px;
    height: 810px;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* ── Soft light bloom behind the logo circle ─────────────────────
     A large, heavily blurred, pure-white radial wash — no color tint —
     so the mark reads as a real light source instead of a flat disc. */
  #logo-halo {
    position: absolute;
    width: 560px;
    height: 560px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.38) 0%,
      rgba(255,255,255,0.16) 30%,
      rgba(255,255,255,0.05) 55%,
      rgba(255,255,255,0) 78%);
    filter: blur(12px);
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  /* ── Big logo circle (the "O" of SPOT) ──────────────────────────── */
  #logo-circle {
    position: absolute;
    width: 206px;
    height: 206px;
    left: 810px;
    top: 360px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 60%, #f1f1f1 100%);
    opacity: 0;
    will-change: opacity, box-shadow;
  }

  /* ── Dot-matrix glyph pieces ──────────────────────────────────────
     Every stroke of "SPOT LIGHT" starts life as a small round spark
     (a .dot, or a .bar collapsed down to dot-width) so the whole word
     can twinkle like the rest of the field before it resolves. A .bar
     grows by animating its actual width (not a transform scale) so
     its rounded ends stay true circular arcs the whole way, instead
     of squashing into a flat-sided blob mid-stretch. */
  .bar {
    position: absolute;
    height: 24px;
    border-radius: 9999px;
    background: radial-gradient(circle, #ffffff 55%, #f1f1f1 100%);
    opacity: 0;
    transform: translate(-50%, -50%);
    will-change: opacity, box-shadow, width;
  }

  /* ── Site chrome: top nav bar & bottom bar ────────────────────────
     Both sit outside the twinkle field entirely — they don't spark or
     twinkle, they just wait at opacity 0, offset above/below their
     resting spot, until the reveal fires them in together with the
     logo's stretch-open. The top bar's children are positioned with
     the exact pixel coordinates traced from the real top-bar file
     (top.ai, a 1440×80 asset) — same "no eyeballing" rule as the
     wordmark, so this can't drift out of place either. */
  #topbar, #bottombar {
    position: absolute;
    left: 0;
    right: 0;
    opacity: 0;
    transition: opacity 780ms cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 780ms cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: opacity, transform;
  }

  #topbar {
    top: 0;
    height: 80px;
    transform: translateY(-40px);
  }

  #bottombar {
    bottom: 0;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 52px;
    transform: translateY(40px);
  }

  #topbar.reveal, #bottombar.reveal {
    opacity: 1;
    transform: translateY(0);
  }

  /* Mini wordmark + nav + language switch, each a plain absolutely
     positioned piece at its traced (x, y) — no flex layout to drift. */
  #topbar .mini-piece {
    position: absolute;
    background: #ffffff;
    border-radius: 9999px;
  }

  #topbar .mini-o {
    position: absolute;
    background: radial-gradient(circle, #ffffff 60%, #f1f1f1 100%);
    border-radius: 50%;
  }

  #topbar > a, #topbar .lang, #topbar .underline {
    position: absolute;
  }

  #topbar > a {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 19px;
    line-height: 1;
    color: #b9b9b9;
    text-decoration: none;
    white-space: nowrap;
  }

  #topbar > a.active { color: #ffffff; }

  #topbar .underline {
    height: 2px;
    background: #ffffff;
  }

  #topbar .lang {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 19px;
    line-height: 1;
    font-weight: 600;
    color: #ffffff;
  }

  #bottombar {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #8f8f8f;
  }

  #bottombar .links {
    display: flex;
    gap: 28px;
  }

  #bottombar a {
    color: #b9b9b9;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  /* ── Exhibition subtitle above the mark ────────────────────────── */
  #subtitle {
    position: absolute;
    top: 204px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 19px;
    color: #b0b0b0;
    opacity: 0;
    transition: opacity 900ms ease-out;
  }

  #subtitle.reveal { opacity: 1; }
</style>

function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }

// Pure white bloom, two soft layers — blur scales with opacity so the
// glow grows and fades in step with the light itself (no snapping).
function setDotGlow(el, v, maxBlur) {
  el.style.boxShadow = v > 0
    ? `0 0 ${maxBlur * v}px rgba(255,255,255,${0.8 * v}),
       0 0 ${maxBlur * 2.3 * v}px rgba(255,255,255,${0.32 * v})`
    : 'none';
}

// ── Twinkle scheduler ─────────────────────────────────────────────
// Independent random on/off flicker over every glyph piece (dots and
// collapsed bars alike — both just read as sparks at this point).
// Idle (maxLit = 0) until woken by startDots(); fast and busy once
// running; frozen once resolve() locks the word into place.
const MAX_LIT_IDLE = 0;
const MAX_LIT_FAST = 11;
let maxLit = MAX_LIT_IDLE;
let litCount = 0;
let dotsStarted = false;
let locked = false;

// Deliberately wide random ranges — some sparks snap on/off almost
// instantly, others linger noticeably longer, so the field reads as
// having real tempo contrast rather than one uniform flicker speed.
function twinkleLoop() {
  if (locked) return;
  if (litCount >= maxLit) { setTimeout(twinkleLoop, rnd(20, 90)); return; }

  const pool = glyphs.filter(d => !d.dataset.lit);
  if (!pool.length) { setTimeout(twinkleLoop, 120); return; }

  const el = pool[Math.floor(Math.random() * pool.length)];
  el.dataset.lit = '1';
  litCount++;

  const peak = rnd(0.55, 1);
  el.style.transition = `opacity ${rnd(18, 160)}ms ease-out, box-shadow ${rnd(18, 160)}ms ease-out`;
  el.style.opacity = peak;
  setDotGlow(el, peak, 12);

  const holdTime = rnd(50, 340);
  setTimeout(() => {
    if (locked) return; // formation already locked in — leave it lit
    el.style.transition = `opacity ${rnd(60, 340)}ms ease-in, box-shadow ${rnd(60, 340)}ms ease-in`;
    el.style.opacity = 0;
    setDotGlow(el, 0, 12);
    setTimeout(() => { delete el.dataset.lit; litCount--; }, 340);
  }, holdTime);

  setTimeout(twinkleLoop, rnd(15, 170));
}

// Wake the field: switch to the fast/busy regime and seed a quick
// little burst so several pick up almost at once.
function startDots() {
  if (dotsStarted) return;
  dotsStarted = true;
  maxLit = MAX_LIT_FAST;
  twinkleLoop();
  setTimeout(twinkleLoop, rnd(30, 100));
  setTimeout(twinkleLoop, rnd(90, 190));
  setTimeout(twinkleLoop, rnd(180, 300));
}
twinkleLoop(); // scheduler runs immediately but stays dormant (maxLit = 0) until startDots()

// ── Logo circle helpers ──────────────────────────────────────────────
const EASE_IN     = 'cubic-bezier(0.22, 0.61, 0.36, 1)';    // slow-settling rise
const EASE_OUT    = 'cubic-bezier(0.55, 0.06, 0.68, 0.19)'; // heavy, slowing fall
const EASE_SPRING = 'cubic-bezier(0.31, 1.9, 0.6, 1)';      // punchy, overshooting spring

function setTransition(dur, easing) {
  const t = `opacity ${dur}ms ${easing}, box-shadow ${dur}ms ${easing}`;
  circle.style.transition = t;
  halo.style.transition   = `opacity ${dur}ms ${easing}`;
}

function setCircleOpacity(v, maxBlur) {
  circle.style.opacity = v;
  halo.style.opacity   = v * 0.9;
  circle.style.boxShadow = v > 0
    ? `0 0 ${maxBlur * v}px rgba(255,255,255,${0.85 * v}),
       0 0 ${maxBlur * 2.4 * v}px rgba(255,255,255,${0.35 * v})`
    : 'none';
}

// ── Resolve: the reveal ──────────────────────────────────────────────
// After the random twinkle has played for a while, every spark snaps
// into "SPOT LIGHT". Instead of a near-simultaneous random pop, the
// stretch fires as an outward beat from the O — pieces closest to it
// go first, farther ones follow on a short delay — so the reveal reads
// as a driving, rhythmic pulse instead of a soft, all-at-once blob.
// Each piece's own stretch is deliberately two-stage rather than one
// eased tween: a fast burst covers most of the width almost at once,
// then it drops into a long, elastic, slow-motion creep for the rest
// — like a fade-in that drags itself out — instead of building speed
// toward the end.
const O_CX = 810, O_CY = 360;
const WAVE_SPAN = 260;
const FAST_PORTION = 0.86;   // how much of the width the fast burst covers
const FAST_DUR = 150;        // that burst's duration
const SLOW_DUR = 700;        // the long, lingering settle for the remainder
const EASE_FAST = 'cubic-bezier(0.11, 0.9, 0.2, 1)';   // quick, near-instant launch
const EASE_SLOW = 'cubic-bezier(0.22, 1.2, 0.36, 1)';  // slow, slightly springy tail
const maxDist = Math.max(...PIECES.map(p => Math.hypot(p.cx - O_CX, p.cy - O_CY)));
// Site chrome waits until the stretch is roughly half done, not the
// instant it starts — half of the wave's full span plus the full
// two-stage stretch time.
const CHROME_DELAY = (WAVE_SPAN + FAST_DUR + SLOW_DUR) / 2;

function resolve() {
  locked = true;

  setTransition(320, EASE_SPRING);
  setCircleOpacity(1, 46);

  // Top bar slides down + fades in, bottom bar slides up + fades in —
  // timed to land once the stretch is about half finished, not at
  // the very moment it starts.
  setTimeout(() => {
    topbar.classList.add('reveal');
    bottombar.classList.add('reveal');
    subtitle.classList.add('reveal');
  }, CHROME_DELAY);

  glyphs.forEach((el, i) => {
    const p = PIECES[i];
    const dist = Math.hypot(p.cx - O_CX, p.cy - O_CY);
    const delay = (dist / maxDist) * WAVE_SPAN + rnd(0, 25);
    const fullWidth = parseFloat(el.dataset.fullWidth);
    const burstWidth = DOT_D + (fullWidth - DOT_D) * FAST_PORTION;
    setTimeout(() => {
      el.dataset.lit = '1';
      el.style.transition =
        `opacity 180ms ease-out, width ${FAST_DUR}ms ${EASE_FAST}, box-shadow ${FAST_DUR}ms ${EASE_FAST}`;
      el.style.width = burstWidth + 'px';
      el.style.opacity = 1;
      setDotGlow(el, 1, 12);

      setTimeout(() => {
        el.style.transition = `width ${SLOW_DUR}ms ${EASE_SLOW}, box-shadow ${SLOW_DUR}ms ${EASE_SLOW}`;
        el.style.width = fullWidth + 'px';
      }, FAST_DUR);
    }, delay);
  });
}

// ── Sequence: light up, blink twice (fast, then slower), cut out ─────
// The O snaps on, holds a beat, then blinks — a quick one first, then
// a visibly slower second one — before dropping out fast. The field
// wakes into its fast random twinkle exactly halfway through that
// final fade-out (not tucked right at the end), so the small lights'
// tempo-contrast twinkle is already going while the O is still
// visibly dimming, not just as an afterthought once it's gone.
function dip(offDur, onDur, next) {
  setTransition(offDur, EASE_OUT);
  setCircleOpacity(0.06, 5);
  setTimeout(() => {
    setTransition(onDur, EASE_IN);
    setCircleOpacity(1, 46);
    setTimeout(next, onDur);
  }, offDur);
}

function ignite() {
  setTransition(0, 'linear');
  setCircleOpacity(0, 0);

  setTimeout(() => {
    const fadeInDur = 500;
    setTransition(fadeInDur, EASE_IN);
    setCircleOpacity(1, 46);

    setTimeout(() => {
      // Blink 1: fast.
      dip(120, 140, () => {
        // Blink 2: noticeably slower.
        dip(300, 320, () => {
          setTimeout(() => {
            // Cut out — faster than the old single slow fade.
            const fadeOutDur = 800;
            setTransition(fadeOutDur, EASE_OUT);
            setCircleOpacity(0, 0);

            const wakeDots = fadeOutDur * 0.5;
            setTimeout(startDots, wakeDots);
            setTimeout(resolve, wakeDots + 1800);
          }, 70);
        });
      });
    }, fadeInDur);
  }, rnd(350, 550));
}

// ── Boot ──────────────────────────────────────────────────────────
ignite();

}());
</script>
