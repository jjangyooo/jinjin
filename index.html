<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTLIGHT — Coma Nova</title>
<style>
/* ── Matrix II OT (drop matrix-ii-ot.woff2 in this folder to activate) ── */
@font-face {
  font-family: 'Matrix II OT';
  src: url('matrix-ii-ot.woff2') format('woff2'),
       url('matrix-ii-ot.woff')  format('woff'),
       url('matrix-ii-ot.otf')   format('opentype');
  font-weight: 700;
  font-style: normal;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #040406;
  cursor: none;
}

/* ── POSTER WRAPPER ──────────────────────────────────────
   Dimensions set by JS to match poster.webp (1420×2000).  */
#poster-wrapper,
#hints-wrapper {
  position: fixed;
}

#poster-wrapper {
  z-index: 1;
}

#poster-wrapper img {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── DARKNESS CANVAS ────────────────────────────────────── */
#mask-canvas {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* ── HINTS WRAPPER ───────────────────────────────────────
   mix-blend-mode: difference on the wrapper ensures hints
   are visible in darkness but automatically disappear when
   the spotlight reveals the white poster beneath.

   Physics:  difference(white, dark≈0)  = 1  = white   ✓
             difference(white, cream≈1) ≈ 0  = invisible ✓  */
#hints-wrapper {
  z-index: 15;
  pointer-events: none;
  mix-blend-mode: difference;
}

.hw {
  position: absolute;
  color: #ffffff;
  opacity: 0;
  white-space: nowrap;
  font-family: 'Matrix II OT', Georgia, 'Times New Roman', serif;
  font-weight: 700;
  text-transform: uppercase;
  line-height: 1;
  letter-spacing: -0.01em;
  /* NO transition — hard cut */
}

.hw.lit {
  opacity: 1;
}

/* ── ORB CURSOR ─────────────────────────────────────────── */
#orb {
  position: fixed;
  top: 0; left: 0;
  z-index: 20;
  border-radius: 50%;
  pointer-events: none;
  will-change: transform;
  background: radial-gradient(circle at 35% 32%,
    #1a1a1a 0%, #080808 42%, #010101 78%, #000 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
}

/* ── SCROLL HINT ─────────────────────────────────────────── */
#scroll-hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 25;
  color: rgba(255,255,255,0.08);
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
  transition: opacity 1.6s ease;
}
</style>
</head>
<body>

<!-- LAYER 1: IMAGE_A — actual poster file -->
<div id="poster-wrapper">
  <img src="poster.webp" alt="SPOTLIGHT — Coma Nova">
</div>

<!-- LAYER 10: Darkness + spotlight -->
<canvas id="mask-canvas"></canvas>

<!-- LAYER 15: Hint signals (mix-blend-mode: difference) -->
<div id="hints-wrapper"></div>

<div id="orb"></div>
<div id="scroll-hint">Move cursor &ensp;&middot;&ensp; Scroll to focus</div>

<script>
(function () {
'use strict';

// ── Word data ─────────────────────────────────────────────────────
// Positions as % of poster image (1420 × 2000).
// t = top%, l = left%,  fs = font-size as % of wrapper height.
// center = true → full-width span, text-align:center (no l value needed).
const WORDS = [
  // ── Header ────────────────────────────────────────────────────
  { t:  1.5, center: true,  fs:  5.0, text: 'COMA NOVA'  },
  { t:  7.0, l:  1.4,       fs: 12.0, text: 'SPOTLIGHT'  },
  { t: 20.5, center: true,  fs:  1.0, text: 'Second Edition Exhibition' },

  // ── Column 1 (left ≈ 4.6 %) ───────────────────────────────────
  { t: 24.5, l:  4.6, fs: 2.75, text: 'Digital Dark' },
  { t: 27.9, l:  4.6, fs: 2.75, text: 'Patterns'     },
  { t: 31.2, l:  4.6, fs: 2.75, text: 'Silent'       },
  { t: 34.6, l:  4.6, fs: 2.75, text: 'Influence'    },
  { t: 37.9, l:  4.6, fs: 2.75, text: 'Obscured'     },
  { t: 41.3, l:  4.6, fs: 2.75, text: 'Patterns'     },
  { t: 44.6, l:  4.6, fs: 2.75, text: 'Intent'       },
  { t: 48.0, l:  4.6, fs: 2.75, text: 'You'          },
  { t: 51.3, l:  4.6, fs: 2.75, text: 'Think You'    },

  // ── Column 2 (left ≈ 30.6 %) ──────────────────────────────────
  { t: 24.5, l: 30.6, fs: 2.75, text: 'Behavioral'   },
  { t: 27.9, l: 30.6, fs: 2.75, text: 'Design Sub-'  },
  { t: 31.2, l: 30.6, fs: 2.75, text: 'Conscious'    },
  { t: 34.6, l: 30.6, fs: 2.75, text: 'Perception'   },
  { t: 37.9, l: 30.6, fs: 2.75, text: 'Attention'    },
  { t: 41.3, l: 30.6, fs: 2.75, text: 'Cognition'    },
  { t: 44.6, l: 30.6, fs: 2.75, text: 'Control'      },
  { t: 48.0, l: 30.6, fs: 2.75, text: 'Framework'    },
  { t: 51.3, l: 30.6, fs: 2.75, text: 'To Show'      },
  { t: 54.7, l: 30.6, fs: 2.75, text: 'Is To Hide'   },
  { t: 58.0, l: 30.6, fs: 2.75, text: 'Half Seen,'   },

  // ── Column 3 (left ≈ 58.5 %) ──────────────────────────────────
  { t: 24.5, l: 58.5, fs: 2.75, text: 'Interface'    },
  { t: 27.9, l: 58.5, fs: 2.75, text: 'Control'      },
  { t: 31.2, l: 58.5, fs: 2.75, text: 'Responses'    },
  { t: 34.6, l: 58.5, fs: 2.75, text: 'Are——'        },
  { t: 37.9, l: 58.5, fs: 2.75, text: 'Prebuilt'     },
  { t: 41.3, l: 58.5, fs: 2.75, text: 'Limited'      },
  { t: 44.6, l: 58.5, fs: 2.75, text: 'No Option'    },
  { t: 48.0, l: 58.5, fs: 2.75, text: 'Your Inputs'  },
  { t: 51.3, l: 58.5, fs: 2.75, text: 'Expected'     },

  // ── Footer ────────────────────────────────────────────────────
  { t: 82.0, center: true, fs: 4.5, text: 'Sejong Art Gallery'          },
  { t: 87.5, center: true, fs: 4.5, text: 'Coma Nova — October 30, 2026' },
];

// ── DOM refs ──────────────────────────────────────────────────────
const posterWrapper = document.getElementById('poster-wrapper');
const hintsWrapper  = document.getElementById('hints-wrapper');
const mCvs          = document.getElementById('mask-canvas');
const orbEl         = document.getElementById('orb');
const hintEl        = document.getElementById('scroll-hint');
const mCtx          = mCvs.getContext('2d');

// ── Build hint elements ───────────────────────────────────────────
const allHW = WORDS.map(w => {
  const el = document.createElement('span');
  el.className = 'hw';
  el.textContent = w.text;
  if (w.center) {
    el.style.left      = '0';
    el.style.width     = '100%';
    el.style.textAlign = 'center';
  } else {
    el.style.left = w.l + '%';
  }
  el.style.top = w.t + '%';
  hintsWrapper.appendChild(el);
  return el;
});

// ── Spotlight state ───────────────────────────────────────────────
const EASE_POS  = 0.14;
const EASE_DEP  = 0.08;
const SPOT_FAR  = 0.66;
const SPOT_NEAR = 0.10;
const ORB_MIN   = 36;
const ORB_MAX   = 190;

let W = 0, H = 0, DIAG = 0;
let mx, my, sx, sy;
let tdep = 0.50, dep = 0.50;

// ── Wrapper geometry ──────────────────────────────────────────────
const POSTER_RATIO = 1420 / 2000; // poster.webp aspect ratio

function layoutWrapper() {
  W = window.innerWidth;
  H = window.innerHeight;
  DIAG = Math.sqrt(W * W + H * H);
  mCvs.width  = W;
  mCvs.height = H;

  let wW, wH;
  if (W / H < POSTER_RATIO) {
    wW = W; wH = W / POSTER_RATIO;
  } else {
    wH = H; wW = H * POSTER_RATIO;
  }
  const wL = (W - wW) / 2;
  const wT = (H - wH) / 2;

  [posterWrapper, hintsWrapper].forEach(el => {
    el.style.width  = wW + 'px';
    el.style.height = wH + 'px';
    el.style.left   = wL + 'px';
    el.style.top    = wT + 'px';
  });

  // Scale font-sizes to wrapper height
  WORDS.forEach((w, i) => {
    allHW[i].style.fontSize = (w.fs / 100 * wH) + 'px';
  });

  if (mx === undefined) { mx = W / 2; my = H / 2; sx = W / 2; sy = H / 2; }
}

window.addEventListener('resize', layoutWrapper);
layoutWrapper();

// ── Input ─────────────────────────────────────────────────────────
let hintGone = false;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  if (!hintGone) { hintGone = true; hintEl.style.opacity = '0'; }
});
document.addEventListener('wheel', e => {
  tdep = Math.min(1, Math.max(0, tdep + e.deltaY * 0.0012));
}, { passive: true });

// ── Draw darkness + spotlight ─────────────────────────────────────
function drawMask() {
  const spotR = DIAG * (SPOT_FAR + (SPOT_NEAR - SPOT_FAR) * dep);
  const orbD  = ORB_MIN + (ORB_MAX - ORB_MIN) * dep;

  mCtx.globalCompositeOperation = 'source-over';
  mCtx.fillStyle = '#040406';
  mCtx.fillRect(0, 0, W, H);

  mCtx.globalCompositeOperation = 'destination-out';
  const g = mCtx.createRadialGradient(sx, sy, 0, sx, sy, spotR);
  g.addColorStop(0,    'rgba(0,0,0,1)');
  g.addColorStop(0.50, 'rgba(0,0,0,0.94)');
  g.addColorStop(0.76, 'rgba(0,0,0,0.52)');
  g.addColorStop(1,    'rgba(0,0,0,0)');
  mCtx.fillStyle = g;
  mCtx.fillRect(0, 0, W, H);
  mCtx.globalCompositeOperation = 'source-over';

  const r = orbD / 2;
  orbEl.style.width  = orbD + 'px';
  orbEl.style.height = orbD + 'px';
  orbEl.style.transform = `translate3d(${sx - r}px,${sy - r}px,0)`;
}

// ── Flash scheduler ───────────────────────────────────────────────
const MAX_LIT = 3;
let litCount = 0;

function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }

function flashStream() {
  if (litCount >= MAX_LIT) { setTimeout(flashStream, rnd(60, 140)); return; }
  const pool = allHW.filter(w => !w.classList.contains('lit'));
  if (!pool.length) { setTimeout(flashStream, 200); return; }

  const el = pool[Math.floor(Math.random() * pool.length)];
  el.classList.add('lit');
  litCount++;

  setTimeout(() => { el.classList.remove('lit'); litCount--; }, rnd(80, 420));
  setTimeout(flashStream, rnd(300, 1200));
}

// ── Animation loop ────────────────────────────────────────────────
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 16.667, 4);
  last = ts;
  const ep = 1 - Math.pow(1 - EASE_POS, dt);
  const ed = 1 - Math.pow(1 - EASE_DEP, dt);
  sx  += (mx  - sx)  * ep;
  sy  += (my  - sy)  * ep;
  dep += (tdep - dep) * ed;
  drawMask();
  requestAnimationFrame(loop);
}

// ── Boot ──────────────────────────────────────────────────────────
flashStream();
setTimeout(flashStream, rnd(200, 500));
setTimeout(flashStream, rnd(600, 1000));
requestAnimationFrame(loop);

}());
</script>
</body>
</html>
