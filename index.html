<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTLIGHT — COMA NOVA</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #ffffff;
  cursor: none;
}

/* imageA.png: fullscreen poster, never altered */
#poster {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
#poster img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* Darkness canvas */
#darkness {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

/* Text ghost signals — poster words flickering through the dark */
#textghosts {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* Edge softness at beam boundary — screen blend, minimal */
#bloom {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  mix-blend-mode: screen;
}

/* Film grain */
#grain {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: 0.18;
}

/* Edge vignette */
#vignette {
  position: fixed;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background: radial-gradient(
    ellipse 78% 72% at 50% 50%,
    transparent 32%,
    rgba(4,4,7,0.28) 58%,
    rgba(4,4,7,0.62) 78%,
    rgba(4,4,7,0.92) 100%
  );
}

/*
  imageB.png: physical flashlight/projector body.
  multiply blend: visible only where spotlight reveals the bright poster beneath.
  Corners fall into darkness and disappear — the lit area reads as circular.
  No glow, no emission, no invert.
*/
#controller {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 7;
  pointer-events: none;
  will-change: transform;
}
#controller img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  mix-blend-mode: multiply;
  opacity: 0.92;
}

#intro {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #ffffff;
  pointer-events: none;
  transition: opacity 2.6s cubic-bezier(0.42, 0, 0.18, 1);
}

#hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: rgba(255,255,255,0.10);
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  pointer-events: none;
  transition: opacity 1.8s ease;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="poster">
  <img src="imageA.png" alt="">
</div>

<canvas id="darkness"></canvas>
<canvas id="textghosts"></canvas>
<canvas id="bloom"></canvas>
<canvas id="grain"></canvas>
<div id="vignette"></div>

<div id="controller">
  <img src="imageB.png" alt="">
</div>

<div id="intro"></div>
<div id="hint">Move cursor &ensp;&middot;&ensp; Scroll to adjust distance</div>

<script>
(function () {
  'use strict';

  const darkCvs   = document.getElementById('darkness');
  const ghostCvs  = document.getElementById('textghosts');
  const bloomCvs  = document.getElementById('bloom');
  const grainCvs  = document.getElementById('grain');
  const ctrlEl    = document.getElementById('controller');
  const hintEl    = document.getElementById('hint');
  const introEl   = document.getElementById('intro');
  const posterImg = document.querySelector('#poster img');

  const dCtx  = darkCvs.getContext('2d');
  const ghCtx = ghostCvs.getContext('2d');
  const bCtx  = bloomCvs.getContext('2d');
  const gCtx  = grainCvs.getContext('2d');

  // ── Flashlight distance model ─────────────────────────────
  //
  // sdepth 0→1 maps "scroll up (far)" → "scroll down (close)"
  //
  // CLOSE (sdepth high, large imageB):
  //   flashlight pressed against surface.
  //   visible circle ≈ imageB size only. almost no spread.
  //
  // FAR (sdepth low, small imageB):
  //   flashlight pulled back.
  //   cone expands. wide soft light covers large area.
  //
  // Beam radius formula: spotR = ctrlR + distFactor² × DIAG × SPREAD_SCALE
  // distFactor = 1 − sdepth: 0 when close, 1 when far.
  // Quadratic because real cone spread accelerates with distance.

  const CTRL_MIN    = 76;    // px — imageB at far distance (small)
  const CTRL_MAX    = 192;   // px — imageB at close distance (~2.5× = ~200% of original)
  const SPREAD_SCALE = 0.50; // controls how wide the far beam gets
  const EASE_POS    = 0.17;
  const EASE_DEPTH  = 0.09;

  // ── Reveal state machine ──────────────────────────────────
  const ST = { SPOTLIGHT: 0, BREAKING: 1, REVEALED: 2, REBUILDING: 3 };
  const REVEAL_THRESH  = 0.19;
  const REVEAL_HYST    = 0.05;
  const BREAK_SPEED    = 3.2;
  const REBUILD_SPEED  = 1.0;
  let state  = ST.SPOTLIGHT;
  let breakT = 0;

  let W, H, DIAG;
  let tx, ty, tdepth = 0.50;
  let sx, sy, sdepth = 0.50;
  let hintDone = false;
  let fc = 0;

  // ── Flicker system ────────────────────────────────────────
  let fk      = 1.0;    // 1=normal, 0=dark
  let fkSeq   = null;   // active sequence
  let fkTimer = 1.5 + Math.random() * 2.5; // first flicker in 1.5-4s

  // Build a random 1-or-2-blink keyframe sequence
  function fkMake() {
    const blinks = Math.random() < 0.40 ? 2 : 1;
    const kf = [{ t: 0, v: 1.0 }];
    let c = 0.010 + Math.random() * 0.008;
    for (let i = 0; i < blinks; i++) {
      kf.push({ t: c, v: 0.01 + Math.random() * 0.04 }); // near-black cut
      c += 0.060 + Math.random() * 0.090;
      kf.push({ t: c, v: 0.88 + Math.random() * 0.12 });
      c += 0.010 + Math.random() * 0.014;
      if (i < blinks - 1) {
        kf.push({ t: c, v: 0.02 + Math.random() * 0.04 });
        c += 0.050 + Math.random() * 0.070;
      }
    }
    kf.push({ t: c, v: 1.0 });
    return { kf, dur: c, t: 0 };
  }

  // Step-evaluate: instant cuts (no lerp) for electrical-fault feel
  function fkEval(seq) {
    for (let i = 0; i < seq.kf.length - 1; i++) {
      if (seq.t < seq.kf[i + 1].t) return seq.kf[i].v;
    }
    return 1.0;
  }

  // ── Film grain tile ───────────────────────────────────────
  const GS    = 256;
  const gTile = document.createElement('canvas');
  gTile.width = gTile.height = GS;
  const gX    = gTile.getContext('2d');
  const gData = gX.createImageData(GS, GS);

  function refreshGrain() {
    const d = gData.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255 | 0;
      d[i]   = Math.min(255, v + 6);
      d[i+1] = v;
      d[i+2] = Math.max(0,   v - 5);
      d[i+3] = 24;
    }
    gX.putImageData(gData, 0, 0);
  }

  function drawGrain() {
    gCtx.clearRect(0, 0, W, H);
    const ox = Math.random() * GS | 0;
    const oy = Math.random() * GS | 0;
    for (let px = -ox; px < W; px += GS)
      for (let py = -oy; py < H; py += GS)
        gCtx.drawImage(gTile, px, py);
  }

  // ── Ghost text regions ────────────────────────────────────
  // Fractions of poster natural dimensions (x, y from top-left of poster).
  // 34 regions: 3 header + 9 left col + 11 mid col + 9 right col + 2 footer
  const GHOST_REGIONS = [
    { x: 0.06, y: 0.040, w: 0.88, h: 0.092 }, // COMA NOVA
    { x: 0.04, y: 0.122, w: 0.92, h: 0.172 }, // SPOTLIGHT
    { x: 0.22, y: 0.290, w: 0.56, h: 0.040 }, // Second Edition Exhibition
    // Left column
    { x: 0.04, y: 0.335, w: 0.23, h: 0.038 },
    { x: 0.04, y: 0.373, w: 0.23, h: 0.038 },
    { x: 0.04, y: 0.411, w: 0.23, h: 0.038 },
    { x: 0.04, y: 0.449, w: 0.23, h: 0.038 },
    { x: 0.04, y: 0.487, w: 0.23, h: 0.038 },
    { x: 0.04, y: 0.525, w: 0.23, h: 0.038 },
    { x: 0.04, y: 0.563, w: 0.23, h: 0.038 },
    { x: 0.04, y: 0.601, w: 0.23, h: 0.038 },
    { x: 0.04, y: 0.639, w: 0.23, h: 0.038 },
    // Mid column
    { x: 0.32, y: 0.335, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.373, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.411, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.449, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.487, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.525, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.563, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.601, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.639, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.677, w: 0.33, h: 0.038 },
    { x: 0.32, y: 0.715, w: 0.33, h: 0.038 },
    // Right column
    { x: 0.67, y: 0.335, w: 0.27, h: 0.038 },
    { x: 0.67, y: 0.373, w: 0.27, h: 0.038 },
    { x: 0.67, y: 0.411, w: 0.27, h: 0.038 },
    { x: 0.67, y: 0.449, w: 0.27, h: 0.038 },
    { x: 0.67, y: 0.487, w: 0.27, h: 0.038 },
    { x: 0.67, y: 0.525, w: 0.27, h: 0.038 },
    { x: 0.67, y: 0.563, w: 0.27, h: 0.038 },
    { x: 0.67, y: 0.601, w: 0.27, h: 0.038 },
    { x: 0.67, y: 0.639, w: 0.27, h: 0.038 },
    // Footer
    { x: 0.09, y: 0.785, w: 0.82, h: 0.065 },
    { x: 0.05, y: 0.855, w: 0.90, h: 0.065 },
  ];

  // Per-region animation state
  // ph: 0=idle, 1=fade-in, 2=hold, 3=fade-out
  const ghostStates = GHOST_REGIONS.map((_, i) => ({
    ph: 0, phT: 0, timer: Math.random() * 2,
    op: 0, blur: 0, ox: 0, oy: 0,
    peak: 0, upD: 0, holdD: 0, downD: 0,
    blurStart: 0, blurEnd: 0,
  }));

  function calcPosterRect() {
    const iw = posterImg.naturalWidth;
    const ih = posterImg.naturalHeight;
    if (!iw || !ih) return null;
    const scale = Math.min(W / iw, H / ih);
    const pw = iw * scale;
    const ph = ih * scale;
    return { x: (W - pw) * 0.5, y: (H - ph) * 0.5, w: pw, h: ph };
  }

  function updateGhosts(dt) {
    // During reveal/rebuild, quickly fade out any active ghosts
    if (state !== ST.SPOTLIGHT) {
      ghostStates.forEach(g => {
        if (g.ph !== 0) {
          g.op = Math.max(0, g.op - dt * 10);
          if (g.op <= 0) { g.ph = 0; g.op = 0; }
        }
      });
      return;
    }

    let activeCount = ghostStates.reduce((n, g) => n + (g.ph !== 0 ? 1 : 0), 0);

    ghostStates.forEach(g => {
      if (g.ph === 0) {
        g.timer -= dt;
        if (g.timer <= 0) {
          g.timer = 0.8 + Math.random() * 3.0;
          if (activeCount < 3 && Math.random() < 0.60) {
            g.ph        = 1;
            g.phT       = 0;
            g.peak      = 0.75 + Math.random() * 0.25;
            g.upD       = 0.06 + Math.random() * 0.10;
            g.holdD     = 0.12 + Math.random() * 0.22;
            g.downD     = 0.15 + Math.random() * 0.30;
            g.ox        = (Math.random() - 0.5) * 4;
            g.oy        = (Math.random() - 0.5) * 3;
            g.blurStart = 2.5 + Math.random() * 2.5;
            g.blurEnd   = 1.5 + Math.random() * 2.0;
            activeCount++;
          }
        }
        return;
      }

      g.phT += dt;

      if (g.ph === 1) {
        const t = Math.min(1, g.phT / g.upD);
        g.op   = t * g.peak;
        g.blur = g.blurStart + (0.15 - g.blurStart) * t;
        if (t >= 1) { g.ph = 2; g.phT = 0; }
      } else if (g.ph === 2) {
        g.op   = g.peak;
        g.blur = 0.15;
        if (g.phT >= g.holdD) { g.ph = 3; g.phT = 0; }
      } else if (g.ph === 3) {
        const t = Math.min(1, g.phT / g.downD);
        g.op   = g.peak * (1 - t);
        g.blur = 0.15 + (g.blurEnd - 0.15) * t;
        if (t >= 1) {
          g.ph = 0; g.op = 0; g.blur = 0;
          g.timer = 0.8 + Math.random() * 3.0;
          activeCount--;
        }
      }
    });
  }

  function drawGhosts() {
    ghCtx.clearRect(0, 0, W, H);
    if (state !== ST.SPOTLIGHT) return;
    if (!posterImg.complete || !posterImg.naturalWidth) return;

    const pr = calcPosterRect();
    if (!pr) return;

    ghostStates.forEach((g, i) => {
      if (g.ph === 0 || g.op < 0.01) return;

      const reg = GHOST_REGIONS[i];
      const rx  = pr.x + reg.x * pr.w;
      const ry  = pr.y + reg.y * pr.h;
      const rw  = reg.w * pr.w;
      const rh  = reg.h * pr.h;

      ghCtx.save();
      ghCtx.globalAlpha = g.op;
      if (g.blur > 0.05) ghCtx.filter = `blur(${g.blur.toFixed(2)}px)`;

      // Clip to the region rectangle (with pad for blur overflow)
      const pad = Math.ceil(g.blur * 3) + 4;
      ghCtx.beginPath();
      ghCtx.rect(rx - pad + g.ox, ry - pad + g.oy, rw + pad * 2, rh + pad * 2);
      ghCtx.clip();

      // Draw full poster image offset by jitter — clip reveals only this region
      ghCtx.drawImage(posterImg, pr.x + g.ox, pr.y + g.oy, pr.w, pr.h);

      ghCtx.restore();
    });
  }

  // ── Resize ────────────────────────────────────────────────
  function resize() {
    W    = window.innerWidth;
    H    = window.innerHeight;
    DIAG = Math.hypot(W, H);
    [darkCvs, ghostCvs, bloomCvs, grainCvs].forEach(c => {
      c.width  = W;
      c.height = H;
    });
    if (tx === undefined) { tx = sx = W * 0.5; ty = sy = H * 0.5; }
    refreshGrain();
  }
  window.addEventListener('resize', resize);

  // ── Input ─────────────────────────────────────────────────
  document.addEventListener('mousemove', e => {
    tx = e.clientX;
    ty = e.clientY;
    if (!hintDone) { hintEl.style.opacity = '0'; hintDone = true; }
  });

  // Scroll down → closer → larger imageB → tighter beam
  document.addEventListener('wheel', e => {
    tdepth = Math.max(0, Math.min(1, tdepth + e.deltaY * 0.0008));
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    e.preventDefault();
  }, { passive: false });

  setTimeout(() => { hintEl.style.opacity = '0'; }, 4500);

  setTimeout(() => {
    introEl.style.opacity = '0';
    introEl.addEventListener('transitionend', () => introEl.remove(), { once: true });
  }, 160);

  const lerp = (a, b, t) => a + (b - a) * t;
  const fi   = (f, dt) => 1 - Math.pow(1 - f, dt * 60);

  // ── DARKNESS + SPOTLIGHT ──────────────────────────────────
  //
  // Physical model:
  //   distFactor = 0 (close): spotR ≈ ctrlR → hard circle exactly under imageB
  //   distFactor = 1 (far):   spotR = ctrlR + large spread → wide soft cone
  //
  // The gradient transition band (ctrlR → spotR) is narrow when close
  // and wide when far. Edge sharpness emerges naturally from this geometry.
  //
  // bt (breakT 0→1): iris expands + darkness collapses during reveal.
  function drawDarkness(x, y, ctrlR, spotR, t, bt) {
    dCtx.clearRect(0, 0, W, H);

    const darkEase = bt < 0.5
      ? bt * bt * 0.4
      : 0.1 + Math.pow((bt - 0.5) * 2, 2.2) * 0.9;
    const darkBase = 0.986 * (1 - darkEase);
    if (darkBase < 0.004) { dCtx.clearRect(0, 0, W, H); return; }

    dCtx.globalCompositeOperation = 'source-over';
    dCtx.fillStyle = `rgba(4,4,7,${darkBase.toFixed(3)})`;
    dCtx.fillRect(0, 0, W, H);

    dCtx.globalCompositeOperation = 'destination-out';

    // Iris expansion during break
    const irisExpand = bt > 0 ? 1 + bt * bt * 14 : 1;
    const activeSpotR = spotR * irisExpand;

    // Hard clear under imageB — the flashlight contact area
    dCtx.beginPath();
    dCtx.arc(x, y, ctrlR, 0, Math.PI * 2);
    dCtx.fillStyle = 'rgba(0,0,0,1)';
    dCtx.fill();

    // Beam projection beyond imageB edge — organic drift on outer radius only
    const s       = t * 0.001;
    const breathe = 1 + 0.020 * Math.sin(s * 0.74);
    const a1x = Math.sin(s * 0.59) * 4.8 + Math.cos(s * 1.02) * 2.2;
    const a1y = Math.cos(s * 0.51) * 5.4 + Math.sin(s * 0.86) * 2.0;
    const a2x = Math.sin(s * 0.82 + 1.2) * 4.2;
    const a2y = Math.cos(s * 0.66 + 0.7) * 3.6;
    const a3x = Math.cos(s * 0.43 + 0.4) * 3.0;
    const a3y = Math.sin(s * 0.55 + 1.7) * 3.8;

    // Primary cone — full clear at inner edge, strong across most of beam
    const g1 = dCtx.createRadialGradient(
      x, y, ctrlR,
      x + a1x * 0.07, y + a1y * 0.07, activeSpotR * breathe
    );
    g1.addColorStop(0.00, 'rgba(0,0,0,1.00)');
    g1.addColorStop(0.18, 'rgba(0,0,0,0.96)');
    g1.addColorStop(0.40, 'rgba(0,0,0,0.88)');
    g1.addColorStop(0.62, 'rgba(0,0,0,0.65)');
    g1.addColorStop(0.80, 'rgba(0,0,0,0.32)');
    g1.addColorStop(0.92, 'rgba(0,0,0,0.08)');
    g1.addColorStop(1.00, 'rgba(0,0,0,0.00)');
    dCtx.fillStyle = g1;
    dCtx.fillRect(0, 0, W, H);

    // Secondary: pushes residual darkness lower
    const g2 = dCtx.createRadialGradient(
      x, y, ctrlR,
      x + a2x * 0.12, y + a2y * 0.12, activeSpotR * 0.82 * breathe
    );
    g2.addColorStop(0.00, 'rgba(0,0,0,0.72)');
    g2.addColorStop(0.35, 'rgba(0,0,0,0.48)');
    g2.addColorStop(0.65, 'rgba(0,0,0,0.20)');
    g2.addColorStop(0.88, 'rgba(0,0,0,0.05)');
    g2.addColorStop(1.00, 'rgba(0,0,0,0.00)');
    dCtx.fillStyle = g2;
    dCtx.fillRect(0, 0, W, H);

    // Tertiary: organic edge irregularity
    const g3 = dCtx.createRadialGradient(
      x, y, ctrlR,
      x + a3x * 0.09, y + a3y * 0.09,
      activeSpotR * 0.88 * (1 + 0.014 * Math.cos(s * 0.91))
    );
    g3.addColorStop(0.00, 'rgba(0,0,0,0.40)');
    g3.addColorStop(0.45, 'rgba(0,0,0,0.18)');
    g3.addColorStop(0.80, 'rgba(0,0,0,0.04)');
    g3.addColorStop(1.00, 'rgba(0,0,0,0.00)');
    dCtx.fillStyle = g3;
    dCtx.fillRect(0, 0, W, H);

    // Slight center dimming — projected feel, not screen-lit
    dCtx.globalCompositeOperation = 'source-over';
    const gc = dCtx.createRadialGradient(x, y, 0, x, y, ctrlR * 0.7);
    gc.addColorStop(0.0, 'rgba(4,4,7,0.10)');
    gc.addColorStop(1.0, 'rgba(4,4,7,0.00)');
    dCtx.fillStyle = gc;
    dCtx.fillRect(0, 0, W, H);

    // Flicker: collapse spotlight by painting darkness back over cleared area
    if (fk < 0.999) {
      dCtx.globalCompositeOperation = 'source-over';
      dCtx.fillStyle = `rgba(4,4,7,${((1 - fk) * 0.95).toFixed(3)})`;
      dCtx.fillRect(0, 0, W, H);
    }
  }

  // ── EDGE SOFTNESS ─────────────────────────────────────────
  // Not a bloom haze — just a narrow optical softness at the beam boundary.
  // Scales with distFactor: zero when close (hard edge), subtle when far.
  // No wide ambient glow. No amber haze.
  function drawBloom(x, y, ctrlR, spotR, t, bt, distFactor) {
    bCtx.clearRect(0, 0, W, H);

    // No edge softness when close or during reveal
    if (distFactor < 0.08 || bt > 0.5) return;

    const s      = t * 0.001;
    const breathe = 1 + 0.016 * Math.sin(s * 0.74 + 0.4);
    // Softness proportional to distance — far = wider cone edge
    const strength = distFactor * 0.38 * fk;

    // Narrow ring exactly at the beam boundary
    const edgeIn  = spotR * 0.88 * breathe;
    const edgeOut = spotR * 1.10 * breathe;
    const edge = bCtx.createRadialGradient(x, y, edgeIn, x, y, edgeOut);
    edge.addColorStop(0.00, 'rgba(0,0,0,0)');
    edge.addColorStop(0.40, `rgba(248,242,230,${(strength * 0.50).toFixed(3)})`);
    edge.addColorStop(0.70, `rgba(240,234,220,${(strength * 0.28).toFixed(3)})`);
    edge.addColorStop(1.00, 'rgba(0,0,0,0)');
    bCtx.fillStyle = edge;
    bCtx.fillRect(0, 0, W, H);
  }

  // ── MAIN LOOP ─────────────────────────────────────────────
  let lastTs = 0;

  function tick(ts) {
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    fc++;

    const ep = fi(EASE_POS,   dt);
    const ed = fi(EASE_DEPTH, dt);

    sx     = lerp(sx,     tx,     ep);
    sy     = lerp(sy,     ty,     ep);
    sdepth = lerp(sdepth, tdepth, ed);

    // ── State machine ──────────────────────────────────────
    if (state === ST.SPOTLIGHT && sdepth < REVEAL_THRESH) {
      state  = ST.BREAKING;
      breakT = 0;
    } else if ((state === ST.REVEALED || state === ST.BREAKING) &&
               sdepth > REVEAL_THRESH + REVEAL_HYST) {
      state  = ST.REBUILDING;
      breakT = 1;
    }

    if (state === ST.BREAKING) {
      breakT = Math.min(1, breakT + BREAK_SPEED * dt);
      if (breakT >= 1) state = ST.REVEALED;
    } else if (state === ST.REBUILDING) {
      breakT = Math.max(0, breakT - REBUILD_SPEED * dt);
      if (breakT <= 0) state = ST.SPOTLIGHT;
    }

    const bt = (state === ST.SPOTLIGHT) ? 0
             : (state === ST.REVEALED)  ? 1
             : breakT;

    // ── Flicker ────────────────────────────────────────────
    // Only flicker in SPOTLIGHT state — not during reveal/rebuild
    if (state === ST.SPOTLIGHT) {
      fkTimer -= dt;
      if (fkTimer <= 0) {
        if (fkSeq === null && Math.random() < 0.72) fkSeq = fkMake();
        fkTimer = 1.5 + Math.random() * 3.5;
      }
    }
    if (fkSeq !== null) {
      fkSeq.t += dt;
      fk = fkEval(fkSeq);
      if (fkSeq.t >= fkSeq.dur) { fk = 1.0; fkSeq = null; }
    } else if (state !== ST.SPOTLIGHT) {
      fk = 1.0;
    }

    // ── Flashlight physics ─────────────────────────────────
    const ctrlSize   = lerp(CTRL_MIN, CTRL_MAX, sdepth);
    const ctrlR      = ctrlSize * 0.5;  // imageB element sizing only
    const distFactor = 1 - sdepth;      // 1=far (wide), 0=close (tight)
    // nozzleR: fixed small beam origin — does NOT grow when close.
    // spotR grows only from distance (distFactor), so scrolling down
    // (large imageB, small distFactor) keeps the beam tight.
    const nozzleR    = 18;
    const beamSpread = distFactor * distFactor * DIAG * SPREAD_SCALE;
    const spotR      = nozzleR + beamSpread;

    if (bt < 0.999) {
      drawDarkness(sx, sy, nozzleR, spotR, ts, bt);
      drawBloom(sx, sy, nozzleR, spotR, ts, bt, distFactor);
    } else {
      dCtx.clearRect(0, 0, W, H);
      bCtx.clearRect(0, 0, W, H);
    }

    // ── Ghost text signals ─────────────────────────────────
    updateGhosts(dt);
    drawGhosts();

    if (fc % 2 === 0) refreshGrain();
    grainCvs.style.opacity = (1 - Math.min(1, bt * 2)).toFixed(3);
    drawGrain();

    // ── imageB: physical body, collapses on break, rebuilds after ──
    let cScale = 1, cOpacity = 1;
    if (bt > 0) {
      if (bt < 0.28) {
        cScale   = 1 + bt * 2.0;
        cOpacity = 1 - bt * 3.4;
      } else {
        cScale   = 0;
        cOpacity = 0;
      }
    }
    if (state === ST.REBUILDING && breakT < 0.45) {
      const reappear = 1 - breakT / 0.45;
      cOpacity = Math.pow(reappear, 2);
      cScale   = reappear;
    }

    ctrlEl.style.opacity         = (cOpacity * fk).toFixed(3);
    ctrlEl.style.transform       = `translate3d(${(sx - ctrlR).toFixed(1)}px,${(sy - ctrlR).toFixed(1)}px,0) scale(${cScale.toFixed(3)})`;
    ctrlEl.style.transformOrigin = '50% 50%';
    ctrlEl.style.width           = ctrlSize.toFixed(0) + 'px';
    ctrlEl.style.height          = ctrlSize.toFixed(0) + 'px';

    requestAnimationFrame(tick);
  }

  resize();
  requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(tick); });
}());
</script>
</body>
</html>
