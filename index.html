<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spatial Symbol Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; }

    .ui {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      user-select: none;
    }

    .row { display: flex; gap: 6px; }

    button {
      border: 1px solid #fff; background: #000; color: #fff;
      padding: 7px 13px; cursor: pointer;
      font-size: 11px; letter-spacing: 0.07em;
      font-family: inherit; transition: background 0.1s, color 0.1s;
    }
    button:hover { background: #1c1c1c; }
    button.active { background: #fff; color: #000; }

    #hint {
      font-size: 10px; color: #4a4a4a;
      letter-spacing: 0.04em; line-height: 1.6;
    }

    #coords {
      font-size: 10px; color: #666;
      letter-spacing: 0.03em; min-height: 14px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

<div class="ui">
  <div class="row">
    <button onclick="resetNodes()">RESET</button>
    <button id="btnL" onclick="toggleLabels()" class="active">LABELS</button>
  </div>
  <div id="hint">drag node · shift+drag = z depth<br>scroll = zoom · drag bg = orbit</div>
  <div id="coords"></div>
</div>

<script>

// ── Structure ─────────────────────────────────────────────────────────────────

const DEFAULTS = [
  { id:'N', x:   0, y:-158, z: 0 },
  { id:'E', x: 172, y:   0, z: 0 },
  { id:'S', x:   0, y: 108, z: 0 },
  { id:'W', x:-194, y:   0, z: 0 },
]

let nodes = DEFAULTS.map(d => ({ ...d }))

function resetNodes() {
  nodes = DEFAULTS.map(d => ({ ...d }))
  setCoords('')
}

// ── Camera ────────────────────────────────────────────────────────────────────

let camRX = 0.25,  camRY = -0.14
let tgtRX = 0.25,  tgtRY = -0.14
let inerX = 0,     inerY = 0
let zoom  = 1.0,   tgtZoom = 1.0
const FOV = 460

// ── Interaction state ─────────────────────────────────────────────────────────

let selNode  = null
let dragNode = false
let dragCam  = false
let zMode    = false
let pmx = 0, pmy = 0
let showLabels = true
let hoverNode  = null

// ── 3D math ───────────────────────────────────────────────────────────────────

function rotPt(p, rx, ry) {
  const cy = Math.cos(ry), sy = Math.sin(ry)
  const x1 = p.x * cy - p.z * sy
  const z1 = p.x * sy + p.z * cy
  const cx = Math.cos(rx), sx = Math.sin(rx)
  const y1 = p.y * cx - z1 * sx
  const z2 = p.y * sx + z1 * cx
  return { x: x1, y: y1, z: z2 }
}

function projPt(p) {
  const s = (FOV / (FOV + p.z + 60)) * zoom
  return { sx: p.x * s, sy: p.y * s, z: p.z, s }
}

function projectNode(n) {
  return projPt(rotPt(n, camRX, camRY))
}

// Inverse-camera direction vectors for world-space dragging.
// These map screen deltas to world-space movement.
function worldRight() {
  return {
    x:  Math.cos(camRY),
    y: -Math.sin(camRY) * Math.sin(camRX),
    z: -Math.sin(camRY) * Math.cos(camRX)
  }
}
function worldDown() {
  return {
    x: 0,
    y:  Math.cos(camRX),
    z: -Math.sin(camRX)
  }
}
function worldFwd() {
  return {
    x:  Math.sin(camRY),
    y:  Math.cos(camRY) * Math.sin(camRX),
    z:  Math.cos(camRY) * Math.cos(camRX)
  }
}

// ── Plane geometry ────────────────────────────────────────────────────────────

// Each edge becomes a razor-thin rectangular plane whose thickness
// extends along world Z. From directly front the plane collapses to a line;
// rotating the camera reveals the hidden surface.
const PLANE_THICKNESS = 16

function buildPlane(nA, nB) {
  const dx = nB.x - nA.x, dy = nB.y - nA.y, dz = nB.z - nA.z
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz)
  if (len < 0.5) return null

  const ex = dx/len, ey = dy/len, ez = dz/len

  // Thickness direction: world Z orthogonalized against the edge direction.
  // tx = (0,0,1) - dot((0,0,1),(ex,ey,ez)) * (ex,ey,ez) = (-ez*ex, -ez*ey, 1-ez²)
  let tx = -ez * ex, ty = -ez * ey, tz = 1.0 - ez * ez
  let tLen = Math.sqrt(tx*tx + ty*ty + tz*tz)

  if (tLen < 0.05) {
    // Edge nearly parallel to world Z — fall back to world Y
    tx = -ey * ex; ty = 1.0 - ey * ey; tz = -ey * ez
    tLen = Math.sqrt(tx*tx + ty*ty + tz*tz)
    if (tLen < 0.001) return null
  }

  const h = (PLANE_THICKNESS / 2) / tLen
  tx *= h; ty *= h; tz *= h

  // 4 world-space corners: A± and B± along thickness axis
  return [
    { x: nA.x + tx, y: nA.y + ty, z: nA.z + tz },  // [0] A front
    { x: nA.x - tx, y: nA.y - ty, z: nA.z - tz },  // [1] A back
    { x: nB.x - tx, y: nB.y - ty, z: nB.z - tz },  // [2] B back
    { x: nB.x + tx, y: nB.y + ty, z: nB.z + tz },  // [3] B front
  ]
}

// ── p5.js setup ───────────────────────────────────────────────────────────────

function setup() {
  createCanvas(windowWidth, windowHeight)
  document.querySelector('canvas')
    .addEventListener('contextmenu', e => e.preventDefault())
}

// ── Draw ──────────────────────────────────────────────────────────────────────

function draw() {
  background(0)

  // Camera lerp
  camRX += (tgtRX - camRX) * 0.09
  camRY += (tgtRY - camRY) * 0.09
  zoom  += (tgtZoom - zoom) * 0.12

  // Inertia (only when not actively dragging)
  if (!dragCam && !dragNode) {
    tgtRX += inerX
    tgtRY += inerY
    inerX *= 0.84
    inerY *= 0.84
    tgtRX = Math.max(-1.3, Math.min(1.3, tgtRX))
  }

  const ox = width  / 2
  const oy = height / 2

  // Hover detection
  hoverNode = null
  if (!dragNode) {
    let best = 30
    for (const n of nodes) {
      const p = projectNode(n)
      const d = dist(mouseX - ox, mouseY - oy, p.sx, p.sy)
      if (d < best) { best = d; hoverNode = n }
    }
  }

  // Project nodes
  const pn = nodes.map(n => ({ n, p: projectNode(n) }))

  push()
  translate(ox, oy)

  // ── Planes ─────────────────────────────────────────────────────────────────
  const EDGES = [['W','N'], ['N','S'], ['W','E']]
  const byNode = {}
  for (const { n } of pn) byNode[n.id] = n

  // Build plane geometry and project all corners
  const planeData = []
  for (const [aid, bid] of EDGES) {
    const nA = byNode[aid], nB = byNode[bid]
    if (!nA || !nB) continue
    const corners = buildPlane(nA, nB)
    if (!corners) continue
    const proj = corners.map(c => projPt(rotPt(c, camRX, camRY)))
    const avgZ = (proj[0].z + proj[1].z + proj[2].z + proj[3].z) * 0.25
    planeData.push({ proj, avgZ })
  }

  // Sort back-to-front (painter's algorithm)
  planeData.sort((a, b) => b.avgZ - a.avgZ)

  // Pass 1: filled face (barely-there white — signals surface without screaming)
  noStroke()
  for (const { proj, avgZ } of planeData) {
    const faceAl = constrain(map(avgZ, -260, 260, 30, 7), 5, 34)
    fill(255, faceAl)
    beginShape()
    vertex(proj[0].sx, proj[0].sy)
    vertex(proj[1].sx, proj[1].sy)
    vertex(proj[2].sx, proj[2].sy)
    vertex(proj[3].sx, proj[3].sy)
    endShape(CLOSE)
  }

  // Pass 2: wireframe edges
  noFill()
  for (const { proj, avgZ } of planeData) {
    const edgeAl = constrain(map(avgZ, -260, 260, 205, 45), 38, 215)

    // Long edges — the "original" symbol lines, one on each face of the plane
    stroke(255, edgeAl)
    strokeWeight(0.85)
    line(proj[0].sx, proj[0].sy, proj[3].sx, proj[3].sy)  // front face longitudinal
    line(proj[1].sx, proj[1].sy, proj[2].sx, proj[2].sy)  // back face longitudinal

    // Cap edges — invisible head-on, reveal depth on rotation
    stroke(255, Math.floor(edgeAl * 0.40))
    strokeWeight(0.5)
    line(proj[0].sx, proj[0].sy, proj[1].sx, proj[1].sy)  // A-end cap
    line(proj[3].sx, proj[3].sy, proj[2].sx, proj[2].sy)  // B-end cap
  }

  // ── Nodes ───────────────────────────────────────────────────────────────────
  for (const { n, p } of pn) {
    const al  = constrain(map(p.z, -260, 260, 255, 70), 55, 255)
    const sz  = constrain(map(p.s, 0.38 * zoom, 1.62 * zoom, 4.5, 11.5), 4, 13)
    const isH = hoverNode === n
    const isS = selNode   === n

    // Z depth indicator — dashed vertical tick
    if (Math.abs(n.z) > 6) {
      const tLen = constrain(map(Math.abs(n.z), 0, 240, 0, 22), 0, 22)
      const tDir = n.z > 0 ? 1 : -1
      const tAl  = constrain(al * 0.35, 15, 110)
      drawingContext.setLineDash([2.5, 2.5])
      stroke(255, tAl)
      strokeWeight(0.7)
      line(p.sx, p.sy + sz * 0.5 * tDir, p.sx, p.sy + (sz * 0.5 + tLen) * tDir)
      drawingContext.setLineDash([])
    }

    // Selection / hover ring
    if (isH || isS) {
      noFill()
      stroke(255, al)
      strokeWeight(isS ? 1.5 : 1.0)
      ellipse(p.sx, p.sy, sz + 13, sz + 13)
    }

    // Node dot
    noStroke()
    fill(255, al)
    ellipse(p.sx, p.sy, sz, sz)

    // Label
    if (showLabels) {
      const lal = constrain(al * 0.72, 32, 185)

      let lx = p.sx, ly = p.sy
      const gap = sz * 0.5 + 11
      if (n.id === 'N') ly -= gap
      if (n.id === 'S') ly += gap
      if (n.id === 'E') lx += gap
      if (n.id === 'W') lx -= gap

      noStroke()
      fill(255, lal)
      textSize(10)
      textAlign(CENTER, CENTER)
      text(n.id, lx, ly)

      // Z annotation
      if (Math.abs(n.z) > 12) {
        const zStr = (n.z > 0 ? '+' : '') + Math.round(n.z)
        textSize(8)
        fill(180, constrain(lal * 0.65, 18, 130))
        const zy = (n.id === 'N') ? ly - 11 : ly + 11
        text(zStr, lx, zy)
      }
    }
  }

  // Active drag readout on node
  if (dragNode && selNode) {
    const p = projectNode(selNode)
    const xStr = (selNode.x >= 0 ? '+' : '') + Math.round(selNode.x)
    const yStr = (selNode.y >= 0 ? '+' : '') + Math.round(selNode.y)
    const zStr = (selNode.z >= 0 ? '+' : '') + Math.round(selNode.z)
    noStroke()
    fill(255, 155)
    textSize(9)
    textAlign(LEFT, CENTER)
    const readout = zMode ? 'z ' + zStr : 'x ' + xStr + '  y ' + yStr
    text(readout, p.sx + 18, p.sy)
  }

  pop()
}

// ── Mouse ─────────────────────────────────────────────────────────────────────

function mousePressed() {
  if (mouseButton === CENTER) return

  const ox = width / 2, oy = height / 2

  // Hit test nodes
  let best = 30, hit = null
  for (const n of nodes) {
    const p = projectNode(n)
    const d = dist(mouseX - ox, mouseY - oy, p.sx, p.sy)
    if (d < best) { best = d; hit = n }
  }

  if (hit) {
    selNode  = hit
    dragNode = true
    dragCam  = false
    zMode    = (mouseButton === RIGHT) || keyIsDown(SHIFT)
    inerX = 0; inerY = 0
    setHint(zMode
      ? 'z depth · ' + hit.id + '  (drag left/right)'
      : hit.id + ' · shift+drag = z depth')
  } else {
    selNode  = null
    dragNode = false
    dragCam  = true
    inerX = 0; inerY = 0
  }

  pmx = mouseX; pmy = mouseY
  return false
}

function mouseDragged() {
  const dx = mouseX - pmx
  const dy = mouseY - pmy

  if (dragNode && selNode) {
    zMode = (mouseButton === RIGHT) || keyIsDown(SHIFT)

    const sf = 1.0 / zoom   // world units per screen pixel

    if (zMode) {
      // Move along camera forward axis
      const f = worldFwd()
      const d = dx * sf * 1.5
      selNode.x += f.x * d
      selNode.y += f.y * d
      selNode.z += f.z * d
    } else {
      // Move in camera-facing XY plane
      const r = worldRight()
      const dn = worldDown()
      const sx = dx * sf
      const sy = dy * sf
      selNode.x += r.x * sx + dn.x * sy
      selNode.y += r.y * sx + dn.y * sy
      selNode.z += r.z * sx + dn.z * sy
    }

    setCoords(
      selNode.id +
      '  x ' + fmt(selNode.x) +
      '  y ' + fmt(selNode.y) +
      '  z ' + fmt(selNode.z)
    )
  }

  if (dragCam) {
    const s = 0.006
    inerY = dx * s
    inerX = dy * s
    tgtRY += inerY
    tgtRX += inerX
    tgtRX = Math.max(-1.3, Math.min(1.3, tgtRX))
  }

  pmx = mouseX; pmy = mouseY
}

function mouseReleased() {
  dragNode = false
  dragCam  = false
  setHint('drag node · shift+drag = z depth\nscroll = zoom · drag bg = orbit')
}

function mouseWheel(e) {
  tgtZoom = constrain(tgtZoom * (e.delta > 0 ? 0.91 : 1.10), 0.25, 5.0)
  return false
}

// ── Keyboard ──────────────────────────────────────────────────────────────────

function keyPressed() {
  if (key === 'r' || key === 'R') resetNodes()
  if (key === 'l' || key === 'L') toggleLabels()
  if (keyCode === ESCAPE) { selNode = null }
}

// ── UI helpers ────────────────────────────────────────────────────────────────

function toggleLabels() {
  showLabels = !showLabels
  document.getElementById('btnL').classList.toggle('active', showLabels)
}

function setHint(t) {
  document.getElementById('hint').innerHTML = t.replace('\n', '<br>')
}

function setCoords(t) {
  document.getElementById('coords').textContent = t
}

function fmt(v) {
  return (v >= 0 ? '+' : '') + Math.round(v)
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight)
}

</script>
</body>
</html>
