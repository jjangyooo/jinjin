<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTO — Nueu Rules Into the Oddinary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Poster: portrait A3-ish ratio ── */
#poster {
  position: relative;
  background: #237A2E;
  width: min(100vw, calc(100vh * 0.708));
  height: min(100vh, calc(100vw / 0.708));
  overflow: hidden;
}

/* ── Tagline ── */
.tagline {
  position: absolute;
  top: 4.2%;
  left: 5.8%;
  right: 5.8%;
  font-family: 'Barlow Condensed', Arial, sans-serif;
  font-size: clamp(8px, 1.45%, 13px);
  font-weight: 700;
  letter-spacing: 0.01em;
  color: #0f0f0f;
  line-height: 1;
  z-index: 3;
}

/* ── Main headline ── */
.headline {
  position: absolute;
  top: 6.5%;
  left: 5%;
  right: 4%;
  font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  font-size: clamp(46px, 10.5%, 92px);
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 0.88;
  color: #0f0f0f;
  z-index: 4;
  pointer-events: none;
  user-select: none;
  text-transform: none;
}

.headline .line-42 {
  font-size: 120%;
  font-style: italic;
  font-weight: 900;
  letter-spacing: -0.04em;
}

/* ── Three.js canvas — covers poster center, bleeds to both sides ── */
#canvas-wrap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
}

#three-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* ── Bottom: FORTO + URL ── */
.footer {
  position: absolute;
  bottom: 3%;
  left: 4%;
  right: 4%;
  z-index: 4;
  pointer-events: none;
  user-select: none;
}

/* FORTO rendered as SVG — custom geometric letterforms */
.forto-svg {
  width: 100%;
  display: block;
  margin-bottom: 1.2%;
}

.url {
  font-family: 'Barlow Condensed', Arial, sans-serif;
  font-size: clamp(7px, 1.3%, 12px);
  font-weight: 700;
  letter-spacing: 0.10em;
  color: #0f0f0f;
  text-align: center;
}
</style>
</head>
<body>

<div id="poster">
  <div class="tagline">A Next-Generation Space Travel Airline</div>

  <div class="headline">
    Nueu Rules<br>
    Into the<br>
    Oddinary with<br>
    <span class="line-42">42</span>
  </div>

  <!-- Three.js full-poster canvas -->
  <div id="canvas-wrap">
    <canvas id="three-canvas"></canvas>
  </div>

  <div class="footer">
    <!--
      FORTO wordmark — hand-drawn SVG to match the poster:
      Very wide, heavy strokes. "F" has a left-pointing arrow cut from
      the bottom-left. Letters have thick uniform stems.
    -->
    <svg class="forto-svg" viewBox="0 0 920 160" xmlns="http://www.w3.org/2000/svg">
      <!-- F (with arrow notch bottom-left) -->
      <path d="M10 10 L10 150 L58 150 L58 90 L130 90 L130 58 L58 58 L58 44 L145 44 L145 10 Z" fill="#0f0f0f"/>
      <polygon points="10,150 44,150 10,116" fill="#237A2E"/> <!-- arrow cut -->

      <!-- O -->
      <path d="M178 10 Q155 10 155 80 Q155 150 178 150 L248 150 Q271 150 271 80 Q271 10 248 10 Z
               M178 42 L248 42 Q238 42 238 80 Q238 118 248 118 L178 118 Q168 118 168 80 Q168 42 178 42 Z"
            fill="#0f0f0f" fill-rule="evenodd"/>

      <!-- R -->
      <path d="M298 10 L298 150 L346 150 L346 95 L382 95 L422 150 L478 150 L432 89
               C454 80 462 58 448 34 C436 14 412 10 298 10 Z
               M346 42 L394 42 Q414 42 414 68 Q414 94 394 94 L346 94 Z"
            fill="#0f0f0f" fill-rule="evenodd"/>

      <!-- T -->
      <path d="M500 10 L500 44 L560 44 L560 150 L608 150 L608 44 L668 44 L668 10 Z" fill="#0f0f0f"/>

      <!-- O -->
      <path d="M700 10 Q677 10 677 80 Q677 150 700 150 L770 150 Q793 150 793 80 Q793 10 770 10 Z
               M700 42 L770 42 Q760 42 760 80 Q760 118 770 118 L700 118 Q690 118 690 80 Q690 42 700 42 Z"
            fill="#0f0f0f" fill-rule="evenodd"/>
    </svg>

    <div class="url">www.fortonorules.co.kr</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────────────────────────────
// The 3D object is a cube viewed from a corner-on angle so its
// silhouette is an irregular hexagon — matching image1.png exactly.
//
// Initial rotation:
//   Y = -Math.PI/4  (45° so we see corner-on, left/right faces equal)
//   X = Math.atan(1/Math.sqrt(2))  ≈ 35.26°  (true isometric tilt)
//
// Three visible faces: top, right-front, left-front.
// Each has unique subdivision lines per Reference.png.
//
// The cube is scaled large enough to dominate the poster,
// sitting in the center-left, overlapping headline and logo.
// ─────────────────────────────────────────────────────────────────────

const posterEl = document.getElementById('poster');
const canvas   = document.getElementById('three-canvas');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
camera.position.set(0, 0, 6.5);

// ── Materials ──────────────────────────────────────────────────────
const faceMat = new THREE.MeshBasicMaterial({
  color: 0xF2F2F2,
  side: THREE.FrontSide,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});
const lineMat = new THREE.LineBasicMaterial({ color: 0x1a1a1a });

// ── Helpers ────────────────────────────────────────────────────────

function quad(a, b, c, d) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    ...a, ...b, ...c,   ...a, ...c, ...d
  ]), 3));
  return new THREE.Mesh(g, faceMat);
}

function line3(pts) {
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(...p))),
    lineMat
  );
}

function arc(cx, cy, r, a0, a1, n, map) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n;
    pts.push(map(cx + r * Math.cos(a), cy + r * Math.sin(a)));
  }
  return pts;
}

// ── Cube geometry ──────────────────────────────────────────────────
const H = 1.7;  // half-size
const E = 0.003; // line offset

const cube = new THREE.Group();

// 6 faces — consistent outward-facing winding
cube.add(quad([-H,-H, H], [ H,-H, H], [ H, H, H], [-H, H, H])); // +Z
cube.add(quad([ H,-H,-H], [-H,-H,-H], [-H, H,-H], [ H, H,-H])); // -Z
cube.add(quad([ H,-H, H], [ H,-H,-H], [ H, H,-H], [ H, H, H])); // +X
cube.add(quad([-H,-H,-H], [-H,-H, H], [-H, H, H], [-H, H,-H])); // -X
cube.add(quad([-H, H, H], [ H, H, H], [ H, H,-H], [-H, H,-H])); // +Y
cube.add(quad([ H,-H, H], [-H,-H, H], [-H,-H,-H], [ H,-H,-H])); // -Y

// Outline
cube.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(H*2, H*2, H*2)),
  lineMat
));

// ── Pattern A: +Z face (front) ─────────────────────────────────────
// Reference LEFT panel:
//   horizontal line across upper portion
//   diagonal from top-left corner down to right end of horizontal
//   large quarter-arc from bottom-left corner sweeping up
{
  const z = H + E;
  const hy = H * 0.22;                           // horizontal cut height

  cube.add(line3([[-H, hy, z], [H, hy, z]]));    // horizontal cut
  cube.add(line3([[-H, H, z], [H, hy, z]]));     // diagonal top-left → cut right
  // arc center = bottom-left corner, radius = full diagonal width
  const a = arc(-H, -H, H*2, 0, Math.PI*0.5, 52, (x,y) => [x, y, z]);
  cube.add(line3(a));
}

// ── Pattern A mirror: -Z face (back) ──────────────────────────────
{
  const z = -H - E;
  const hy = H * 0.22;
  cube.add(line3([[H, hy, z], [-H, hy, z]]));
  cube.add(line3([[H, H, z], [-H, hy, z]]));
  const a = arc(H, -H, H*2, Math.PI*0.5, Math.PI, 52, (x,y) => [x, y, z]);
  cube.add(line3(a));
}

// ── Pattern B: +X face (right) ─────────────────────────────────────
// Reference CENTER panel:
//   vertical center cut top to bottom
//   two arcs radiating from top apex, sweeping left and right to bottom
{
  const x = H + E;
  cube.add(line3([[x, -H, 0], [x, H, 0]]));        // vertical center cut
  // left arc: top-center sweeps to bottom-left
  const aL = arc(0, H, H*1.45, Math.PI, Math.PI*1.5, 52, (dz,y) => [x, y,  dz]);
  cube.add(line3(aL));
  // right arc: top-center sweeps to bottom-right
  const aR = arc(0, H, H*1.45, 0, Math.PI*0.5, 52, (dz,y) => [x, y, dz]);
  cube.add(line3(aR));
}

// ── Pattern B mirror: -X face (left) ──────────────────────────────
{
  const x = -H - E;
  cube.add(line3([[x, -H, 0], [x, H, 0]]));
  const aL = arc(0, H, H*1.45, Math.PI*0.5, Math.PI, 52, (dz,y) => [x, y, -dz]);
  cube.add(line3(aL));
  const aR = arc(0, H, H*1.45, 0, Math.PI*0.5, 52, (dz,y) => [x, y, -dz]);
  cube.add(line3(aR));
}

// ── Pattern C: +Y face (top) ───────────────────────────────────────
// Reference RIGHT panel:
//   horizontal cut
//   diagonal from back-left to front-right
//   wide concave arc across lower (front) half
{
  const y = H + E;
  cube.add(line3([[-H, y, -H*0.15], [H, y, -H*0.15]]));   // horizontal
  cube.add(line3([[-H, y, -H],      [H, y,  H]]));         // diagonal
  const a = arc(0, 0, H*1.7, Math.PI*1.1, Math.PI*1.9, 52, (x,z) => [x, y, z]);
  cube.add(line3(a));
}

// ── Pattern C mirror: -Y face (bottom) ────────────────────────────
{
  const y = -H - E;
  cube.add(line3([[-H, y, -H*0.15], [H, y, -H*0.15]]));
  cube.add(line3([[-H, y,  H],      [H, y, -H]]));
  const a = arc(0, 0, H*1.7, Math.PI*1.1, Math.PI*1.9, 52, (x,z) => [x, y, z]);
  cube.add(line3(a));
}

scene.add(cube);

// ── Initial orientation = isometric corner-on view ─────────────────
// This gives the irregular hexagon silhouette matching image1.png
const BASE_Y = -Math.PI / 4;           // 45° yaw
const BASE_X =  Math.atan(1/Math.sqrt(2)); // ~35.26° pitch (true isometric)

cube.rotation.order = 'YXZ';
cube.rotation.y = BASE_Y;
cube.rotation.x = BASE_X;

// ── Mouse parallax ─────────────────────────────────────────────────
let mX = 0, mY = 0, sX = 0, sY = 0;

document.addEventListener('mousemove', e => {
  mX = (e.clientX / window.innerWidth  - 0.5);
  mY = (e.clientY / window.innerHeight - 0.5);
});
document.addEventListener('touchmove', e => {
  mX = (e.touches[0].clientX / window.innerWidth  - 0.5);
  mY = (e.touches[0].clientY / window.innerHeight - 0.5);
}, { passive: true });

// ── Resize ─────────────────────────────────────────────────────────
function resize() {
  const w = posterEl.clientWidth;
  const h = posterEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ── Render loop ────────────────────────────────────────────────────
// Rotation speed: 0.15 rad/s ≈ 1 revolution per 42 seconds (a nod to "42")
// Mouse influence: very subtle tilt, museum-quality easing 0.035
let t = 0, last = 0;

function tick(ts) {
  requestAnimationFrame(tick);
  const dt = Math.min((ts - last) * 0.001, 0.05);
  last = ts;
  t   += dt;

  const e = 1 - Math.pow(1 - 0.035, dt * 60);
  sX += (mX - sX) * e;
  sY += (mY - sY) * e;

  cube.rotation.y = BASE_Y + t * 0.15  + sX * 0.22;
  cube.rotation.x = BASE_X             + sY * 0.12;
  cube.rotation.z =                      sX * 0.018;

  renderer.render(scene, camera);
}

requestAnimationFrame(ts => { last = ts; requestAnimationFrame(tick); });
</script>
</body>
</html>
