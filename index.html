<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribbon Geometry</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #07070e; }
canvas { display: block; }
#hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(200, 210, 225, 0.22);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 0.30em;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
  transition: opacity 2s ease;
}
</style>
</head>
<body>
<div id="hint">Drag nodes &nbsp;&middot;&nbsp; Orbit &nbsp;&middot;&nbsp; Scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070e);
scene.fog = new THREE.FogExp2(0x07070e, 0.022);

// ── Camera ────────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 200);
camera.position.set(0, 0.8, 14);
camera.lookAt(0, 0, 0);

// ── Orbit controls ────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance   = 4;
controls.maxDistance   = 40;
controls.target.set(0, 0, 0);
controls.autoRotate      = true;
controls.autoRotateSpeed = 1.0;

controls.addEventListener('start', () => {
  controls.autoRotate = false;
  document.getElementById('hint').style.opacity = '0';
});

// ── Lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x0c0c1e, 5));

const key = new THREE.DirectionalLight(0xfff5e8, 3.2);
key.position.set(5, 9, 7);
scene.add(key);

const fill = new THREE.DirectionalLight(0x2233bb, 1.2);
fill.position.set(-7, -3, -5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x6677aa, 0.9);
rim.position.set(1, -8, -4);
scene.add(rim);

// ── Geometry parameters ───────────────────────────────────────────────────────
const SEG_L  = 24;   // segments along ribbon length
const SEG_W  = 12;   // segments across ribbon width (more = smoother wide plane)
const HALF_W = 1.75; // ribbon half-width → 3.5 total (wide architectural plane)
const TWIST  = 0.20; // radians of twist over full ribbon length

// Shared temp vectors (safe in single-threaded JS)
const _ld = new THREE.Vector3();
const _wa = new THREE.Vector3();
const _kw = new THREE.Vector3();
const Z_AX = new THREE.Vector3(0, 0, 1);
const Y_AX = new THREE.Vector3(0, 1, 0);

// ── Asymmetric 4-direction node positions ─────────────────────────────────────
// Pinwheel Z topology: N/W toward viewer, S/E away — creates impossible-geometry depth
const nodePos = {
  N: new THREE.Vector3( 0.0,  4.0,  1.3),
  S: new THREE.Vector3( 0.0, -4.0, -1.3),
  E: new THREE.Vector3( 4.0,  0.0, -1.1),
  W: new THREE.Vector3(-4.0,  0.0,  1.1),
};

// ── Ribbon BufferGeometry factory ─────────────────────────────────────────────
// Returns a geometry with static UVs and indices; positions updated separately.
function makeRibbonGeo() {
  const nv  = (SEG_L + 1) * (SEG_W + 1);
  const pos = new Float32Array(nv * 3);  // zeroed, will be filled by updateRibbon
  const uvs = new Float32Array(nv * 2);

  for (let i = 0; i <= SEG_L; i++) {
    for (let j = 0; j <= SEG_W; j++) {
      const id      = i * (SEG_W + 1) + j;
      uvs[id * 2]   = i / SEG_L;
      uvs[id * 2+1] = j / SEG_W;
    }
  }

  const idx = [];
  for (let i = 0; i < SEG_L; i++) {
    for (let j = 0; j < SEG_W; j++) {
      const a = i       * (SEG_W + 1) + j;
      const b = a + 1;
      const c = (i + 1) * (SEG_W + 1) + j;
      const d = c + 1;
      idx.push(a, c, b,  b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  return geo;
}

// ── Ribbon vertex update ───────────────────────────────────────────────────────
// Fills position buffer from center (0,0,0) to endpoint ep.
// Width direction is derived as cross(lenDir, Z), giving a stable orientation
// that appears flat from the front (+Z) camera view.
// Rodrigues rotation adds a subtle architectural twist along the ribbon.
function updateRibbon(geo, ep) {
  const pa  = geo.attributes.position.array;
  const len = ep.length();
  if (len < 1e-3) return;

  _ld.copy(ep).divideScalar(len);  // unit ribbon direction

  // Width axis = cross(lenDir, Z), falls back to cross(lenDir, Y) near Z-parallel
  _wa.crossVectors(_ld, Z_AX);
  if (_wa.lengthSq() < 1e-4) _wa.crossVectors(_ld, Y_AX);
  _wa.normalize();

  // k×w for Rodrigues (kDotW = 0 because w ⊥ ld)
  _kw.crossVectors(_ld, _wa);

  for (let i = 0; i <= SEG_L; i++) {
    const t  = i / SEG_L;
    const cx = ep.x * t;
    const cy = ep.y * t;
    const cz = ep.z * t;

    // Rotate width vector around ribbon direction by TWIST * t radians
    const cosA = Math.cos(TWIST * t);
    const sinA = Math.sin(TWIST * t);
    const wx = _wa.x * cosA + _kw.x * sinA;
    const wy = _wa.y * cosA + _kw.y * sinA;
    const wz = _wa.z * cosA + _kw.z * sinA;

    for (let j = 0; j <= SEG_W; j++) {
      const s  = (j / SEG_W - 0.5) * 2;       // −1 to +1 across width
      const hw = HALF_W * (1 - 0.10 * t * t);  // slight taper at tip only
      const id = (i * (SEG_W + 1) + j) * 3;
      pa[id]     = cx + wx * s * hw;
      pa[id + 1] = cy + wy * s * hw;
      pa[id + 2] = cz + wz * s * hw;
    }
  }

  geo.attributes.position.needsUpdate = true;
  geo.computeVertexNormals();
}

// ── Surface materials ─────────────────────────────────────────────────────────
// N/S ribbons: warm stone/ivory   E/W ribbons: cool silver/steel
const matNS = new THREE.MeshStandardMaterial({
  color: 0xddd5c4, roughness: 0.20, metalness: 0.62, side: THREE.DoubleSide,
});
const matEW = new THREE.MeshStandardMaterial({
  color: 0xc4cdd8, roughness: 0.17, metalness: 0.68, side: THREE.DoubleSide,
});

// ── Ribbon meshes ─────────────────────────────────────────────────────────────
const ribbons = {};
const DIRS    = ['N', 'S', 'E', 'W'];

for (const dir of DIRS) {
  const geo  = makeRibbonGeo();
  updateRibbon(geo, nodePos[dir]);
  const mesh = new THREE.Mesh(geo, (dir === 'N' || dir === 'S') ? matNS : matEW);
  scene.add(mesh);
  ribbons[dir] = mesh;
}

// ── Center welding marker ─────────────────────────────────────────────────────
// Small octahedron at origin visually anchors the shared center weld point.
scene.add(new THREE.Mesh(
  new THREE.OctahedronGeometry(0.20, 2),
  new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0x556688, roughness: 0.04, metalness: 1.0,
  })
));

// ── Node handle spheres ───────────────────────────────────────────────────────
const sphereGeo = new THREE.SphereGeometry(0.23, 32, 24);
const nodes     = {};

for (const dir of DIRS) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: new THREE.Color(0x0f1e2e),
    roughness: 0.07, metalness: 0.95,
  });
  const m = new THREE.Mesh(sphereGeo, mat);
  m.position.copy(nodePos[dir]);
  m.userData.dir = dir;
  scene.add(m);
  nodes[dir] = m;
}

// ── Drag / hover interaction ──────────────────────────────────────────────────
const rc       = new THREE.Raycaster();
const m2       = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const iPt      = new THREE.Vector3();
const camDir   = new THREE.Vector3();

let activeDir  = null;
let hoveredDir = null;

const nodeList = () => Object.values(nodes);

function setEm(dir, hex) {
  nodes[dir].material.emissive.setHex(hex);
}

renderer.domElement.addEventListener('pointermove', e => {
  m2.set(
    (e.clientX / innerWidth)  *  2 - 1,
    (e.clientY / innerHeight) * -2 + 1
  );
  rc.setFromCamera(m2, camera);

  if (activeDir) {
    // Drag: project mouse onto camera-facing plane at the dragged node
    if (rc.ray.intersectPlane(dragPlane, iPt)) {
      // Prevent node collapsing into center
      if (iPt.length() < 1.5) iPt.normalize().multiplyScalar(1.5);
      nodePos[activeDir].copy(iPt);
      nodes[activeDir].position.copy(iPt);
      updateRibbon(ribbons[activeDir].geometry, iPt);
    }
    return;
  }

  // Hover detection
  const hits   = rc.intersectObjects(nodeList());
  const nowDir = hits.length ? hits[0].object.userData.dir : null;
  if (nowDir !== hoveredDir) {
    if (hoveredDir) setEm(hoveredDir, 0x0f1e2e);
    hoveredDir = nowDir;
    if (hoveredDir) setEm(hoveredDir, 0x4488cc);
    renderer.domElement.style.cursor = hoveredDir ? 'grab' : '';
  }
});

renderer.domElement.addEventListener('pointerdown', e => {
  m2.set(
    (e.clientX / innerWidth)  *  2 - 1,
    (e.clientY / innerHeight) * -2 + 1
  );
  rc.setFromCamera(m2, camera);
  const hits = rc.intersectObjects(nodeList());
  if (!hits.length) return;

  activeDir = hits[0].object.userData.dir;
  setEm(activeDir, 0x66aaff);
  controls.enabled = false;
  controls.autoRotate = false;
  renderer.domElement.style.cursor = 'grabbing';

  // Drag plane: perpendicular to camera direction, passing through the node
  camera.getWorldDirection(camDir);
  dragPlane.setFromNormalAndCoplanarPoint(camDir, nodePos[activeDir]);

  renderer.domElement.setPointerCapture(e.pointerId);
  e.preventDefault();
});

renderer.domElement.addEventListener('pointerup', () => {
  if (activeDir) {
    setEm(activeDir, hoveredDir === activeDir ? 0x4488cc : 0x0f1e2e);
    activeDir = null;
  }
  controls.enabled = true;
  renderer.domElement.style.cursor = hoveredDir ? 'grab' : '';
});

// ── Window resize ─────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Render loop ───────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
