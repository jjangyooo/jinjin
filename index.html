<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTLIGHT — Second Edition Exhibition</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #050508;
  cursor: none;
}

/* ── POSTER LAYER (imageA.png) ── */
#poster-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

#poster-img {
  display: block;
  height: 100vh;
  width: auto;
  max-width: 100vw;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* ── DARKNESS CANVAS ── */
#mask-canvas {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* ── BLOOM CANVAS ── */
#bloom-canvas {
  position: fixed;
  inset: 0;
  z-index: 11;
  pointer-events: none;
  mix-blend-mode: screen;
}

/* ── FILM GRAIN ── */
#grain-canvas {
  position: fixed;
  inset: 0;
  z-index: 12;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: 0.20;
}

/* ── EDGE VIGNETTE ── */
#vignette {
  position: fixed;
  inset: 0;
  z-index: 14;
  pointer-events: none;
  background: radial-gradient(
    ellipse 72% 68% at 50% 50%,
    transparent 30%,
    rgba(3,3,6,0.32) 58%,
    rgba(3,3,6,0.65) 78%,
    rgba(3,3,6,0.92) 100%
  );
}

/* ── CONTROLLER (imageB.png) ── */
#controller {
  position: fixed;
  top: 0; left: 0;
  z-index: 20;
  pointer-events: none;
  will-change: transform;
}

#controller-img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  /* Invert so black-on-white becomes white-on-black,
     then screen blend makes white glow and black disappear —
     the controller appears as luminous letterforms in the dark */
  filter: invert(1);
  mix-blend-mode: screen;
  opacity: 0.70;
}

/* ── INTRO: projector warm-up ── */
#intro {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #050508;
  pointer-events: none;
  transition: opacity 3.4s cubic-bezier(0.42, 0, 0.18, 1);
}

/* ── HINT ── */
#hint {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  color: rgba(255,255,255,0.13);
  font-family: Georgia, serif;
  font-size: 9.5px;
  letter-spacing: 0.30em;
  text-transform: uppercase;
  pointer-events: none;
  transition: opacity 2s ease;
  white-space: nowrap;
}
</style>
</head>
<body>

<!-- Poster layer: exact imageA.png, never altered -->
<div id="poster-layer">
  <img id="poster-img" src="imageA.png" alt="">
</div>

<canvas id="mask-canvas"></canvas>
<canvas id="bloom-canvas"></canvas>
<canvas id="grain-canvas"></canvas>
<div id="vignette"></div>

<!-- Spotlight controller: imageB.png, follows cursor, scaled by scroll -->
<div id="controller">
  <img id="controller-img" src="imageB.png" alt="">
</div>

<div id="intro"></div>
<div id="hint">Move cursor &ensp;&middot;&ensp; Scroll to adjust distance</div>

<script>
(function () {
  'use strict';

  const mCvs   = document.getElementById('mask-canvas');
  const bCvs   = document.getElementById('bloom-canvas');
  const gCvs   = document.getElementById('grain-canvas');
  const ctrlEl = document.getElementById('controller');
  const hintEl = document.getElementById('hint');
  const introEl = document.getElementById('intro');

  const mCtx = mCvs.getContext('2d');
  const bCtx = bCvs.getContext('2d');
  const gCtx = gCvs.getContext('2d');

  // ── Constants ──────────────────────────────────────────────
  const EASE_POS   = 0.18;   // position follow easing (spec: 0.16–0.22)
  const EASE_DEPTH = 0.10;   // depth (scroll) easing
  const CTRL_MIN   = 68;     // controller px width when far (small)
  const CTRL_MAX   = 340;    // controller px width when close (large)
  const SPOT_FAR   = 0.68;   // spotlight radius as fraction of screen diagonal — far
  const SPOT_NEAR  = 0.09;   // spotlight radius — close/tight

  // ── Dimensions ────────────────────────────────────────────
  let W = 0, H = 0, DIAG = 0;

  // ── State ─────────────────────────────────────────────────
  // Start depth=0.48: mid-range dramatic beam revealing partial poster
  let tx, ty, tdep = 0.48;
  let dx, dy, ddep = 0.48;
  let hintFaded = false;
  let frameCount = 0;

  // ── Grain: warm-tinted 320px noise tile ───────────────────
  const GS     = 320;
  const grainC = document.createElement('canvas');
  grainC.width = grainC.height = GS;
  const grainX = grainC.getContext('2d');
  const grainD = grainX.createImageData(GS, GS);

  function refreshGrain() {
    const d = grainD.data;
    for (let i = 0; i < d.length; i += 4) {
      const v  = Math.random() * 255 | 0;
      d[i]   = Math.min(255, v + 9);   // warm: R+9
      d[i+1] = v;
      d[i+2] = Math.max(0,  v - 7);   // cool: B-7
      d[i+3] = 30;
    }
    grainX.putImageData(grainD, 0, 0);
  }

  function drawGrain() {
    gCtx.clearRect(0, 0, W, H);
    const ox = Math.random() * GS | 0;
    const oy = Math.random() * GS | 0;
    for (let px = -ox; px < W; px += GS)
      for (let py = -oy; py < H; py += GS)
        gCtx.drawImage(grainC, px, py);
  }

  // ── Intro: analog projector lamp warm-up ──────────────────
  setTimeout(() => {
    introEl.style.opacity = '0';
    introEl.addEventListener('transitionend', () => introEl.remove(), { once: true });
  }, 200);

  // ── Resize ────────────────────────────────────────────────
  function resize() {
    W    = window.innerWidth;
    H    = window.innerHeight;
    DIAG = Math.hypot(W, H);
    mCvs.width  = bCvs.width  = gCvs.width  = W;
    mCvs.height = bCvs.height = gCvs.height = H;
    if (tx === undefined) { tx = dx = W * 0.5; ty = dy = H * 0.5; }
    refreshGrain();
  }
  window.addEventListener('resize', resize);

  // ── Input ─────────────────────────────────────────────────
  document.addEventListener('mousemove', e => {
    tx = e.clientX;
    ty = e.clientY;
    if (!hintFaded) { hintEl.style.opacity = '0'; hintFaded = true; }
  });

  // Scroll scales the controller: bigger = closer = tighter beam
  document.addEventListener('wheel', e => {
    tdep = Math.min(1, Math.max(0, tdep + e.deltaY * 0.0007));
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    e.preventDefault();
  }, { passive: false });

  setTimeout(() => { hintEl.style.opacity = '0'; }, 5000);

  // ── Math helpers ──────────────────────────────────────────
  const lerp = (a, b, t) => a + (b - a) * t;
  // Framerate-independent easing factor
  const fi   = (f, dt) => 1 - Math.pow(1 - f, dt * 60);

  // ── MASK: near-black darkness with organic spotlight punch ─
  function drawMask(x, y, ctrlR, spotR, ts) {
    mCtx.clearRect(0, 0, W, H);

    // Near-black base
    mCtx.globalCompositeOperation = 'source-over';
    mCtx.fillStyle = 'rgba(5,5,8,0.985)';
    mCtx.fillRect(0, 0, W, H);

    // Cut the spotlight hole with destination-out
    mCtx.globalCompositeOperation = 'destination-out';

    const s = ts * 0.001;

    // Organic multi-axis drift — makes edges feel imperfect and physical
    const breathe = 1 + 0.028 * Math.sin(s * 0.82);
    const ox1 = Math.sin(s * 0.71) * 4.8 + Math.cos(s * 1.19) * 3.1;
    const oy1 = Math.cos(s * 0.57) * 6.0 + Math.sin(s * 1.07) * 2.8;
    const ox2 = Math.sin(s * 0.93 + 1.8) * 5.4 + Math.cos(s * 0.63 + 0.6) * 2.6;
    const oy2 = Math.cos(s * 0.76 + 1.1) * 4.1 + Math.sin(s * 1.16 + 2.2) * 3.4;
    const ox3 = Math.cos(s * 0.51 + 0.9) * 3.6;
    const oy3 = Math.sin(s * 0.65 + 2.0) * 4.1;

    // Primary cone: sharp theatrical falloff, flat bright center
    const g1 = mCtx.createRadialGradient(
      x + ox1 * 0.20, y + oy1 * 0.20, ctrlR * 0.08,
      x + ox1 * 0.06, y + oy1 * 0.06, spotR * breathe
    );
    g1.addColorStop(0.00, 'rgba(0,0,0,1.00)');
    g1.addColorStop(0.52, 'rgba(0,0,0,0.96)');
    g1.addColorStop(0.72, 'rgba(0,0,0,0.76)');
    g1.addColorStop(0.84, 'rgba(0,0,0,0.40)');
    g1.addColorStop(0.92, 'rgba(0,0,0,0.12)');
    g1.addColorStop(0.97, 'rgba(0,0,0,0.02)');
    g1.addColorStop(1.00, 'rgba(0,0,0,0.00)');
    mCtx.fillStyle = g1;
    mCtx.fillRect(0, 0, W, H);

    // Secondary: irregular edge offset
    const g2 = mCtx.createRadialGradient(
      x + ox2 * 0.42, y + oy2 * 0.42, ctrlR * 0.05,
      x + ox2 * 0.15, y + oy2 * 0.15, spotR * 0.80 * breathe
    );
    g2.addColorStop(0.00, 'rgba(0,0,0,0.46)');
    g2.addColorStop(0.46, 'rgba(0,0,0,0.24)');
    g2.addColorStop(0.76, 'rgba(0,0,0,0.08)');
    g2.addColorStop(1.00, 'rgba(0,0,0,0.00)');
    mCtx.fillStyle = g2;
    mCtx.fillRect(0, 0, W, H);

    // Tertiary: slow breathing distortion at edge
    const g3 = mCtx.createRadialGradient(
      x + ox3 * 0.36, y + oy3 * 0.36, ctrlR * 0.04,
      x + ox3 * 0.12, y + oy3 * 0.12,
      spotR * 0.88 * (1 + 0.02 * Math.cos(s * 1.04))
    );
    g3.addColorStop(0.00, 'rgba(0,0,0,0.26)');
    g3.addColorStop(0.54, 'rgba(0,0,0,0.12)');
    g3.addColorStop(0.86, 'rgba(0,0,0,0.03)');
    g3.addColorStop(1.00, 'rgba(0,0,0,0.00)');
    mCtx.fillStyle = g3;
    mCtx.fillRect(0, 0, W, H);

    // Subtle center dimming: keeps hotspot from looking screen-lit
    mCtx.globalCompositeOperation = 'source-over';
    const gc = mCtx.createRadialGradient(x, y, 0, x, y, ctrlR * 2.8);
    gc.addColorStop(0.0, 'rgba(5,5,8,0.22)');
    gc.addColorStop(0.4, 'rgba(5,5,8,0.10)');
    gc.addColorStop(1.0, 'rgba(5,5,8,0.00)');
    mCtx.fillStyle = gc;
    mCtx.fillRect(0, 0, W, H);
  }

  // ── BLOOM: warm cinematic optical glow at boundary ─────────
  // mix-blend-mode:screen on canvas → bloom visible only over darkness
  function drawBloom(x, y, ctrlR, spotR, ts) {
    bCtx.clearRect(0, 0, W, H);

    const s       = ts * 0.001;
    const breathe = 1 + 0.024 * Math.sin(s * 0.82 + 0.5);
    const flicker = 0.78 + 0.22 * (0.5 + 0.5 * Math.sin(s * 1.31) * Math.cos(s * 0.86));

    // Corona: peaks at the dark→light boundary
    const corona = bCtx.createRadialGradient(
      x, y, spotR * 0.60 * breathe,
      x, y, spotR * 1.12 * breathe
    );
    corona.addColorStop(0.00, 'rgba(0,0,0,0)');
    corona.addColorStop(0.26, `rgba(255,244,214,${(0.52 * flicker).toFixed(3)})`);
    corona.addColorStop(0.50, `rgba(248,233,196,${(0.36 * flicker).toFixed(3)})`);
    corona.addColorStop(0.72, `rgba(234,218,180,${(0.18 * flicker).toFixed(3)})`);
    corona.addColorStop(1.00, 'rgba(0,0,0,0)');
    bCtx.fillStyle = corona;
    bCtx.fillRect(0, 0, W, H);

    // Wide outer halo: fully in darkness, warm amber diffusion
    const halo = bCtx.createRadialGradient(
      x, y, spotR * 0.75 * breathe,
      x, y, spotR * 1.50 * breathe
    );
    halo.addColorStop(0.00, 'rgba(0,0,0,0)');
    halo.addColorStop(0.20, `rgba(255,246,216,${(0.30 * flicker).toFixed(3)})`);
    halo.addColorStop(0.48, `rgba(242,226,190,${(0.18 * flicker).toFixed(3)})`);
    halo.addColorStop(0.76, `rgba(218,202,164,${(0.08 * flicker).toFixed(3)})`);
    halo.addColorStop(1.00, 'rgba(0,0,0,0)');
    bCtx.fillStyle = halo;
    bCtx.fillRect(0, 0, W, H);

    // Horizontal anamorphic lens streak
    const sLen  = spotR * 0.98;
    const sHalf = Math.max(ctrlR * 1.3, 24);
    const scy   = y - spotR * 0.052;
    bCtx.save();
    bCtx.translate(x, scy);
    bCtx.scale(1, sHalf / sLen);
    bCtx.translate(-x, -scy);
    const st1 = bCtx.createRadialGradient(x, scy, spotR * 0.56, x, scy, sLen);
    st1.addColorStop(0.00, 'rgba(0,0,0,0)');
    st1.addColorStop(0.16, `rgba(255,253,238,${(0.42 * flicker).toFixed(3)})`);
    st1.addColorStop(0.44, `rgba(248,240,216,${(0.22 * flicker).toFixed(3)})`);
    st1.addColorStop(0.76, `rgba(230,216,186,${(0.09 * flicker).toFixed(3)})`);
    st1.addColorStop(1.00, 'rgba(0,0,0,0)');
    bCtx.fillStyle = st1;
    bCtx.fillRect(0, 0, W, H);
    bCtx.restore();

    // Vertical ghost streak: faint, slightly offset
    const vLen  = spotR * 0.72;
    const vHalf = Math.max(ctrlR * 0.58, 15);
    const scx   = x + spotR * 0.074;
    bCtx.save();
    bCtx.translate(scx, y);
    bCtx.scale(vHalf / vLen, 1);
    bCtx.translate(-scx, -y);
    const st2 = bCtx.createRadialGradient(scx, y, spotR * 0.48, scx, y, vLen);
    st2.addColorStop(0.00, 'rgba(0,0,0,0)');
    st2.addColorStop(0.22, `rgba(255,250,226,${(0.22 * flicker).toFixed(3)})`);
    st2.addColorStop(0.56, `rgba(240,228,202,${(0.11 * flicker).toFixed(3)})`);
    st2.addColorStop(1.00, 'rgba(0,0,0,0)');
    bCtx.fillStyle = st2;
    bCtx.fillRect(0, 0, W, H);
    bCtx.restore();

    // Slow edge pulse: irregular organic flicker at beam boundary
    const pulse = Math.abs(Math.sin(s * 0.43)) * Math.abs(Math.cos(s * 0.67));
    const edge  = bCtx.createRadialGradient(x, y, spotR * 0.78, x, y, spotR * 1.02);
    edge.addColorStop(0.0, 'rgba(0,0,0,0)');
    edge.addColorStop(0.5, `rgba(255,248,226,${(0.18 * pulse).toFixed(3)})`);
    edge.addColorStop(1.0, 'rgba(0,0,0,0)');
    bCtx.fillStyle = edge;
    bCtx.fillRect(0, 0, W, H);
  }

  // ── MAIN LOOP ─────────────────────────────────────────────
  let lastTs = 0;

  function frame(ts) {
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    frameCount++;

    const ep = fi(EASE_POS,   dt);
    const ed = fi(EASE_DEPTH, dt);

    dx   = lerp(dx,   tx,   ep);
    dy   = lerp(dy,   ty,   ep);
    ddep = lerp(ddep, tdep, ed);

    // depth → controller size (larger = closer) and spotlight radius (larger = tighter)
    const ctrlSize = lerp(CTRL_MIN, CTRL_MAX, ddep);
    const ctrlR    = ctrlSize * 0.5;
    const spotR    = DIAG * lerp(SPOT_FAR, SPOT_NEAR, ddep);

    drawMask(dx, dy, ctrlR, spotR, ts);
    drawBloom(dx, dy, ctrlR, spotR, ts);

    // Grain refreshes every 2 frames → 30fps rolling analog texture
    if (frameCount % 2 === 0) refreshGrain();
    drawGrain();

    // Controller: GPU transform only — no layout thrash
    ctrlEl.style.transform = `translate3d(${(dx - ctrlR).toFixed(2)}px,${(dy - ctrlR).toFixed(2)}px,0)`;
    ctrlEl.style.width     = ctrlSize.toFixed(1) + 'px';
    ctrlEl.style.height    = ctrlSize.toFixed(1) + 'px';

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(frame); });
}());
</script>
</body>
</html>
