<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spatial Symbol Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; background: #fff; }
    canvas { display: block; }

    .ui {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      user-select: none;
    }

    .row { display: flex; gap: 6px; }

    button {
      border: 1px solid #000; background: #fff;
      padding: 7px 13px; cursor: pointer;
      font-size: 11px; letter-spacing: 0.07em;
      font-family: inherit; transition: background 0.1s, color 0.1s;
    }
    button:hover { background: #f2f2f2; }
    button.active { background: #000; color: #fff; }

    #hint {
      font-size: 10px; color: #b0b0b0;
      letter-spacing: 0.04em; line-height: 1.6;
    }

    #coords {
      font-size: 10px; color: #888;
      letter-spacing: 0.03em; min-height: 14px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

<div class="ui">
  <div class="row">
    <button onclick="resetNodes()">RESET</button>
    <button id="btnL" onclick="toggleLabels()" class="active">LABELS</button>
  </div>
  <div id="hint">drag node · shift+drag = z depth<br>scroll = zoom · drag bg = orbit</div>
  <div id="coords"></div>
</div>

<script>

// ── Structure ─────────────────────────────────────────────────────────────────

const DEFAULTS = [
  { id:'N', x:   0, y:-158, z: 0 },
  { id:'E', x: 172, y:   0, z: 0 },
  { id:'S', x:   0, y: 108, z: 0 },
  { id:'W', x:-194, y:   0, z: 0 },
]

let nodes = DEFAULTS.map(d => ({ ...d }))

function resetNodes() {
  nodes = DEFAULTS.map(d => ({ ...d }))
  setCoords('')
}

// ── Camera ────────────────────────────────────────────────────────────────────

let camRX = 0.25,  camRY = -0.14
let tgtRX = 0.25,  tgtRY = -0.14
let inerX = 0,     inerY = 0
let zoom  = 1.0,   tgtZoom = 1.0
const FOV = 460

// ── Interaction state ─────────────────────────────────────────────────────────

let selNode  = null
let dragNode = false
let dragCam  = false
let zMode    = false
let pmx = 0, pmy = 0
let showLabels = true
let hoverNode  = null

// ── 3D math ───────────────────────────────────────────────────────────────────

function rotPt(p, rx, ry) {
  const cy = Math.cos(ry), sy = Math.sin(ry)
  const x1 = p.x * cy - p.z * sy
  const z1 = p.x * sy + p.z * cy
  const cx = Math.cos(rx), sx = Math.sin(rx)
  const y1 = p.y * cx - z1 * sx
  const z2 = p.y * sx + z1 * cx
  return { x: x1, y: y1, z: z2 }
}

function projPt(p) {
  const s = (FOV / (FOV + p.z + 60)) * zoom
  return { sx: p.x * s, sy: p.y * s, z: p.z, s }
}

function projectNode(n) {
  return projPt(rotPt(n, camRX, camRY))
}

// Inverse-camera direction vectors for world-space dragging.
// These map screen deltas to world-space movement.
function worldRight() {
  return {
    x:  Math.cos(camRY),
    y: -Math.sin(camRY) * Math.sin(camRX),
    z: -Math.sin(camRY) * Math.cos(camRX)
  }
}
function worldDown() {
  return {
    x: 0,
    y:  Math.cos(camRX),
    z: -Math.sin(camRX)
  }
}
function worldFwd() {
  return {
    x:  Math.sin(camRY),
    y:  Math.cos(camRY) * Math.sin(camRX),
    z:  Math.cos(camRY) * Math.cos(camRX)
  }
}

// ── p5.js setup ───────────────────────────────────────────────────────────────

function setup() {
  createCanvas(windowWidth, windowHeight)
  document.querySelector('canvas')
    .addEventListener('contextmenu', e => e.preventDefault())
}

// ── Draw ──────────────────────────────────────────────────────────────────────

function draw() {
  background(255)

  // Camera lerp
  camRX += (tgtRX - camRX) * 0.09
  camRY += (tgtRY - camRY) * 0.09
  zoom  += (tgtZoom - zoom) * 0.12

  // Inertia (only when not actively dragging)
  if (!dragCam && !dragNode) {
    tgtRX += inerX
    tgtRY += inerY
    inerX *= 0.84
    inerY *= 0.84
    tgtRX = Math.max(-1.3, Math.min(1.3, tgtRX))
  }

  const ox = width  / 2
  const oy = height / 2

  // Hover detection
  hoverNode = null
  if (!dragNode) {
    let best = 30
    for (const n of nodes) {
      const p = projectNode(n)
      const d = dist(mouseX - ox, mouseY - oy, p.sx, p.sy)
      if (d < best) { best = d; hoverNode = n }
    }
  }

  // Project nodes
  const pn = nodes.map(n => ({ n, p: projectNode(n) }))

  push()
  translate(ox, oy)

  // ── Edges ──────────────────────────────────────────────
  const EDGES = [['W','N'], ['N','S'], ['W','E']]
  const byId = {}
  for (const { n, p } of pn) byId[n.id] = p

  noFill()
  for (const [aid, bid] of EDGES) {
    const a = byId[aid], b = byId[bid]
    if (!a || !b) continue
    const avgZ = (a.z + b.z) * 0.5
    const avgS = (a.s + b.s) * 0.5

    const al = constrain(map(avgZ, -260, 260, 218, 48), 38, 225)
    const wt = constrain(map(avgS, 0.38 * zoom, 1.62 * zoom, 0.5, 2.4), 0.35, 2.8)

    stroke(0, 0, 0, al)
    strokeWeight(wt)
    line(a.sx, a.sy, b.sx, b.sy)
  }

  // ── Nodes ───────────────────────────────────────────────
  for (const { n, p } of pn) {
    const al  = constrain(map(p.z, -260, 260, 255, 62), 50, 255)
    const sz  = constrain(map(p.s, 0.38 * zoom, 1.62 * zoom, 4.5, 11.5), 4, 13)
    const isH = hoverNode === n
    const isS = selNode   === n

    // Z depth indicator — dashed vertical tick
    if (Math.abs(n.z) > 6) {
      const tLen = constrain(map(Math.abs(n.z), 0, 240, 0, 22), 0, 22)
      const tDir = n.z > 0 ? 1 : -1
      const tAl  = constrain(al * 0.35, 15, 110)
      drawingContext.setLineDash([2.5, 2.5])
      stroke(0, tAl)
      strokeWeight(0.7)
      line(p.sx, p.sy + sz * 0.5 * tDir, p.sx, p.sy + (sz * 0.5 + tLen) * tDir)
      drawingContext.setLineDash([])
    }

    // Selection / hover ring
    if (isH || isS) {
      noFill()
      stroke(0, al)
      strokeWeight(isS ? 1.5 : 1.0)
      ellipse(p.sx, p.sy, sz + 13, sz + 13)
    }

    // Node fill
    noStroke()
    fill(isSel(n) ? 0 : 0, al)
    ellipse(p.sx, p.sy, sz, sz)

    // Label
    if (showLabels) {
      const lal = constrain(al * 0.72, 32, 185)

      // Offset label to fixed compass direction in screen space
      let lx = p.sx, ly = p.sy
      const gap = sz * 0.5 + 11
      if (n.id === 'N') ly -= gap
      if (n.id === 'S') ly += gap
      if (n.id === 'E') lx += gap
      if (n.id === 'W') lx -= gap

      noStroke()
      fill(0, lal)
      textSize(10)
      textAlign(CENTER, CENTER)
      text(n.id, lx, ly)

      // Z annotation
      if (Math.abs(n.z) > 12) {
        const zStr = (n.z > 0 ? '+' : '') + Math.round(n.z)
        textSize(8)
        fill(110, constrain(lal * 0.65, 18, 130))
        const zy = (n.id === 'N') ? ly - 11 : ly + 11
        text(zStr, lx, zy)
      }
    }
  }

  // Active drag readout on node
  if (dragNode && selNode) {
    const p = projectNode(selNode)
    const xStr = (selNode.x >= 0 ? '+' : '') + Math.round(selNode.x)
    const yStr = (selNode.y >= 0 ? '+' : '') + Math.round(selNode.y)
    const zStr = (selNode.z >= 0 ? '+' : '') + Math.round(selNode.z)
    noStroke()
    fill(0, 155)
    textSize(9)
    textAlign(LEFT, CENTER)
    const readout = zMode ? 'z ' + zStr : 'x ' + xStr + '  y ' + yStr
    text(readout, p.sx + 18, p.sy)
  }

  pop()
}

// helper so fill() call is less confusing
function isSel(n) { return selNode === n }

// ── Mouse ─────────────────────────────────────────────────────────────────────

function mousePressed() {
  if (mouseButton === CENTER) return

  const ox = width / 2, oy = height / 2

  // Hit test nodes
  let best = 30, hit = null
  for (const n of nodes) {
    const p = projectNode(n)
    const d = dist(mouseX - ox, mouseY - oy, p.sx, p.sy)
    if (d < best) { best = d; hit = n }
  }

  if (hit) {
    selNode  = hit
    dragNode = true
    dragCam  = false
    zMode    = (mouseButton === RIGHT) || keyIsDown(SHIFT)
    inerX = 0; inerY = 0
    setHint(zMode
      ? 'z depth · ' + hit.id + '  (drag left/right)'
      : hit.id + ' · shift+drag = z depth')
  } else {
    selNode  = null
    dragNode = false
    dragCam  = true
    inerX = 0; inerY = 0
  }

  pmx = mouseX; pmy = mouseY
  return false
}

function mouseDragged() {
  const dx = mouseX - pmx
  const dy = mouseY - pmy

  if (dragNode && selNode) {
    zMode = (mouseButton === RIGHT) || keyIsDown(SHIFT)

    const sf = 1.0 / zoom   // world units per screen pixel

    if (zMode) {
      // Move along camera forward axis
      const f = worldFwd()
      const d = dx * sf * 1.5
      selNode.x += f.x * d
      selNode.y += f.y * d
      selNode.z += f.z * d
    } else {
      // Move in camera-facing XY plane
      const r = worldRight()
      const dn = worldDown()
      const sx = dx * sf
      const sy = dy * sf
      selNode.x += r.x * sx + dn.x * sy
      selNode.y += r.y * sx + dn.y * sy
      selNode.z += r.z * sx + dn.z * sy
    }

    setCoords(
      selNode.id +
      '  x ' + fmt(selNode.x) +
      '  y ' + fmt(selNode.y) +
      '  z ' + fmt(selNode.z)
    )
  }

  if (dragCam) {
    const s = 0.006
    inerY = dx * s
    inerX = dy * s
    tgtRY += inerY
    tgtRX += inerX
    tgtRX = Math.max(-1.3, Math.min(1.3, tgtRX))
  }

  pmx = mouseX; pmy = mouseY
}

function mouseReleased() {
  dragNode = false
  dragCam  = false
  setHint('drag node · shift+drag = z depth\nscroll = zoom · drag bg = orbit')
}

function mouseWheel(e) {
  tgtZoom = constrain(tgtZoom * (e.delta > 0 ? 0.91 : 1.10), 0.25, 5.0)
  return false
}

// ── Keyboard ──────────────────────────────────────────────────────────────────

function keyPressed() {
  if (key === 'r' || key === 'R') resetNodes()
  if (key === 'l' || key === 'L') toggleLabels()
  if (keyCode === ESCAPE) { selNode = null }
}

// ── UI helpers ────────────────────────────────────────────────────────────────

function toggleLabels() {
  showLabels = !showLabels
  document.getElementById('btnL').classList.toggle('active', showLabels)
}

function setHint(t) {
  document.getElementById('hint').innerHTML = t.replace('\n', '<br>')
}

function setCoords(t) {
  document.getElementById('coords').textContent = t
}

function fmt(v) {
  return (v >= 0 ? '+' : '') + Math.round(v)
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight)
}

</script>
</body>
</html>
