<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribbon Geometry</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #07070e; }
canvas { display: block; }
#hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(200, 212, 228, 0.20);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
  transition: opacity 2s ease;
}
</style>
</head>
<body>
<div id="hint">Drag nodes &nbsp;&middot;&nbsp; Orbit &nbsp;&middot;&nbsp; Scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070e);
scene.fog = new THREE.FogExp2(0x07070e, 0.020);

// ── Camera ────────────────────────────────────────────────────────────────────
// Slightly off-axis so the 3D depth is immediately perceptible on load
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 200);
camera.position.set(1.8, 1.2, 13.5);
camera.lookAt(0, 0, 0);

// ── Orbit controls ────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.055;
controls.minDistance     = 4;
controls.maxDistance     = 42;
controls.target.set(0, 0, 0);
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.9;

controls.addEventListener('start', () => {
  controls.autoRotate = false;
  document.getElementById('hint').style.opacity = '0';
});

// ── Lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x0c0d1f, 5));

const key = new THREE.DirectionalLight(0xfff5e8, 3.4);
key.position.set(5, 9, 7);
scene.add(key);

const fill = new THREE.DirectionalLight(0x1a2baa, 1.1);
fill.position.set(-7, -3, -5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x5566aa, 1.0);
rim.position.set(1, -8, -4);
scene.add(rim);

// Warm point light at the welded center — adds drama to the junction
const centerPt = new THREE.PointLight(0xffeedd, 2.8, 7.0, 2.0);
centerPt.position.set(0, 0, 0);
scene.add(centerPt);

// ── Geometry parameters ───────────────────────────────────────────────────────
const SEG_L  = 26;    // length segments
const SEG_W  = 14;    // width segments (higher = smoother wide plane)
const HALF_W = 1.80;  // ribbon half-width → 3.6 total (wide architectural plane)
const TWIST  = 0.22;  // radians of twist over full ribbon length

// Shared temp vectors (safe in single-threaded JS)
const _ld = new THREE.Vector3();
const _wa = new THREE.Vector3();
const _kw = new THREE.Vector3();
const Z_AX = new THREE.Vector3(0, 0, 1);
const Y_AX = new THREE.Vector3(0, 1, 0);

// ── Asymmetric 4-direction node positions ─────────────────────────────────────
// Pinwheel Z topology: N/W toward viewer (+Z), S/E away (−Z)
// This creates the "impossible geometry" contradiction when orbited
const nodePos = {
  N: new THREE.Vector3( 0.0,  4.1,  1.30),
  S: new THREE.Vector3( 0.0, -4.1, -1.30),
  E: new THREE.Vector3( 4.1,  0.0, -1.10),
  W: new THREE.Vector3(-4.1,  0.0,  1.10),
};

// ── Ribbon BufferGeometry factory ─────────────────────────────────────────────
function makeRibbonGeo() {
  const nv  = (SEG_L + 1) * (SEG_W + 1);
  const pos = new Float32Array(nv * 3);
  const uvs = new Float32Array(nv * 2);

  for (let i = 0; i <= SEG_L; i++) {
    for (let j = 0; j <= SEG_W; j++) {
      const id      = i * (SEG_W + 1) + j;
      uvs[id * 2]   = i / SEG_L;
      uvs[id * 2+1] = j / SEG_W;
    }
  }

  const idx = [];
  for (let i = 0; i < SEG_L; i++) {
    for (let j = 0; j < SEG_W; j++) {
      const a = i       * (SEG_W + 1) + j;
      const b = a + 1;
      const c = (i + 1) * (SEG_W + 1) + j;
      const d = c + 1;
      idx.push(a, c, b,  b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  return geo;
}

// ── Ribbon vertex update ───────────────────────────────────────────────────────
// Computes positions from center (0,0,0) to endpoint ep.
// Width = cross(lenDir, Z) → stable, appears flat from front (+Z) camera.
// Rodrigues twist rotates the width vector along the ribbon length.
// All i=0 vertices converge near origin, welding all ribbons at center.
function updateRibbon(geo, ep) {
  const pa  = geo.attributes.position.array;
  const len = ep.length();
  if (len < 1e-3) return;

  _ld.copy(ep).divideScalar(len);

  _wa.crossVectors(_ld, Z_AX);
  if (_wa.lengthSq() < 1e-4) _wa.crossVectors(_ld, Y_AX);
  _wa.normalize();
  _kw.crossVectors(_ld, _wa);  // for Rodrigues, kDotW = 0 since w ⊥ k

  for (let i = 0; i <= SEG_L; i++) {
    const t  = i / SEG_L;
    const cx = ep.x * t;
    const cy = ep.y * t;
    const cz = ep.z * t;

    const cosA = Math.cos(TWIST * t);
    const sinA = Math.sin(TWIST * t);
    const wx = _wa.x * cosA + _kw.x * sinA;
    const wy = _wa.y * cosA + _kw.y * sinA;
    const wz = _wa.z * cosA + _kw.z * sinA;

    for (let j = 0; j <= SEG_W; j++) {
      const s  = (j / SEG_W - 0.5) * 2;        // −1 to +1 across width
      const hw = HALF_W * (1 - 0.08 * t * t);   // very gentle taper at tip
      const id = (i * (SEG_W + 1) + j) * 3;
      pa[id]     = cx + wx * s * hw;
      pa[id + 1] = cy + wy * s * hw;
      pa[id + 2] = cz + wz * s * hw;
    }
  }

  geo.attributes.position.needsUpdate = true;
  geo.computeVertexNormals();
}

// ── Surface materials ─────────────────────────────────────────────────────────
const matNS = new THREE.MeshStandardMaterial({
  color: 0xddd5c3, roughness: 0.19, metalness: 0.64, side: THREE.DoubleSide,
});
const matEW = new THREE.MeshStandardMaterial({
  color: 0xc3ccd8, roughness: 0.16, metalness: 0.70, side: THREE.DoubleSide,
});

// Wireframe overlay — shares the ribbon geometry reference so it auto-updates
// Draws the structural grid lines, reinforcing the "architectural plane" reading
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x2a3550,
  wireframe: true,
  transparent: true,
  opacity: 0.12,
  depthWrite: false,
});

// ── Ribbon meshes + wireframe overlays ───────────────────────────────────────
const ribbons = {};
const DIRS    = ['N', 'S', 'E', 'W'];

for (const dir of DIRS) {
  const geo  = makeRibbonGeo();
  updateRibbon(geo, nodePos[dir]);

  const mat  = (dir === 'N' || dir === 'S') ? matNS : matEW;
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  ribbons[dir] = mesh;

  // Wireframe shares same geometry — no extra update needed on drag
  scene.add(new THREE.Mesh(geo, wireMat));
}

// ── Center weld marker ────────────────────────────────────────────────────────
scene.add(new THREE.Mesh(
  new THREE.OctahedronGeometry(0.22, 2),
  new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0x667799, roughness: 0.03, metalness: 1.0,
  })
));

// ── Direction label sprites ───────────────────────────────────────────────────
// Canvas-texture sprites for N / E / S / W, positioned at each node
function makeLabel(text) {
  const cvs = document.createElement('canvas');
  cvs.width = 96; cvs.height = 96;
  const cx = cvs.getContext('2d');
  cx.font = 'bold 52px "Helvetica Neue", Helvetica, sans-serif';
  cx.fillStyle = 'rgba(220, 228, 242, 0.72)';
  cx.textAlign    = 'center';
  cx.textBaseline = 'middle';
  cx.fillText(text, 48, 50);
  const tex = new THREE.CanvasTexture(cvs);
  const spr = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  spr.scale.set(0.55, 0.55, 1);
  return spr;
}

// Label offset: push the label outward along the primary arm direction
const LABEL_OUT = { N: [0, 0.62, 0], S: [0, -0.62, 0], E: [0.62, 0, 0], W: [-0.62, 0, 0] };
const labels = {};

for (const dir of DIRS) {
  const lbl = makeLabel(dir);
  const [ox, oy, oz] = LABEL_OUT[dir];
  lbl.position.copy(nodePos[dir]).add(new THREE.Vector3(ox, oy, oz));
  scene.add(lbl);
  labels[dir] = lbl;
}

// ── Node handle spheres ───────────────────────────────────────────────────────
const sphereGeo = new THREE.SphereGeometry(0.24, 32, 24);
const nodes     = {};

for (const dir of DIRS) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: new THREE.Color(0x0f1e30),
    roughness: 0.07, metalness: 0.95,
  });
  const m = new THREE.Mesh(sphereGeo, mat);
  m.position.copy(nodePos[dir]);
  m.userData.dir = dir;
  scene.add(m);
  nodes[dir] = m;
}

// ── Drag / hover ──────────────────────────────────────────────────────────────
const rc        = new THREE.Raycaster();
const m2        = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const iPt       = new THREE.Vector3();
const camDir    = new THREE.Vector3();
const _lo       = new THREE.Vector3();

let activeDir  = null;
let hoveredDir = null;

const nodeList = () => Object.values(nodes);

function setEm(dir, hex) { nodes[dir].material.emissive.setHex(hex); }

function updateLabelPos(dir, pos) {
  const [ox, oy, oz] = LABEL_OUT[dir];
  labels[dir].position.copy(pos).add(_lo.set(ox, oy, oz));
}

renderer.domElement.addEventListener('pointermove', e => {
  m2.set(
    (e.clientX / innerWidth)  *  2 - 1,
    (e.clientY / innerHeight) * -2 + 1
  );
  rc.setFromCamera(m2, camera);

  if (activeDir) {
    if (rc.ray.intersectPlane(dragPlane, iPt)) {
      if (iPt.length() < 1.5) iPt.normalize().multiplyScalar(1.5);
      nodePos[activeDir].copy(iPt);
      nodes[activeDir].position.copy(iPt);
      updateLabelPos(activeDir, iPt);
      updateRibbon(ribbons[activeDir].geometry, iPt);
    }
    return;
  }

  const hits   = rc.intersectObjects(nodeList());
  const nowDir = hits.length ? hits[0].object.userData.dir : null;
  if (nowDir !== hoveredDir) {
    if (hoveredDir) setEm(hoveredDir, 0x0f1e30);
    hoveredDir = nowDir;
    if (hoveredDir) setEm(hoveredDir, 0x4488cc);
    renderer.domElement.style.cursor = hoveredDir ? 'grab' : '';
  }
});

renderer.domElement.addEventListener('pointerdown', e => {
  m2.set(
    (e.clientX / innerWidth)  *  2 - 1,
    (e.clientY / innerHeight) * -2 + 1
  );
  rc.setFromCamera(m2, camera);
  const hits = rc.intersectObjects(nodeList());
  if (!hits.length) return;

  activeDir = hits[0].object.userData.dir;
  setEm(activeDir, 0x66aaff);
  controls.enabled    = false;
  controls.autoRotate = false;
  renderer.domElement.style.cursor = 'grabbing';

  camera.getWorldDirection(camDir);
  dragPlane.setFromNormalAndCoplanarPoint(camDir, nodePos[activeDir]);
  renderer.domElement.setPointerCapture(e.pointerId);
  e.preventDefault();
});

renderer.domElement.addEventListener('pointerup', () => {
  if (activeDir) {
    setEm(activeDir, hoveredDir === activeDir ? 0x4488cc : 0x0f1e30);
    activeDir = null;
  }
  controls.enabled = true;
  renderer.domElement.style.cursor = hoveredDir ? 'grab' : '';
});

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Render loop ───────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
