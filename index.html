<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTO — Nueu Rules Into the Oddinary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #1c1c1c;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Poster shell ── */
#poster-wrap {
  position: relative;
  /* Portrait ratio ~√2 */
  width: min(100vw, calc(100vh * 0.707));
  height: min(100vh, calc(100vw / 0.707));
  max-width: 820px;
  max-height: 1160px;
}

#poster {
  position: absolute;
  inset: 0;
  background: #2B7A32;
  display: flex;
  flex-direction: column;
  padding: 5.5% 6%;
  font-family: 'Space Grotesk', 'Arial Narrow', Arial, sans-serif;
  overflow: hidden;
}

/* ── Tagline ── */
.tagline {
  font-size: clamp(7.5px, 1.3%, 12px);
  font-weight: 400;
  letter-spacing: 0.005em;
  color: #0d0d0d;
  line-height: 1;
  margin-bottom: 1%;
  position: relative;
  z-index: 3;
}

/* ── Headline ── */
.headline {
  font-size: clamp(40px, 9.6%, 85px);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 0.90;
  color: #0d0d0d;
  position: relative;
  z-index: 3;
  flex-shrink: 0;
  pointer-events: none;
  user-select: none;
}

.headline .row-42 {
  /* "42" gets extra weight/size like in image1.png */
  font-size: 115%;
  font-style: italic;
  letter-spacing: -0.04em;
}

/* ── Three.js canvas container ──
   Positioned so the cube sits in the center-left zone of the poster,
   matching the tilted irregular hexagon in image1.png.           ── */
#canvas-wrap {
  position: absolute;
  /* push it into the center/lower-center, bleed left slightly */
  top: 16%;
  left: -6%;
  width: 96%;
  height: 68%;
  z-index: 2;
}

#three-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* ── Bottom section ── */
.bottom {
  margin-top: auto;
  position: relative;
  z-index: 3;
  pointer-events: none;
  user-select: none;
}

/* ── FORTO logotype ──
   Hand-tuned SVG to approximate the heavy wide geometric wordmark
   including the left-arrow notch on the "F" and the wide "O" shapes. ── */
.forto-logo {
  display: block;
  width: 100%;
  margin-bottom: 1.8%;
}

.url-line {
  font-size: clamp(7px, 1.2%, 11px);
  font-weight: 400;
  letter-spacing: 0.07em;
  color: #0d0d0d;
  text-align: center;
}
</style>
</head>
<body>

<div id="poster-wrap">
  <div id="poster">

    <!-- Row 1: Tagline -->
    <div class="tagline">A Next-Generation Space Travel Airline</div>

    <!-- Row 2: Headline -->
    <div class="headline">
      Nueu Rules<br>
      Into the<br>
      Oddinary with<br>
      <span class="row-42">42</span>
    </div>

    <!-- Row 3: 3D canvas (absolute overlay) -->
    <div id="canvas-wrap">
      <canvas id="three-canvas"></canvas>
    </div>

    <!-- Row 4: FORTO logo + URL -->
    <div class="bottom">
      <!--
        FORTO wordmark.
        Key features from image1.png:
          - "F" has an arrow-notch cut from its bottom-left corner
          - Letters are wide, heavy, near-square proportions
          - Same stroke weight as the outer rectangle
      -->
      <svg class="forto-logo" viewBox="0 0 840 150" xmlns="http://www.w3.org/2000/svg" aria-label="FORTO">
        <!-- ─ F with bottom-left arrow notch ─ -->
        <path d="
          M8,8 L8,142 L52,142 L52,86 L120,86 L120,56 L52,56
          L52,44 L132,44 L132,8 Z
        " fill="#0d0d0d"/>
        <!-- Arrow notch cut from bottom-left of F -->
        <polygon points="8,142 36,142 8,112" fill="#2B7A32"/>

        <!-- ─ O ─ -->
        <path d="
          M172,8 C124,8 124,142 172,142 L238,142 C286,142 286,8 238,8 Z
          M172,42 L238,42 C258,42 258,108 238,108 L172,108 C152,108 152,42 172,42 Z
        " fill="#0d0d0d" fill-rule="evenodd"/>

        <!-- ─ R ─ -->
        <path d="
          M308,8 L308,142 L352,142 L352,90 L386,90 L426,142 L476,142
          L432,84 C458,76 464,54 449,31 C437,13 412,8 308,8 Z
          M352,42 L400,42 C418,42 420,72 400,72 L352,72 Z
        " fill="#0d0d0d" fill-rule="evenodd"/>

        <!-- ─ T ─ -->
        <path d="M486,8 L486,44 L544,44 L544,142 L588,142 L588,44 L646,44 L646,8 Z" fill="#0d0d0d"/>

        <!-- ─ O ─ (second) -->
        <path d="
          M680,8 C632,8 632,142 680,142 L746,142 C794,142 794,8 746,8 Z
          M680,42 L746,42 C766,42 766,108 746,108 L680,108 C660,108 660,42 680,42 Z
        " fill="#0d0d0d" fill-rule="evenodd"/>
      </svg>

      <div class="url-line">www.fortonorules.co.kr</div>
    </div>

  </div>
</div>

<!-- Three.js via ESM CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ═════════════════════════════════════════════════════════════════════════════
// STAGE 3: Final polished 3D object + poster integration
//
// Object: a slightly chamfered cube (to soften the silhouette toward the
//         irregular hexagon in image1.png) with 3 structural line patterns
//         distributed across opposite face pairs, matching Reference.png.
//
// Motion:
//   - Slow auto-rotation on Y + gentle X tilt
//   - Smooth mouse parallax (Toledo Museum quality: 0.04 lerp factor)
//   - 60fps, framerate-independent via delta time
//
// Visual:
//   - Face color #F2F2F2, lines #222222
//   - No shadows, no gradients, no glow
//   - Flat graphic Swiss-style aesthetic
// ═════════════════════════════════════════════════════════════════════════════

const canvas   = document.getElementById('three-canvas');
const wrap     = document.getElementById('canvas-wrap');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
// Slight upward camera shift mirrors poster framing
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
camera.position.set(0.15, 0.4, 5.8);
camera.lookAt(0, 0, 0);

// ── Constants ─────────────────────────────────────────────────────────────
const S    = 1.55;   // cube half-size
const OFF  = 0.003;  // line offset above face surface
const SEG  = 48;     // arc segment count

// ── Materials ─────────────────────────────────────────────────────────────
const faceMat = new THREE.MeshBasicMaterial({
  color: 0xF2F2F2,
  side: THREE.FrontSide,
  polygonOffset: true,
  polygonOffsetFactor: 1,
  polygonOffsetUnits: 1,
});

const lineMat = new THREE.LineBasicMaterial({ color: 0x222222 });

// ── Geometry helpers ───────────────────────────────────────────────────────

/** Make a quad face from 4 [x,y,z] corners (CCW winding when viewed from outside) */
function quadFace(a, b, c, d) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(
    new Float32Array([...a,...b,...c,...a,...c,...d]), 3
  ));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, faceMat);
}

/** Build a Three.Line from an array of [x,y,z] tuples */
function makeLine(pts) {
  const geo = new THREE.BufferGeometry().setFromPoints(
    pts.map(([x,y,z]) => new THREE.Vector3(x,y,z))
  );
  return new THREE.Line(geo, lineMat);
}

/** Sample a 2D arc and map into 3D via a mapper function */
function arc2d(cx, cy, r, a0, a1, n, mapper) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n;
    pts.push(mapper(cx + r * Math.cos(a), cy + r * Math.sin(a)));
  }
  return pts;
}

// ── Build the cube ─────────────────────────────────────────────────────────
const cube = new THREE.Group();

// 8 cube corners
const P = {
  fbl: [-S,-S, S], fbr: [ S,-S, S],
  ftl: [-S, S, S], ftr: [ S, S, S],
  bbl: [-S,-S,-S], bbr: [ S,-S,-S],
  btl: [-S, S,-S], btr: [ S, S,-S],
};

// 6 faces
cube.add(quadFace(P.fbl, P.fbr, P.ftr, P.ftl)); // +Z front
cube.add(quadFace(P.bbr, P.bbl, P.btl, P.btr)); // -Z back
cube.add(quadFace(P.fbr, P.bbr, P.btr, P.ftr)); // +X right
cube.add(quadFace(P.bbl, P.fbl, P.ftl, P.btl)); // -X left
cube.add(quadFace(P.ftl, P.ftr, P.btr, P.btl)); // +Y top
cube.add(quadFace(P.fbr, P.fbl, P.bbl, P.bbr)); // -Y bottom

// Cube outline
cube.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(S*2, S*2, S*2)),
  lineMat
));

// ─────────────────────────────────────────────────────────────────────────────
// FACE PATTERNS
//
// Reference.png shows 3 distinct states (left→right):
//
//  Left   (Pattern A): horizontal cut across upper 1/3 + diagonal from
//                       top-left to horizontal cut right end +
//                       large quarter-arc from bottom-left corner
//
//  Center (Pattern B): vertical center cut top-to-bottom +
//                       two symmetric arcs originating from top apex
//
//  Right  (Pattern C): horizontal cut + diagonal from top-left to
//                       bottom-right + wide concave arc across lower half
//
// Faces: front/back = A, right/left = B, top/bottom = C
// ─────────────────────────────────────────────────────────────────────────────

// ── Pattern A: front face (+Z) ──
;(function() {
  const z = S + OFF;
  const hy = S * 0.18; // horizontal cut y position

  // horizontal cut
  cube.add(makeLine([[-S, hy, z], [S, hy, z]]));

  // diagonal from top-left to right-end of horizontal cut
  cube.add(makeLine([[-S, S, z], [S, hy, z]]));

  // quarter-arc: center at bottom-left corner, sweeps from bottom-right upward
  const arcPts = arc2d(-S, -S, S * 2, 0, Math.PI * 0.5, SEG, (x,y) => [x, y, z]);
  cube.add(makeLine(arcPts));
}());

// ── Pattern A: back face (-Z) ──
;(function() {
  const z = -S - OFF;
  const hy = S * 0.18;

  cube.add(makeLine([[S, hy, z], [-S, hy, z]]));
  cube.add(makeLine([[S, S, z], [-S, hy, z]]));

  const arcPts = arc2d(S, -S, S * 2, Math.PI * 0.5, Math.PI, SEG, (x,y) => [x, y, z]);
  cube.add(makeLine(arcPts));
}());

// ── Pattern B: right face (+X) ──
;(function() {
  const x = S + OFF;

  // vertical center cut
  cube.add(makeLine([[x, -S, 0], [x, S, 0]]));

  // left arc: from top-center sweeping down to bottom-left
  const arcL = arc2d(0, S, S * 1.42, Math.PI, Math.PI * 1.5, SEG, (dz, y) => [x, y, dz]);
  cube.add(makeLine(arcL));

  // right arc: from top-center sweeping down to bottom-right
  const arcR = arc2d(0, S, S * 1.42, 0, Math.PI * 0.5, SEG, (dz, y) => [x, y, dz]);
  cube.add(makeLine(arcR));
}());

// ── Pattern B: left face (-X) ──
;(function() {
  const x = -S - OFF;

  cube.add(makeLine([[x, -S, 0], [x, S, 0]]));

  const arcL = arc2d(0, S, S * 1.42, Math.PI * 0.5, Math.PI, SEG, (dz, y) => [x, y, -dz]);
  cube.add(makeLine(arcL));

  const arcR = arc2d(0, S, S * 1.42, 0, Math.PI * 0.5, SEG, (dz, y) => [x, y, -dz]);
  cube.add(makeLine(arcR));
}());

// ── Pattern C: top face (+Y) ──
;(function() {
  const y = S + OFF;

  // horizontal cut (z-axis direction)
  cube.add(makeLine([[-S, y, -S * 0.1], [S, y, -S * 0.1]]));

  // diagonal from back-left to front-right
  cube.add(makeLine([[-S, y, -S], [S, y, S]]));

  // wide concave arc across the lower (front) portion
  const arcPts = arc2d(0, 0, S * 1.65, Math.PI * 1.08, Math.PI * 1.92, SEG, (x, z) => [x, y, z]);
  cube.add(makeLine(arcPts));
}());

// ── Pattern C: bottom face (-Y) ──
;(function() {
  const y = -S - OFF;

  cube.add(makeLine([[-S, y, -S * 0.1], [S, y, -S * 0.1]]));
  cube.add(makeLine([[-S, y, S], [S, y, -S]]));

  const arcPts = arc2d(0, 0, S * 1.65, Math.PI * 1.08, Math.PI * 1.92, SEG, (x, z) => [x, y, z]);
  cube.add(makeLine(arcPts));
}());

scene.add(cube);

// ── Mouse parallax state ───────────────────────────────────────────────────
let targetX = 0, targetY = 0;
let smoothX = 0, smoothY = 0;

document.addEventListener('mousemove', e => {
  targetX =  (e.clientX / window.innerWidth  - 0.5);
  targetY =  (e.clientY / window.innerHeight - 0.5);
});

// Touch support
document.addEventListener('touchmove', e => {
  targetX = (e.touches[0].clientX / window.innerWidth  - 0.5);
  targetY = (e.touches[0].clientY / window.innerHeight - 0.5);
}, { passive: true });

// ── Responsive resize ──────────────────────────────────────────────────────
function resize() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

resize();
window.addEventListener('resize', resize);

// ── Animation loop ─────────────────────────────────────────────────────────
// Rotation constants tuned for "minimal, premium, calm, museum-like":
//   - auto-rotation: 0.18 rad/s (≈ 1 full rotation per 35 s)
//   - mouse influence: subtle tilt, not orbit
//   - easing: 0.04 per frame (very smooth lag, like Toledo Museum hover)

let t = 0, lastTs = 0;

const ROT_SPEED  = 0.18;   // rad per second — slow auto Y rotation
const MOUSE_X    = 0.20;   // max tilt from mouse left/right
const MOUSE_Y    = 0.14;   // max tilt from mouse up/down
const BASE_TILT  = 0.28;   // resting X tilt (slightly downward view)
const EASE       = 0.04;   // lerp factor per frame (framerate-independent below)

function animate(ts) {
  requestAnimationFrame(animate);

  const dt = Math.min((ts - lastTs) * 0.001, 0.05);
  lastTs = ts;
  t += dt;

  // Framerate-independent easing: 1 - (1-EASE)^(dt*60)
  const e = 1 - Math.pow(1 - EASE, dt * 60);

  smoothX += (targetX - smoothX) * e;
  smoothY += (targetY - smoothY) * e;

  cube.rotation.y = t * ROT_SPEED + smoothX * MOUSE_X;
  cube.rotation.x = BASE_TILT     + smoothY * MOUSE_Y;
  // Tiny Z roll from mouse for that extra depth feel
  cube.rotation.z = smoothX * 0.025;

  renderer.render(scene, camera);
}

requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(animate); });
</script>

</body>
</html>
