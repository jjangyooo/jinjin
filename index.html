<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compass Spatial System</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white;
      font-family: sans-serif;
    }

    canvas {
      display: block;
    }

    .ui {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    button {
      border: 1px solid black;
      background: white;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
    }

    button.active {
      background: black;
      color: white;
    }
  </style>
</head>
<body>

<div class="ui">
  <button onclick="setMode('flat')" class="active">FLAT</button>
  <button onclick="setMode('depth')">DEPTH</button>
  <button onclick="setMode('orbit')">ORBIT</button>
  <button onclick="setMode('constellation')">CONSTELLATION</button>
  <button onclick="setMode('collapse')">COLLAPSE</button>
</div>

<script>

let mode = "flat"

const radius = 180
const nodes = []
const edges = []

const labels = [
  "N","NE","E","SE","S","SW","W","NW"
]

function setMode(nextMode) {
  mode = nextMode

  document.querySelectorAll("button").forEach(btn => {
    btn.classList.remove("active")
  })

  event.target.classList.add("active")
}

class Node {
  constructor(label, angle, distance) {
    this.label = label

    this.base = createVector(
      cos(angle) * distance,
      sin(angle) * distance,
      0
    )

    this.pos = this.base.copy()
    this.vel = createVector()
  }

  update(t) {

    let target = this.base.copy()

    if (mode === "flat") {
      target.z = sin(t * 1.2 + this.base.x * 0.01) * 5
    }

    if (mode === "depth") {
      target.z =
        sin(t + this.base.x * 0.01) * 120 +
        cos(t * 1.3 + this.base.y * 0.01) * 80
    }

    if (mode === "orbit") {

      const a = t * 0.5 + this.base.heading()

      target.x = cos(a) * radius
      target.y = sin(a) * radius

      target.z =
        sin(t + this.base.x * 0.01) * 100
    }

    if (mode === "constellation") {

      target.x += sin(t + this.base.x) * 80
      target.y += cos(t * 1.3 + this.base.y) * 80
      target.z += sin(t * 0.7 + this.base.x) * 200
    }

    if (mode === "collapse") {

      const collapse =
        map(sin(t * 0.7), -1, 1, 0.2, 1.5)

      target.mult(collapse)

      target.z =
        sin(t * 2 + this.base.x * 0.02) * 200
    }

    const mx = mouseX - width/2
    const my = mouseY - height/2

    const mouse = createVector(mx, my)

    const distToMouse =
      dist(target.x, target.y, mouse.x, mouse.y)

    if (distToMouse < 220) {

      const pull =
        p5.Vector.sub(mouse, target)
          .setMag((220 - distToMouse) * 0.03)

      target.add(pull)
    }

    const spring = 0.08
    const damping = 0.82

    const force =
      p5.Vector.sub(target, this.pos)
        .mult(spring)

    this.vel.add(force)
    this.vel.mult(damping)

    this.pos.add(this.vel)
  }

  draw() {

    const perspective =
      map(this.pos.z, -300, 300, 0.7, 1.4)

    const x = this.pos.x * perspective
    const y = this.pos.y * perspective

    noStroke()
    fill(0)

    circle(x, y, 8 * perspective)

    textSize(12)
    textAlign(CENTER, CENTER)
    text(this.label, x, y - 18)
  }
}

function setup() {

  createCanvas(windowWidth, windowHeight)

  angleMode(RADIANS)

  const angles = [
    -HALF_PI,
    -QUARTER_PI,
    0,
    QUARTER_PI,
    HALF_PI,
    PI - QUARTER_PI,
    PI,
    PI + QUARTER_PI
  ]

  for (let i = 0; i < labels.length; i++) {
    nodes.push(
      new Node(labels[i], angles[i], radius)
    )
  }

  edges.push([0,2])
  edges.push([2,4])
  edges.push([4,6])
  edges.push([6,0])

  edges.push([0,4])
  edges.push([2,6])

  edges.push([1,5])
  edges.push([3,7])

  edges.push([0,1])
  edges.push([1,2])
  edges.push([2,3])
  edges.push([3,4])
  edges.push([4,5])
  edges.push([5,6])
  edges.push([6,7])
  edges.push([7,0])
}

function draw() {

  background(255)

  translate(width/2, height/2)

  const t = millis() * 0.001

  rotateX(
    map(mouseY, 0, height, -0.05, 0.05)
  )

  rotateY(
    map(mouseX, 0, width, -0.05, 0.05)
  )

  for (let n of nodes) {
    n.update(t)
  }

  stroke(0)
  strokeWeight(1)
  noFill()

  for (let e of edges) {

    const a = nodes[e[0]]
    const b = nodes[e[1]]

    const pa =
      project(a.pos)

    const pb =
      project(b.pos)

    line(pa.x, pa.y, pb.x, pb.y)
  }

  for (let n of nodes) {
    n.draw()
  }
}

function project(v) {

  const perspective =
    map(v.z, -300, 300, 0.7, 1.4)

  return {
    x: v.x * perspective,
    y: v.y * perspective
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight)
}

</script>
</body>
</html>
