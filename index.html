<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTO — Nueu Rules Into the Oddinary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
}

#poster-wrap {
  position: relative;
  width: min(100vw, calc(100vh * 0.707));
  height: min(100vh, calc(100vw / 0.707));
  max-width: 860px;
  max-height: 1215px;
}

#poster {
  position: absolute;
  inset: 0;
  background: #2B7A32;
  display: flex;
  flex-direction: column;
  padding: 5.5% 6.5%;
  font-family: 'Space Grotesk', Arial, sans-serif;
  overflow: hidden;
}

.tagline {
  font-size: clamp(8px, 1.35%, 13px);
  font-weight: 400;
  letter-spacing: 0.01em;
  color: #111;
  line-height: 1;
  margin-bottom: 0.8%;
}

.headline {
  font-size: clamp(44px, 10.2%, 90px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.91;
  color: #111;
  position: relative;
  z-index: 2;
  flex-shrink: 0;
  pointer-events: none;
  user-select: none;
}

.headline .num {
  font-style: italic;
  font-size: 108%;
}

/* Three.js canvas overlays the center of the poster */
#canvas-wrap {
  position: absolute;
  top: 14%;
  left: -12%;
  width: 100%;
  height: 66%;
  z-index: 1;
  pointer-events: none;
}

#three-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.bottom {
  margin-top: auto;
  position: relative;
  z-index: 2;
  pointer-events: none;
  user-select: none;
}

.forto-logo {
  display: block;
  width: 100%;
  margin-bottom: 2%;
}

.url-line {
  font-size: clamp(7px, 1.25%, 11px);
  font-weight: 400;
  letter-spacing: 0.06em;
  color: #111;
  text-align: center;
}
</style>
</head>
<body>

<div id="poster-wrap">
  <div id="poster">

    <div class="tagline">A Next-Generation Space Travel Airline</div>

    <div class="headline">
      Nueu Rules<br>
      Into the<br>
      Oddinary with<br>
      <span class="num">42</span>
    </div>

    <div id="canvas-wrap">
      <canvas id="three-canvas"></canvas>
    </div>

    <div class="bottom">
      <!--
        FORTO logo — custom geometric letterforms reproduced as SVG paths.
        The "F" has an arrow notch; letters are wide and heavy.
      -->
      <svg class="forto-logo" viewBox="0 0 820 148" xmlns="http://www.w3.org/2000/svg" aria-label="FORTO">
        <!-- Arrow-F: normal F with bottom-left arrow cutout -->
        <path d="
          M10,8 L10,140 L52,140 L52,84 L116,84 L116,54 L52,54 L52,42 L128,42 L128,8 Z
          M10,140 L10,108 L34,108 L10,140 Z
        " fill="#111" fill-rule="evenodd"/>
        <!-- O -->
        <path d="
          M178,8 C136,8 136,140 178,140 L232,140 C274,140 274,8 232,8 Z
          M178,38 L232,38 C250,38 250,110 232,110 L178,110 C160,110 160,38 178,38 Z
        " fill="#111" fill-rule="evenodd"/>
        <!-- R -->
        <path d="
          M300,8 L300,140 L342,140 L342,88 L374,88 L413,140 L462,140 L419,82
          C443,74 450,53 436,31 C425,14 402,8 300,8 Z
          M342,38 L386,38 C402,38 404,68 386,68 L342,68 Z
        " fill="#111" fill-rule="evenodd"/>
        <!-- T (with no serifs, wide crossbar) -->
        <path d="M474,8 L474,42 L528,42 L528,140 L570,140 L570,42 L624,42 L624,8 Z" fill="#111"/>
        <!-- O2 (mirrored from first O) -->
        <path d="
          M668,8 C626,8 626,140 668,140 L722,140 C764,140 764,8 722,8 Z
          M668,38 L722,38 C740,38 740,110 722,110 L668,110 C650,110 650,38 668,38 Z
        " fill="#111" fill-rule="evenodd"/>
      </svg>
      <div class="url-line">www.fortonorules.co.kr</div>
    </div>

  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────────────────────────────────────
// STAGE 2: Full 3D cube geometry with per-face subdivision line patterns
//
// The cube has 6 faces. Each face gets one of 3 line patterns from Reference.png:
//
//   Pattern A (face +Z, -Z):  horizontal cut + quarter-arc from top-right corner
//   Pattern B (face +X, -X):  vertical center cut + two arcs from top apex
//   Pattern C (face +Y, -Y):  horizontal cut + diagonal + concave arc
//
// Lines are drawn as 3D geometry (LineMesh) sitting just above each face surface
// so they read as structural cuts, not texture overlays.
// ─────────────────────────────────────────────────────────────────────────────

const canvas   = document.getElementById('three-canvas');
const wrap     = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(0, 0.3, 5.5);

// ── Helpers ──────────────────────────────────────────────────────────────────

function resize() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// ── Materials ────────────────────────────────────────────────────────────────

const faceMat = new THREE.MeshBasicMaterial({ color: 0xF2F2F2, side: THREE.FrontSide });
const lineMat = new THREE.LineBasicMaterial({ color: 0x222222, linewidth: 2 });

// ── Cube geometry ─────────────────────────────────────────────────────────────

const S = 1.6; // half-size

// Build a cube as 6 individual face meshes so we can attach lines per face
const cube = new THREE.Group();

// face helpers
function makeFace(verts) {
  // verts: array of [x,y,z] in order forming a quad (two triangles)
  const geo = new THREE.BufferGeometry();
  const v = new Float32Array(verts.flat());
  geo.setAttribute('position', new THREE.BufferAttribute(v, 3));
  geo.setIndex([0,1,2, 0,2,3]);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, faceMat);
}

// 6 faces of the cube — consistent winding for front-face culling
const faces = {
  // +Z
  front: makeFace([[-S,-S,S],[S,-S,S],[S,S,S],[-S,S,S]]),
  // -Z
  back:  makeFace([[S,-S,-S],[-S,-S,-S],[-S,S,-S],[S,S,-S]]),
  // +X
  right: makeFace([[S,-S,S],[S,-S,-S],[S,S,-S],[S,S,S]]),
  // -X
  left:  makeFace([[-S,-S,-S],[-S,-S,S],[-S,S,S],[-S,S,-S]]),
  // +Y
  top:   makeFace([[-S,S,S],[S,S,S],[S,S,-S],[-S,S,-S]]),
  // -Y
  bottom:makeFace([[S,-S,S],[-S,-S,S],[-S,-S,-S],[S,-S,-S]]),
};

Object.values(faces).forEach(f => cube.add(f));

// ── Per-face subdivision lines ─────────────────────────────────────────────

function lineOnFace(points3D) {
  const geo = new THREE.BufferGeometry().setFromPoints(
    points3D.map(p => new THREE.Vector3(...p))
  );
  return new THREE.Line(geo, lineMat);
}

const OFFSET = 0.002; // lift lines slightly off the face surface

// Arc helper: returns N points of a circle arc in local 2D, then mapped to 3D
function arc2d(cx, cy, r, startAngle, endAngle, segments, mapFn) {
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const a = startAngle + (endAngle - startAngle) * (i / segments);
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    pts.push(mapFn(x, y));
  }
  return pts;
}

// ── Pattern A — front face (+Z): horizontal line + quarter-arc top-right ──
{
  const z = S + OFFSET;
  const lineGroup = new THREE.Group();

  // Horizontal cut at y=0.2*S (upper third)
  lineGroup.add(lineOnFace([[-S, 0.2*S, z],[S, 0.2*S, z]]));

  // Diagonal from top-left to mid-right
  lineGroup.add(lineOnFace([[-S, S, z],[S, 0.2*S, z]]));

  // Quarter-arc from bottom-left corner curving to right-mid
  const arcPts = arc2d(S, -S, 2*S, Math.PI, Math.PI*0.5, 40, (x,y) => [x, y, z]);
  lineGroup.add(lineOnFace(arcPts));

  cube.add(lineGroup);
}

// ── Pattern B — right face (+X): vertical center cut + two arcs from top ──
{
  const x = S + OFFSET;
  const lineGroup = new THREE.Group();

  // Vertical center cut
  lineGroup.add(lineOnFace([[x, -S, 0],[x, S, 0]]));

  // Left arc from top sweeping down-left
  const arcL = arc2d(0, S, S*1.4, Math.PI, Math.PI*1.5, 40, (z, y) => [x, y, -z]);
  lineGroup.add(lineOnFace(arcL));

  // Right arc from top sweeping down-right (mirrored)
  const arcR = arc2d(0, S, S*1.4, 0, Math.PI*0.5, 40, (z, y) => [x, y, z]);
  lineGroup.add(lineOnFace(arcR));

  cube.add(lineGroup);
}

// ── Pattern C — top face (+Y): diagonal + gentle concave arc ──
{
  const y = S + OFFSET;
  const lineGroup = new THREE.Group();

  // Horizontal cut
  lineGroup.add(lineOnFace([[-S, y, -0.1*S],[S, y, -0.1*S]]));

  // Diagonal from top-left to bottom-right
  lineGroup.add(lineOnFace([[-S, y, -S],[S, y, S]]));

  // Concave arc spanning the lower section
  const arcPts = arc2d(0, 0, S*1.6, Math.PI*1.1, Math.PI*1.9, 50, (x, z) => [x, y, z]);
  lineGroup.add(lineOnFace(arcPts));

  cube.add(lineGroup);
}

// ── Pattern A mirrored — back face (-Z) ──
{
  const z = -S - OFFSET;
  const lineGroup = new THREE.Group();
  lineGroup.add(lineOnFace([[S, 0.2*S, z],[-S, 0.2*S, z]]));
  lineGroup.add(lineOnFace([[S, S, z],[-S, 0.2*S, z]]));
  const arcPts = arc2d(-S, -S, 2*S, 0, Math.PI*0.5, 40, (x,y) => [x, y, z]);
  lineGroup.add(lineOnFace(arcPts));
  cube.add(lineGroup);
}

// ── Pattern B mirrored — left face (-X) ──
{
  const x = -S - OFFSET;
  const lineGroup = new THREE.Group();
  lineGroup.add(lineOnFace([[x, -S, 0],[x, S, 0]]));
  const arcL = arc2d(0, S, S*1.4, Math.PI, Math.PI*1.5, 40, (z, y) => [x, y, z]);
  lineGroup.add(lineOnFace(arcL));
  const arcR = arc2d(0, S, S*1.4, 0, Math.PI*0.5, 40, (z, y) => [x, y, -z]);
  lineGroup.add(lineOnFace(arcR));
  cube.add(lineGroup);
}

// ── Pattern C mirrored — bottom face (-Y) ──
{
  const y = -S - OFFSET;
  const lineGroup = new THREE.Group();
  lineGroup.add(lineOnFace([[-S, y, -0.1*S],[S, y, -0.1*S]]));
  lineGroup.add(lineOnFace([[-S, y, S],[S, y, -S]]));
  const arcPts = arc2d(0, 0, S*1.6, Math.PI*1.1, Math.PI*1.9, 50, (x, z) => [x, y, z]);
  lineGroup.add(lineOnFace(arcPts));
  cube.add(lineGroup);
}

// Cube outline edges
const outlineGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(S*2, S*2, S*2));
const outline    = new THREE.LineSegments(outlineGeo, lineMat);
cube.add(outline);

scene.add(cube);

// ── Mouse parallax ────────────────────────────────────────────────────────

let mouseX = 0, mouseY = 0;
let smoothX = 0, smoothY = 0;

document.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth  - 0.5);
  mouseY = (e.clientY / window.innerHeight - 0.5);
});

// ── Animation loop ────────────────────────────────────────────────────────

let t = 0;
let lastTime = 0;

function animate(ts) {
  requestAnimationFrame(animate);

  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  t += dt;

  // Smooth mouse
  smoothX += (mouseX - smoothX) * 0.04;
  smoothY += (mouseY - smoothY) * 0.04;

  // Slow auto-rotation
  cube.rotation.y = t * 0.22 + smoothX * 0.18;
  cube.rotation.x = 0.25    + smoothY * 0.14;

  renderer.render(scene, camera);
}

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(animate); });
</script>

</body>
</html>
