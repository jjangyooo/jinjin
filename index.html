<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTLIGHT — COMA NOVA</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #060608;
  cursor: none;
}

/* imageA.png: fullscreen poster, never altered */
#poster {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
#poster img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* Darkness: covers everything; spotlight hole is punched from imageB's boundary */
#darkness {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

/* Bloom: warm optical glow, screen-blended so it only illuminates darkness */
#bloom {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  mix-blend-mode: screen;
}

/* Film grain */
#grain {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: 0.18;
}

/* Edge vignette */
#vignette {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: radial-gradient(
    ellipse 78% 72% at 50% 50%,
    transparent 32%,
    rgba(4,4,7,0.28) 58%,
    rgba(4,4,7,0.62) 78%,
    rgba(4,4,7,0.92) 100%
  );
}

/* imageB.png: the optical controller — the ONLY moving object */
#controller {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 6;
  pointer-events: none;
  will-change: transform;
}
#controller img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  /* Invert + screen: imageB glows as luminous white over darkness,
     making it visibly the object that controls the light */
  filter: invert(1);
  mix-blend-mode: screen;
  opacity: 0.78;
}

#intro {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #060608;
  pointer-events: none;
  transition: opacity 2.6s cubic-bezier(0.42, 0, 0.18, 1);
}

#hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: rgba(255,255,255,0.10);
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  pointer-events: none;
  transition: opacity 1.8s ease;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="poster">
  <img src="imageA.png" alt="">
</div>

<canvas id="darkness"></canvas>
<canvas id="bloom"></canvas>
<canvas id="grain"></canvas>
<div id="vignette"></div>

<div id="controller">
  <img src="imageB.png" alt="">
</div>

<div id="intro"></div>
<div id="hint">Move cursor &ensp;&middot;&ensp; Scroll to adjust distance</div>

<script>
(function () {
  'use strict';

  const darkCvs  = document.getElementById('darkness');
  const bloomCvs = document.getElementById('bloom');
  const grainCvs = document.getElementById('grain');
  const ctrlEl   = document.getElementById('controller');
  const hintEl   = document.getElementById('hint');
  const introEl  = document.getElementById('intro');

  const dCtx = darkCvs.getContext('2d');
  const bCtx = bloomCvs.getContext('2d');
  const gCtx = grainCvs.getContext('2d');

  // imageB size range (px). Larger = physically closer = tighter spotlight.
  const CTRL_MIN   = 56;
  const CTRL_MAX   = 250;
  // Spotlight radius as fraction of screen diagonal.
  // spotR is always >= ctrlR * 1.5 so projection beyond lens is always visible.
  const SPOT_WIDE  = 0.58;
  const SPOT_TIGHT = 0.13;
  const EASE_POS   = 0.17;
  const EASE_DEPTH = 0.09;

  let W, H, DIAG;
  let tx, ty, tdepth = 0.42;
  let sx, sy, sdepth = 0.42;
  let hintDone = false;
  let fc = 0;

  // ── Film grain tile ───────────────────────────────────────
  const GS    = 256;
  const gTile = document.createElement('canvas');
  gTile.width = gTile.height = GS;
  const gX    = gTile.getContext('2d');
  const gData = gX.createImageData(GS, GS);

  function refreshGrain() {
    const d = gData.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255 | 0;
      d[i]   = Math.min(255, v + 8);
      d[i+1] = v;
      d[i+2] = Math.max(0,   v - 6);
      d[i+3] = 26;
    }
    gX.putImageData(gData, 0, 0);
  }

  function drawGrain() {
    gCtx.clearRect(0, 0, W, H);
    const ox = Math.random() * GS | 0;
    const oy = Math.random() * GS | 0;
    for (let px = -ox; px < W; px += GS)
      for (let py = -oy; py < H; py += GS)
        gCtx.drawImage(gTile, px, py);
  }

  // ── Resize ────────────────────────────────────────────────
  function resize() {
    W    = window.innerWidth;
    H    = window.innerHeight;
    DIAG = Math.hypot(W, H);
    [darkCvs, bloomCvs, grainCvs].forEach(c => {
      c.width  = W;
      c.height = H;
    });
    if (tx === undefined) { tx = sx = W * 0.5; ty = sy = H * 0.5; }
    refreshGrain();
  }
  window.addEventListener('resize', resize);

  // ── Input ─────────────────────────────────────────────────
  document.addEventListener('mousemove', e => {
    tx = e.clientX;
    ty = e.clientY;
    if (!hintDone) { hintEl.style.opacity = '0'; hintDone = true; }
  });

  document.addEventListener('wheel', e => {
    tdepth = Math.max(0, Math.min(1, tdepth + e.deltaY * 0.0008));
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    e.preventDefault();
  }, { passive: false });

  setTimeout(() => { hintEl.style.opacity = '0'; }, 4500);

  setTimeout(() => {
    introEl.style.opacity = '0';
    introEl.addEventListener('transitionend', () => introEl.remove(), { once: true });
  }, 160);

  const lerp = (a, b, t) => a + (b - a) * t;
  const fi   = (f, dt) => 1 - Math.pow(1 - f, dt * 60);

  // ── DARKNESS + SPOTLIGHT ───────────────────────────────────
  // Critical design: the revealed area originates FROM imageB's edge.
  //
  // Step 1 — hard clear circle at exactly ctrlR:
  //   The area directly under imageB is always fully revealed.
  //   This makes imageB feel like an aperture/lens that opens the darkness.
  //
  // Step 2 — gradual projection falloff from ctrlR outward to spotR:
  //   Light "projects" from imageB into the surrounding darkness.
  //   Organic drift on the outer edge makes it feel physical, not digital.
  //
  // When imageB scales up: ctrlR grows → spotR grows proportionally →
  //   the whole system tightens; the causal link is direct and obvious.
  function drawDarkness(x, y, ctrlR, spotR, t) {
    dCtx.clearRect(0, 0, W, H);

    dCtx.globalCompositeOperation = 'source-over';
    dCtx.fillStyle = 'rgba(4,4,7,0.986)';
    dCtx.fillRect(0, 0, W, H);

    dCtx.globalCompositeOperation = 'destination-out';

    // — Step 1: hard clear under imageB (the aperture) —
    dCtx.beginPath();
    dCtx.arc(x, y, ctrlR, 0, Math.PI * 2);
    dCtx.fillStyle = 'rgba(0,0,0,1)';
    dCtx.fill();

    // — Step 2: light projection beyond imageB's perimeter —
    const s       = t * 0.001;
    const breathe = 1 + 0.022 * Math.sin(s * 0.74);

    // Organic drift only on the outer radius — inner stays fixed at imageB edge
    const a1x = Math.sin(s * 0.59) * 5.2 + Math.cos(s * 1.02) * 2.4;
    const a1y = Math.cos(s * 0.51) * 5.8 + Math.sin(s * 0.86) * 2.2;
    const a2x = Math.sin(s * 0.82 + 1.2) * 4.6;
    const a2y = Math.cos(s * 0.66 + 0.7) * 3.8;
    const a3x = Math.cos(s * 0.43 + 0.4) * 3.4;
    const a3y = Math.sin(s * 0.55 + 1.7) * 4.0;

    // Primary: inner fixed at ctrlR, outer drifts organically
    const g1 = dCtx.createRadialGradient(
      x, y, ctrlR,
      x + a1x * 0.08, y + a1y * 0.08, spotR * breathe
    );
    g1.addColorStop(0.00, 'rgba(0,0,0,0.94)');
    g1.addColorStop(0.18, 'rgba(0,0,0,0.72)');
    g1.addColorStop(0.42, 'rgba(0,0,0,0.36)');
    g1.addColorStop(0.68, 'rgba(0,0,0,0.10)');
    g1.addColorStop(0.86, 'rgba(0,0,0,0.02)');
    g1.addColorStop(1.00, 'rgba(0,0,0,0.00)');
    dCtx.fillStyle = g1;
    dCtx.fillRect(0, 0, W, H);

    // Secondary: irregular edge, slightly different drift axis
    const g2 = dCtx.createRadialGradient(
      x, y, ctrlR,
      x + a2x * 0.13, y + a2y * 0.13, spotR * 0.82 * breathe
    );
    g2.addColorStop(0.00, 'rgba(0,0,0,0.38)');
    g2.addColorStop(0.44, 'rgba(0,0,0,0.16)');
    g2.addColorStop(0.78, 'rgba(0,0,0,0.04)');
    g2.addColorStop(1.00, 'rgba(0,0,0,0.00)');
    dCtx.fillStyle = g2;
    dCtx.fillRect(0, 0, W, H);

    // Tertiary: slow breathing, final edge softness
    const g3 = dCtx.createRadialGradient(
      x, y, ctrlR,
      x + a3x * 0.10, y + a3y * 0.10,
      spotR * 0.90 * (1 + 0.015 * Math.cos(s * 0.91))
    );
    g3.addColorStop(0.00, 'rgba(0,0,0,0.18)');
    g3.addColorStop(0.52, 'rgba(0,0,0,0.07)');
    g3.addColorStop(0.88, 'rgba(0,0,0,0.01)');
    g3.addColorStop(1.00, 'rgba(0,0,0,0.00)');
    dCtx.fillStyle = g3;
    dCtx.fillRect(0, 0, W, H);

    // Restore — subtle center restraint so light reads as projected
    dCtx.globalCompositeOperation = 'source-over';
    const gc = dCtx.createRadialGradient(x, y, 0, x, y, ctrlR * 0.75);
    gc.addColorStop(0.0, 'rgba(4,4,7,0.13)');
    gc.addColorStop(1.0, 'rgba(4,4,7,0.00)');
    dCtx.fillStyle = gc;
    dCtx.fillRect(0, 0, W, H);
  }

  // ── BLOOM ─────────────────────────────────────────────────
  // Two zones, both anchored to imageB's perimeter (ctrlR):
  //
  // 1. Rim glow: tight halo exactly at ctrlR — makes the lens/aperture
  //    edge visibly luminous, directly connecting imageB to the light.
  //
  // 2. Projection bloom: warm amber spreading FROM ctrlR outward —
  //    the "spill" of light beyond the aperture into the darkness.
  function drawBloom(x, y, ctrlR, spotR, t) {
    bCtx.clearRect(0, 0, W, H);

    const s       = t * 0.001;
    const breathe = 1 + 0.018 * Math.sin(s * 0.74 + 0.4);
    const flicker = 0.80 + 0.20 * (0.5 + 0.5 * Math.sin(s * 1.16) * Math.cos(s * 0.72));

    // Rim glow: luminous halo at imageB's exact circular boundary
    const rim = bCtx.createRadialGradient(x, y, ctrlR * 0.76, x, y, ctrlR * 1.38);
    rim.addColorStop(0.00, 'rgba(0,0,0,0)');
    rim.addColorStop(0.38, `rgba(255,252,232,${(0.52 * flicker).toFixed(3)})`);
    rim.addColorStop(0.65, `rgba(255,246,218,${(0.32 * flicker).toFixed(3)})`);
    rim.addColorStop(1.00, 'rgba(0,0,0,0)');
    bCtx.fillStyle = rim;
    bCtx.fillRect(0, 0, W, H);

    // Projection bloom: from imageB edge into the dark zone beyond
    const cr = bCtx.createRadialGradient(x, y, ctrlR, x, y, spotR * 1.18 * breathe);
    cr.addColorStop(0.00, `rgba(255,244,212,${(0.46 * flicker).toFixed(3)})`);
    cr.addColorStop(0.18, `rgba(252,240,200,${(0.32 * flicker).toFixed(3)})`);
    cr.addColorStop(0.44, `rgba(244,228,184,${(0.17 * flicker).toFixed(3)})`);
    cr.addColorStop(0.70, `rgba(230,212,166,${(0.07 * flicker).toFixed(3)})`);
    cr.addColorStop(1.00, 'rgba(0,0,0,0)');
    bCtx.fillStyle = cr;
    bCtx.fillRect(0, 0, W, H);

    // Outer ambient: diffuse amber far in the dark zone
    const hl = bCtx.createRadialGradient(x, y, spotR * 0.78 * breathe, x, y, spotR * 1.52 * breathe);
    hl.addColorStop(0.00, 'rgba(0,0,0,0)');
    hl.addColorStop(0.26, `rgba(255,242,210,${(0.18 * flicker).toFixed(3)})`);
    hl.addColorStop(0.58, `rgba(238,220,178,${(0.08 * flicker).toFixed(3)})`);
    hl.addColorStop(1.00, 'rgba(0,0,0,0)');
    bCtx.fillStyle = hl;
    bCtx.fillRect(0, 0, W, H);
  }

  // ── MAIN LOOP ─────────────────────────────────────────────
  let lastTs = 0;

  function tick(ts) {
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    fc++;

    const ep = fi(EASE_POS,   dt);
    const ed = fi(EASE_DEPTH, dt);

    sx     = lerp(sx,     tx,     ep);
    sy     = lerp(sy,     ty,     ep);
    sdepth = lerp(sdepth, tdepth, ed);

    const ctrlSize = lerp(CTRL_MIN, CTRL_MAX, sdepth);
    const ctrlR    = ctrlSize * 0.5;
    // Guarantee spotR always exceeds ctrlR enough to show visible projection
    const spotR    = Math.max(ctrlR * 1.55, DIAG * lerp(SPOT_WIDE, SPOT_TIGHT, sdepth));

    drawDarkness(sx, sy, ctrlR, spotR, ts);
    drawBloom(sx, sy, ctrlR, spotR, ts);

    if (fc % 2 === 0) refreshGrain();
    drawGrain();

    // GPU transform only
    ctrlEl.style.transform = `translate3d(${(sx - ctrlR).toFixed(1)}px,${(sy - ctrlR).toFixed(1)}px,0)`;
    ctrlEl.style.width     = ctrlSize.toFixed(0) + 'px';
    ctrlEl.style.height    = ctrlSize.toFixed(0) + 'px';

    requestAnimationFrame(tick);
  }

  resize();
  requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(tick); });
}());
</script>
</body>
</html>
