<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTLIGHT — Coma Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #040406;
  cursor: none;
}

/* ── POSTER WRAPPER ─────────────────────────────────────
   Sized to match poster.webp aspect ratio (1420 × 2000).
   Position and font-sizes updated by JS on resize.       */
#poster-wrapper,
#hints-wrapper {
  position: fixed;
  /* dimensions set by JS */
}

#poster-wrapper {
  z-index: 1;
}

#poster-wrapper img {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── DARKNESS CANVAS ────────────────────────────────────
   Covers full viewport. Solid black fill + destination-out
   spotlight punched from mouse position.                  */
#mask-canvas {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* ── HINTS WRAPPER ──────────────────────────────────────
   Same position/size as poster-wrapper (set by JS).
   Contains absolutely-positioned .hw spans.
   z-15: above darkness → white text visible in dark,
         white text on cream poster = invisible (natural). */
#hints-wrapper {
  z-index: 15;
  pointer-events: none;
}

.hw {
  position: absolute;
  color: #ffffff;
  opacity: 0;
  white-space: nowrap;
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  line-height: 1;
  /* Hard cut — NO transition */
}

.hw.lit {
  opacity: 1;
}

.hw.body-text {
  font-size: inherit; /* set by JS per row */
  letter-spacing: 0.01em;
}

/* ── ORB CURSOR ─────────────────────────────────────── */
#orb {
  position: fixed;
  top: 0; left: 0;
  z-index: 20;
  border-radius: 50%;
  pointer-events: none;
  will-change: transform;
  background: radial-gradient(circle at 35% 32%,
    #1a1a1a 0%, #080808 42%, #010101 78%, #000 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.02),
    inset 0 1px 3px rgba(255,255,255,0.03);
}

/* ── SCROLL HINT ────────────────────────────────────── */
#scroll-hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 25;
  color: rgba(255,255,255,0.08);
  font-family: Georgia, serif;
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
  transition: opacity 1.6s ease;
}
</style>
</head>
<body>

<!-- LAYER 1: IMAGE_A — actual poster file, untouched -->
<div id="poster-wrapper">
  <img src="poster.webp" alt="SPOTLIGHT — Coma Nova">
</div>

<!-- LAYER 10: Darkness canvas with spotlight -->
<canvas id="mask-canvas"></canvas>

<!-- LAYER 15: Hint signals — white text at IMAGE_A word positions -->
<div id="hints-wrapper"></div>

<div id="orb"></div>
<div id="scroll-hint">Move cursor &ensp;&middot;&ensp; Scroll to focus</div>

<script>
(function () {
'use strict';

// ── Word data ────────────────────────────────────────────────────
// Positions as % of poster image (1420 × 2000 px).
// t = top%, l = left%, fs = font-size as % of wrapper height.
const WORDS = [
  // Header
  { t:  3.5, l: 18.0, fs: 5.8,  text: 'COMA NOVA'  },
  { t:  9.5, l:  3.5, fs: 13.5, text: 'SPOTLIGHT'  },
  { t: 24.8, l: 27.0, fs: 1.5,  text: 'Second Edition Exhibition' },

  // Col 1
  { t: 28.5, l:  5.3, fs: 2.5, text: 'Digital Dark' },
  { t: 31.2, l:  5.3, fs: 2.5, text: 'Patterns'     },
  { t: 34.0, l:  5.3, fs: 2.5, text: 'Silent'        },
  { t: 36.7, l:  5.3, fs: 2.5, text: 'Influence'     },
  { t: 39.4, l:  5.3, fs: 2.5, text: 'Obscured'      },
  { t: 42.1, l:  5.3, fs: 2.5, text: 'Patterns'      },
  { t: 44.8, l:  5.3, fs: 2.5, text: 'Intent'        },
  { t: 47.5, l:  5.3, fs: 2.5, text: 'You'           },
  { t: 50.2, l:  5.3, fs: 2.5, text: 'Think You'     },

  // Col 2
  { t: 28.5, l: 33.5, fs: 2.5, text: 'Behavioral'    },
  { t: 31.2, l: 33.5, fs: 2.5, text: 'Design Sub‑' },
  { t: 34.0, l: 33.5, fs: 2.5, text: 'Conscious'     },
  { t: 36.7, l: 33.5, fs: 2.5, text: 'Perception'    },
  { t: 39.4, l: 33.5, fs: 2.5, text: 'Attention'     },
  { t: 42.1, l: 33.5, fs: 2.5, text: 'Cognition'     },
  { t: 44.8, l: 33.5, fs: 2.5, text: 'Control'       },
  { t: 47.5, l: 33.5, fs: 2.5, text: 'Framework'     },
  { t: 50.2, l: 33.5, fs: 2.5, text: 'To Show'       },
  { t: 52.9, l: 33.5, fs: 2.5, text: 'Is To Hide'    },
  { t: 55.6, l: 33.5, fs: 2.5, text: 'Half Seen,'    },

  // Col 3
  { t: 28.5, l: 61.6, fs: 2.5, text: 'Interface'     },
  { t: 31.2, l: 61.6, fs: 2.5, text: 'Control'       },
  { t: 34.0, l: 61.6, fs: 2.5, text: 'Responses'     },
  { t: 36.7, l: 61.6, fs: 2.5, text: 'Are——' },
  { t: 39.4, l: 61.6, fs: 2.5, text: 'Prebuilt'      },
  { t: 42.1, l: 61.6, fs: 2.5, text: 'Limited'       },
  { t: 44.8, l: 61.6, fs: 2.5, text: 'No Option'     },
  { t: 47.5, l: 61.6, fs: 2.5, text: 'Your Inputs'   },
  { t: 50.2, l: 61.6, fs: 2.5, text: 'Expected'      },

  // Footer
  { t: 83.5, l: 14.0, fs: 5.5, text: 'Sejong Art Gallery' },
  { t: 88.5, l:  9.0, fs: 5.5, text: 'Coma Nova — October 30, 2026' },
];

// ── DOM refs ──────────────────────────────────────────────────────
const posterWrapper = document.getElementById('poster-wrapper');
const hintsWrapper  = document.getElementById('hints-wrapper');
const mCvs          = document.getElementById('mask-canvas');
const orbEl         = document.getElementById('orb');
const hintEl        = document.getElementById('scroll-hint');
const mCtx          = mCvs.getContext('2d');

// ── Build hint elements ───────────────────────────────────────────
const allHW = WORDS.map(w => {
  const el = document.createElement('span');
  el.className = 'hw';
  el.textContent = w.text;
  el.style.top  = w.t + '%';
  el.style.left = w.l + '%';
  hintsWrapper.appendChild(el);
  return el;
});

// ── Spotlight state ───────────────────────────────────────────────
const EASE_POS  = 0.14;
const EASE_DEP  = 0.08;
const SPOT_FAR  = 0.66;
const SPOT_NEAR = 0.10;
const ORB_MIN   = 36;
const ORB_MAX   = 190;

let W = 0, H = 0, DIAG = 0;
let mx, my, sx, sy;
let tdep = 0.50, dep = 0.50;

// ── Wrapper geometry ──────────────────────────────────────────────
const POSTER_RATIO = 1420 / 2000; // width / height

function layoutWrapper() {
  W = window.innerWidth;
  H = window.innerHeight;
  DIAG = Math.sqrt(W * W + H * H);
  mCvs.width  = W;
  mCvs.height = H;

  // Calculate wrapper to fit within viewport, preserving aspect ratio
  let wW, wH;
  if (W / H < POSTER_RATIO) {
    wW = W;
    wH = W / POSTER_RATIO;
  } else {
    wH = H;
    wW = H * POSTER_RATIO;
  }
  const wL = (W - wW) / 2;
  const wT = (H - wH) / 2;

  [posterWrapper, hintsWrapper].forEach(el => {
    el.style.width  = wW + 'px';
    el.style.height = wH + 'px';
    el.style.left   = wL + 'px';
    el.style.top    = wT + 'px';
  });

  // Scale font sizes relative to wrapper height
  allHW.forEach((el, i) => {
    el.style.fontSize = (WORDS[i].fs / 100 * wH) + 'px';
  });

  if (mx === undefined) { mx = W / 2; my = H / 2; sx = W / 2; sy = H / 2; }
}

window.addEventListener('resize', layoutWrapper);
layoutWrapper();

// ── Input ─────────────────────────────────────────────────────────
let hintGone = false;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  if (!hintGone) { hintGone = true; hintEl.style.opacity = '0'; }
});
document.addEventListener('wheel', e => {
  tdep = Math.min(1, Math.max(0, tdep + e.deltaY * 0.0012));
}, { passive: true });

// ── Draw darkness + spotlight ─────────────────────────────────────
function drawMask() {
  const spotR = DIAG * (SPOT_FAR + (SPOT_NEAR - SPOT_FAR) * dep);
  const orbD  = ORB_MIN + (ORB_MAX - ORB_MIN) * dep;

  mCtx.globalCompositeOperation = 'source-over';
  mCtx.fillStyle = '#040406';
  mCtx.fillRect(0, 0, W, H);

  mCtx.globalCompositeOperation = 'destination-out';
  const g = mCtx.createRadialGradient(sx, sy, 0, sx, sy, spotR);
  g.addColorStop(0,    'rgba(0,0,0,1)');
  g.addColorStop(0.50, 'rgba(0,0,0,0.94)');
  g.addColorStop(0.76, 'rgba(0,0,0,0.52)');
  g.addColorStop(1,    'rgba(0,0,0,0)');
  mCtx.fillStyle = g;
  mCtx.fillRect(0, 0, W, H);
  mCtx.globalCompositeOperation = 'source-over';

  const r = orbD / 2;
  orbEl.style.width  = orbD + 'px';
  orbEl.style.height = orbD + 'px';
  orbEl.style.transform = `translate3d(${sx - r}px,${sy - r}px,0)`;
}

// ── Flash scheduler ───────────────────────────────────────────────
const MAX_LIT = 3;
let litCount = 0;

function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }

function flashStream() {
  if (litCount >= MAX_LIT) { setTimeout(flashStream, rnd(60, 140)); return; }
  const pool = allHW.filter(w => !w.classList.contains('lit'));
  if (!pool.length) { setTimeout(flashStream, 200); return; }

  const el = pool[Math.floor(Math.random() * pool.length)];
  el.classList.add('lit');
  litCount++;

  setTimeout(() => { el.classList.remove('lit'); litCount--; }, rnd(80, 420));
  setTimeout(flashStream, rnd(300, 1200));
}

// ── Animation loop ────────────────────────────────────────────────
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 16.667, 4);
  last = ts;
  const ep = 1 - Math.pow(1 - EASE_POS, dt);
  const ed = 1 - Math.pow(1 - EASE_DEP, dt);
  sx  += (mx  - sx)  * ep;
  sy  += (my  - sy)  * ep;
  dep += (tdep - dep) * ed;
  drawMask();
  requestAnimationFrame(loop);
}

// ── Boot ──────────────────────────────────────────────────────────
flashStream();
setTimeout(flashStream, rnd(200, 500));
setTimeout(flashStream, rnd(600, 1000));
requestAnimationFrame(loop);

}());
</script>
</body>
</html>
