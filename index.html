<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compass Spatial System</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    canvas { display: block; }

    .ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modes {
      display: flex;
      gap: 6px;
    }

    button {
      border: 1px solid #000;
      background: #fff;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.08em;
      transition: background 0.15s, color 0.15s;
    }

    button.active {
      background: #000;
      color: #fff;
    }

    .hint {
      font-size: 10px;
      color: #aaa;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

<div class="ui">
  <div class="modes">
    <button id="b1" onclick="setMode(1)" class="active">1 IDLE</button>
    <button id="b2" onclick="setMode(2)">2 DEPTH</button>
    <button id="b3" onclick="setMode(3)">3 TWIST</button>
    <button id="b4" onclick="setMode(4)">4 COLLAPSE</button>
    <button id="ba" onclick="toggleAuto()">AUTO</button>
  </div>
  <div class="hint">drag · 1–4 · A = auto-rotate</div>
</div>

<script>

// ── Mode & camera state ───────────────────────────────────
let mode       = 1
let autoRotate = false

let camRX  = 0.30,  camRY  = -0.18
let tgtRX  = 0.30,  tgtRY  = -0.18
let inerX  = 0,     inerY  = 0

let dragging = false
let px = 0, py = 0

// ── Structure ─────────────────────────────────────────────
const R = 170
const LABELS = ['N','NE','E','SE','S','SW','W','NW']

const BASE_ANGLES = [
  -Math.PI / 2,
  -Math.PI / 4,
   0,
   Math.PI / 4,
   Math.PI / 2,
   Math.PI * 3 / 4,
   Math.PI,
   Math.PI * 5 / 4
]

const EDGES = [
  [0,2],[2,4],[4,6],[6,0],   // cardinal cross
  [0,4],[2,6],               // main diagonals
  [1,5],[3,7],               // intercardinal diagonals
  [0,1],[1,2],[2,3],[3,4],   // perimeter
  [4,5],[5,6],[6,7],[7,0]
]

const FOV = 460

// ── Node ──────────────────────────────────────────────────
class Node {
  constructor(idx) {
    this.idx   = idx
    this.label = LABELS[idx]
    this.ang   = BASE_ANGLES[idx]

    this.bx = Math.cos(this.ang) * R
    this.by = Math.sin(this.ang) * R

    this.px = this.bx
    this.py = this.by
    this.pz = 0

    this.vx = 0
    this.vy = 0
    this.vz = 0
  }

  target(t) {
    const ph = this.bx * 0.009 + this.by * 0.004
    let tx = this.bx, ty = this.by, tz = 0

    if (mode === 1) {
      tz = Math.sin(t * 0.75 + ph) * 10
    }

    if (mode === 2) {
      tz  = Math.sin(t * 0.85 + ph) * 140
           + Math.cos(t * 0.5  + this.by * 0.008) * 60
      tx += Math.sin(t * 0.25 + ph) * 8
      ty += Math.cos(t * 0.3  + ph) * 8
    }

    if (mode === 3) {
      const a = t * 0.42 + this.ang
      tx = Math.cos(a) * R
      ty = Math.sin(a) * R
      tz = Math.sin(t * 0.65 + this.ang * 1.4) * 150
    }

    if (mode === 4) {
      const sc = 0.2 + 1.15 * (0.5 + 0.5 * Math.sin(t * 0.55))
      tx = this.bx * sc
      ty = this.by * sc
      tz = Math.sin(t * 1.7 + ph) * 190
    }

    return { x: tx, y: ty, z: tz }
  }

  update(t) {
    const tg = this.target(t)
    const sp = 0.072, dp = 0.80

    this.vx = (this.vx + (tg.x - this.px) * sp) * dp
    this.vy = (this.vy + (tg.y - this.py) * sp) * dp
    this.vz = (this.vz + (tg.z - this.pz) * sp) * dp

    this.px += this.vx
    this.py += this.vy
    this.pz += this.vz
  }
}

// ── Camera rotation (Y then X) ────────────────────────────
function rotateCamera(p, rx, ry) {
  // Y-axis rotation
  const cy = Math.cos(ry), sy = Math.sin(ry)
  let x1 = p.x * cy - p.z * sy
  let z1 = p.x * sy + p.z * cy

  // X-axis rotation
  const cx = Math.cos(rx), sx = Math.sin(rx)
  let y1 = p.y * cx - z1 * sx
  let z2 = p.y * sx + z1 * cx

  return { x: x1, y: y1, z: z2 }
}

// ── Perspective projection ────────────────────────────────
function project(p) {
  const s = FOV / (FOV + p.z + 60)
  return { sx: p.x * s, sy: p.y * s, z: p.z, s }
}

// ── Globals ───────────────────────────────────────────────
const nodes = []

function setup() {
  createCanvas(windowWidth, windowHeight)
  angleMode(RADIANS)
  for (let i = 0; i < 8; i++) nodes.push(new Node(i))
}

function draw() {
  background(255)

  const t = millis() * 0.001

  // Auto-rotate
  if (autoRotate) {
    tgtRY  += 0.0035
    tgtRX   = 0.26 * Math.sin(t * 0.17)
    inerX   = 0
    inerY   = 0
  }

  // Inertia after drag release
  if (!dragging && !autoRotate) {
    tgtRX += inerX
    tgtRY += inerY
    inerX *= 0.90
    inerY *= 0.90
  }

  // Smooth camera lerp
  camRX += (tgtRX - camRX) * 0.07
  camRY += (tgtRY - camRY) * 0.07

  // Update node physics
  for (const n of nodes) n.update(t)

  // Project all nodes through camera
  const pts = nodes.map(n => {
    const r = rotateCamera({ x: n.px, y: n.py, z: n.pz }, camRX, camRY)
    return project(r)
  })

  // Sort edges back-to-front for painter's algorithm
  const sortedEdges = EDGES.slice().sort((ea, eb) => {
    const za = (pts[ea[0]].z + pts[ea[1]].z) * 0.5
    const zb = (pts[eb[0]].z + pts[eb[1]].z) * 0.5
    return za - zb
  })

  translate(width / 2, height / 2)

  // Draw edges
  noFill()
  for (const [ai, bi] of sortedEdges) {
    const a = pts[ai], b = pts[bi]

    const avgZ  = (a.z + b.z) * 0.5
    const avgS  = (a.s + b.s) * 0.5
    const nearS = Math.max(a.s, b.s)

    // Depth cues: weight and alpha
    const w = constrain(map(avgS, 0.65, 1.35, 0.4, 2.4), 0.3, 2.8)
    const al = constrain(map(avgZ, -260, 260, 58, 235), 50, 240)

    stroke(0, 0, 0, al)
    strokeWeight(w)
    line(a.sx, a.sy, b.sx, b.sy)
  }

  // Draw nodes
  for (let i = 0; i < 8; i++) {
    const p  = pts[i]
    const sz = constrain(map(p.s, 0.65, 1.35, 3.5, 9.5), 3, 11)
    const al = constrain(map(p.z, -260, 260, 70, 255), 60, 255)

    noStroke()
    fill(0, 0, 0, al)
    ellipse(p.sx, p.sy, sz, sz)

    // Label — slightly offset above dot
    fill(0, 0, 0, constrain(al * 0.72, 45, 200))
    textSize(10)
    textAlign(CENTER, CENTER)
    text(nodes[i].label, p.sx, p.sy - sz * 0.5 - 9)
  }
}

// ── Drag rotation ─────────────────────────────────────────
function mousePressed() {
  dragging = true
  px = mouseX
  py = mouseY
  inerX = 0
  inerY = 0
}

function mouseDragged() {
  if (!dragging) return
  const dx = mouseX - px
  const dy = mouseY - py
  const speed = 0.007

  inerY = dx * speed
  inerX = dy * speed

  tgtRY += inerY
  tgtRX += inerX

  // Clamp vertical tilt
  tgtRX = constrain(tgtRX, -1.1, 1.1)

  px = mouseX
  py = mouseY
}

function mouseReleased() {
  dragging = false
}

// ── Keyboard controls ─────────────────────────────────────
function keyPressed() {
  if (key === '1') setMode(1)
  else if (key === '2') setMode(2)
  else if (key === '3') setMode(3)
  else if (key === '4') setMode(4)
  else if (key === 'a' || key === 'A') toggleAuto()
}

// ── UI helpers ────────────────────────────────────────────
function setMode(m) {
  mode = m
  for (let i = 1; i <= 4; i++) {
    const b = document.getElementById('b' + i)
    if (b) b.classList.toggle('active', i === m)
  }
}

function toggleAuto() {
  autoRotate = !autoRotate
  const b = document.getElementById('ba')
  if (b) b.classList.toggle('active', autoRotate)
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight)
}

</script>
</body>
</html>
