<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTO — Nueu Rules Into the Oddinary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── POSTER CONTAINER ── */
#poster-wrap {
  position: relative;
  /* Maintain A3-ish portrait ratio */
  width: min(100vw, calc(100vh * 0.707));
  height: min(100vh, calc(100vw / 0.707));
  max-width: 860px;
  max-height: 1215px;
}

#poster {
  position: absolute;
  inset: 0;
  background: #2B7A32;
  display: flex;
  flex-direction: column;
  padding: 5% 6%;
  font-family: 'Space Grotesk', 'Arial Narrow', Arial, sans-serif;
  overflow: hidden;
}

/* ── TAGLINE ── */
.tagline {
  font-size: clamp(9px, 1.5%, 13px);
  font-weight: 500;
  letter-spacing: 0.02em;
  color: #111;
  text-transform: none;
  line-height: 1;
  margin-bottom: 0.5%;
  font-style: normal;
}

/* ── HEADLINE BLOCK ── */
.headline {
  font-size: clamp(52px, 11.5%, 100px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.90;
  color: #111;
  text-transform: none;
  position: relative;
  z-index: 2;
  flex-shrink: 0;
}

/* ── 3D OBJECT AREA ── */
#canvas-wrap {
  position: absolute;
  /* Positioned to overlay the center-left of the poster, like image1.png */
  top: 18%;
  left: -8%;
  width: 90%;
  height: 62%;
  z-index: 1;
}

#three-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* ── BOTTOM SECTION ── */
.bottom {
  margin-top: auto;
  position: relative;
  z-index: 2;
}

/* ── FORTO LOGO ── */
.forto-logo {
  display: block;
  width: 100%;
  margin-bottom: 1.5%;
}

.url-line {
  font-size: clamp(8px, 1.3%, 12px);
  font-weight: 500;
  letter-spacing: 0.04em;
  color: #111;
  text-align: center;
}
</style>
</head>
<body>

<div id="poster-wrap">
  <div id="poster">

    <!-- Tagline -->
    <div class="tagline">A Next-Generation Space Travel Airline</div>

    <!-- Headline -->
    <div class="headline">
      Nueu Rules<br>
      Into the<br>
      <span style="color:#111;">Oddinary with</span><br>
      <span style="font-style:italic;">42</span>
    </div>

    <!-- Three.js canvas -->
    <div id="canvas-wrap">
      <canvas id="three-canvas"></canvas>
    </div>

    <!-- Bottom -->
    <div class="bottom">
      <!-- FORTO SVG logo -->
      <svg class="forto-logo" viewBox="0 0 800 140" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="FORTO">
        <!-- F -->
        <path d="M20 10 L20 130 L55 130 L55 80 L110 80 L110 50 L55 50 L55 40 L120 40 L120 10 Z" fill="#111"/>
        <!-- O -->
        <path d="M175 10 C130 10 130 130 175 130 L225 130 C270 130 270 10 225 10 Z M175 40 L225 40 C245 40 245 100 225 100 L175 100 C155 100 155 40 175 40 Z" fill="#111"/>
        <!-- R -->
        <path d="M290 10 L290 130 L325 130 L325 80 L355 80 L390 130 L430 130 L392 76 C415 68 420 50 407 30 C397 14 375 10 290 10 Z M325 40 L370 40 C385 40 388 65 370 65 L325 65 Z" fill="#111"/>
        <!-- T -->
        <path d="M445 10 L445 40 L495 40 L495 130 L530 130 L530 40 L580 40 L580 10 Z" fill="#111"/>
        <!-- O2 -->
        <path d="M635 10 C590 10 590 130 635 130 L685 130 C730 130 730 10 685 10 Z M635 40 L685 40 C705 40 705 100 685 100 L635 100 C615 100 615 40 635 40 Z" fill="#111"/>
        <!-- Stylized 4 arrow on F -->
        <path d="M20 130 L20 105 L0 105 L0 130 Z" fill="#111"/>
        <path d="M0 105 L20 80 L0 80 Z" fill="#111"/>
      </svg>
      <div class="url-line">www.fortonorules.co.kr</div>
    </div>

  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────
// STAGE 1 PLACEHOLDER: simple rotating box
// Will be replaced with full geometry in Stage 2
// ─────────────────────────────────────────────

const canvas  = document.getElementById('three-canvas');
const wrap    = document.getElementById('canvas-wrap');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 4.5);

// Temp placeholder mesh
const geo  = new THREE.BoxGeometry(1.8, 1.8, 1.8);
const mat  = new THREE.MeshBasicMaterial({ color: 0xF2F2F2, side: THREE.FrontSide });
const mesh = new THREE.Mesh(geo, mat);

const edgesGeo = new THREE.EdgesGeometry(geo);
const edgesMat = new THREE.LineBasicMaterial({ color: 0x222222, linewidth: 1.5 });
const edges    = new THREE.LineSegments(edgesGeo, edgesMat);

const group = new THREE.Group();
group.add(mesh);
group.add(edges);
scene.add(group);

function resize() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

resize();
window.addEventListener('resize', resize);

let mouseX = 0, mouseY = 0;
document.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth  - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.005;
  group.rotation.y = t;
  group.rotation.x = 0.3 + mouseY * 0.06;
  group.rotation.z = mouseX * 0.04;
  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
